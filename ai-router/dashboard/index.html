function CoachRow({ r }) {
    const st = CST[r.state] || CST.na;
    return (
        <div className="coach-row">
            <span className="coach-dot" style={{ background: st.c }}></span>
            <div className="coach-rowmain">
                <div className="coach-rowhead">
                    <span className="coach-rowlabel">{r.label}</span>
                    <span className="coach-rowval" style={{ color: st.c }}>{r.value}</span>
                    <span className="coach-rowstate" style={{ color: st.c, background: st.bg }}>{st.l}</span>
                </div>
                <div className="coach-rowwhy">{r.why}</div>
            </div>
        </div>
    );
}

function CoachAction({ a }) {
    const [copied, setCopied] = useState(false);
    const copy = () => {
        navigator.clipboard.writeText(a.prompt).then(() => {
            setCopied(true); setTimeout(() => setCopied(false), 2000);
        }).catch(() => {});
    };
    return (
        <div className={`coach-act ${a.urgent ? 'urgent' : ''}`}>
            <div className="coach-acthead">{a.urgent ? '⚠︎ ' : '→ '}{a.title}</div>
            <div className="coach-actwhy">{a.why}</div>
            <div className="coach-actprompt">{a.prompt}</div>
            <button className="coach-copy" onClick={copy}>{copied ? '✓ Copiato' : '⧉ Copia istruzione'}</button>
        </div>
    );
}

// Grassetto minimale **così** dentro le trappole
function coachRich(t) {
    const parts = String(t).split(/\*\*(.+?)\*\*/g);
    return parts.map((p, i) => i % 2 ? <strong key={i} style={{ color: '#e4e4e7' }}>{p}</strong> : <React.Fragment key={i}>{p}</React.Fragment>);
}

function Coach({ page }) {
    const cfg = COACH[page];
    // Aperto di default: un assistente che va scoperto non assiste. Si chiude e resta chiuso.
    const [open, setOpen] = useState(() => localStorage.getItem('coach_open') !== '0');
    const [tab, setTab] = useState(() => localStorage.getItem('coach_tab') || 'now');
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(false);

    useEffect(() => { localStorage.setItem('coach_open', open ? '1' : '0'); }, [open]);
    useEffect(() => { localStorage.setItem('coach_tab', tab); }, [tab]);

    useEffect(() => {
        if (!cfg || !open) return;
        const srcs = cfg.sources || [];
        if (!srcs.length) { setData({}); return; }
        let alive = true;
        setLoading(true); setData(null);
        Promise.all(srcs.map(s => api(s.p)))
            .then(res => {
                if (!alive) return;
                const d = {}; srcs.forEach((s, i) => { d[s.k] = res[i]; });
                setData(d); setLoading(false);
            })
            .catch(() => { if (alive) { setData({}); setLoading(false); } });
        return () => { alive = false; };
    }, [page, open, cfg]);

    if (!cfg) return null;

    // Stessa regola del Piano: se nessuna delle fonti del modulo è tornata, non
    // si legge il vuoto come se fosse un dato. Vale soprattutto qui, dove il
    // verdetto in barra ha l'aria di una diagnosi anche quando non c'è nulla dietro.
    const srcs = cfg.sources || [];
    const muto = !!srcs.length && !!data && srcs.every(s => nonRisposto(data[s.k]));
    let rows = [], actions = [];
    if (data && muto) {
        rows = [R('Lettura non riuscita', '—', 'na',
            `Nessuno degli endpoint del modulo ha risposto (${srcs.map(s => s.p).join(', ')}). Non è un dato a zero: è un dato che non è arrivato — nessun verdetto e nessuna azione finché non torna.`)];
    } else if (data) {
        try { rows = cfg.read(data) || []; } catch (e) { rows = [R('Lettura non disponibile', '—', 'na', 'Il modulo ha restituito dati in un formato inatteso: leggi i numeri direttamente in pagina.')]; }
        try { actions = cfg.actions ? (cfg.actions(data, rows) || []) : []; } catch (e) { actions = []; }
    }

    // Un modulo si dichiara "in soglia" solo se almeno metà delle righe è davvero valutata:
    // due righe informative e una verde non fanno un semaforo verde, fanno un dato mancante.
    const graded = rows.filter(r => r.state !== 'na');
    const worst = rows.some(r => r.state === 'bad') ? 'bad'
        : rows.some(r => r.state === 'watch') ? 'watch'
        : (graded.length && graded.length * 2 >= rows.length) ? 'ok' : 'na';
    const nBad = rows.filter(r => r.state === 'bad').length;
    const nWatch = rows.filter(r => r.state === 'watch').length;
    const verdict = !open ? 'Apri per la lettura guidata di questo modulo'
        : loading ? 'Lettura in corso…'
        : muto ? 'Gli endpoint del modulo non rispondono — nessun verdetto possibile'
        : worst === 'bad' ? `${nBad} ${nBad > 1 ? 'indicatori' : 'indicatore'} fuori soglia — c'è un'azione da prendere`
        : worst === 'watch' ? `${nWatch} ${nWatch > 1 ? 'indicatori' : 'indicatore'} da osservare — nessuna emergenza`
        : worst === 'ok' ? 'Tutti gli indicatori in soglia'
        : (cfg.sources || []).length === 0 ? 'Modulo operativo — nessuna metrica passiva da leggere'
        : 'Misurazione incompleta — non c\'è abbastanza dato per un verdetto';

    const dotColor = CST[worst]?.c || CST.na.c;

    return (
        <div className="coach">
            <div className="coach-bar" onClick={() => setOpen(!open)}>
                <span className="coach-badge">🧭 Copilota</span>
                <span className="coach-dot" style={{ background: dotColor }}></span>
                <span className="coach-verdict">{verdict}</span>
                <span className="coach-toggle">{open ? 'chiudi ▲' : 'apri ▼'}</span>
            </div>
            {open && (
                <div className="coach-panel">
                    <div className="coach-tabs">
                        {[['now', 'Cosa dice oggi'], ['do', 'Cosa faccio'], ['what', "Cos'è"], ['traps', 'Trappole']].map(([k, l]) => (
                            <div key={k} className={`coach-tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>
                                {l}{k === 'do' && actions.filter(a => a.urgent).length ? <span className="coach-tabdot"></span> : null}
                            </div>
                        ))}
                    </div>

                    {tab === 'now' && (
                        <div className="coach-body">
                            {loading && <div className="coach-empty">Lettura degli endpoint del modulo…</div>}
                            {!loading && !rows.length && <div className="coach-empty">Nessun dato leggibile in questo momento.</div>}
                            {!loading && rows.map((r, i) => <CoachRow key={i} r={r} />)}
                            {!loading && !!(cfg.sources || []).length && (
                                <div className="coach-src">Fonte: {(cfg.sources || []).map(s => <code key={s.p}>{s.p}</code>).reduce((acc, x, i) => i ? [...acc, ' · ', x] : [x], [])}</div>
                            )}
                        </div>
                    )}

                    {tab === 'do' && (
                        <div className="coach-body">
                            {!actions.length && <div className="coach-empty">Nessuna azione suggerita: apri "Cosa dice oggi" per la lettura del dato.</div>}
                            {actions.map((a, i) => <CoachAction key={i} a={a} />)}
                            <div className="coach-hint">Le istruzioni sono scritte per essere incollate in una sessione Claude Code: nominano già la skill giusta e il contesto necessario.</div>
                        </div>
                    )}

                    {tab === 'what' && (
                        <div className="coach-body">
                            <div className="coach-block"><div className="coach-blabel">Che cosa stai guardando</div><p>{cfg.what}</p></div>
                            <div className="coach-block"><div className="coach-blabel">A quale decisione serve</div><p>{cfg.decides}</p></div>
                            <div className="coach-block"><div className="coach-blabel">Ogni quanto guardarlo</div><p>{cfg.cadence}</p></div>
                        </div>
                    )}

                    {tab === 'traps' && (
                        <div className="coach-body">
                            <div className="coach-hint" style={{ marginTop: 0, marginBottom: 12 }}>Errori di lettura tipici di questo dato. Sono qui perché è più facile evitarli sapendo che esistono che accorgersene dopo.</div>
                            {(cfg.traps || []).map((t, i) => <div className="coach-trap" key={i}>{coachRich(t)}</div>)}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ─────────────────────────────────────────────────────────────
// PIANO D'AZIONE — consolida i consigli di tutti i moduli
// ------------------------------------------------------------
// Ogni azione del Copilota porta uno `stage` (1-5) che dice in
// quale punto della catena va eseguita, e una `key` che permette
// di riconoscere lo stesso intervento suggerito da più moduli.
// L'ordine non è per gravità: è per DIPENDENZA. Ottimizzare prima
// di aver sistemato la misurazione significa ottimizzare rumore.
// ─────────────────────────────────────────────────────────────
const PLAN_STAGES = [
    { n: 1, label: 'Misurare', rule: "Rendere affidabile il dato. Una decisione presa su una misurazione rotta sopravvive per settimane e nessuno la mette più in discussione." },
    { n: 2, label: 'Correggere le fondamenta', rule: "Parametri e dataset sbagliati non fanno rumore: si propagano con precisione in tutto ciò che sta a valle, compresi i consigli di questa stessa pagina." },
    { n: 3, label: 'Sbloccare', rule: "Colli di bottiglia sul lavoro già fatto. Non costano lavoro nuovo: liberano valore che è già stato prodotto e sta fermo." },
    { n: 4, label: 'Ottimizzare', rule: "Recuperare valore misurabile su ciò che già gira. Ha senso solo dopo i primi tre stadi, altrimenti si ottimizza contro numeri sbagliati." },
    { n: 5, label: 'Espandere', rule: "Aggiungere superficie nuova. È la parte più gratificante e per questo tende a saltare la fila: su fondamenta storte moltiplica l'errore invece del risultato." },
];

const MODULE_META = {
    executive: { icon: '📈', label: 'Dashboard Executive' },
    dashboard: { icon: '📊', label: 'Dashboard KPI' },
    notion: { icon: '📝', label: 'Notion Pipeline' },
    klaviyo: { icon: '📧', label: 'Klaviyo CRM' },
    seo: { icon: '🔍', label: 'SEO & Semrush' },
    content_library: { icon: '🗄️', label: 'Content Lake' },
    content: { icon: '🤖', label: 'Content AI' },
    semrush_data: { icon: '📂', label: 'Data Hub' },
    adv: { icon: '📣', label: 'ADV Intelligence' },
    agents: { icon: '🧠', label: 'Agenti AI' },
    terminal: { icon: '💬', label: 'Terminale AI' },
    gsc: { icon: '📊', label: 'GSC Indexing' },
    funnel: { icon: '🎯', label: 'User Journey Funnel' },
    logs: { icon: '🔧', label: 'System & Logs' },
    'adv-budget': { icon: '💰', label: 'ADV Allocator' },
};

const SEV_RANK = { bad: 0, watch: 1, ok: 2, na: 3 };

// Un endpoint che non risponde torna `null` da api(): non è "nessun dato",
// è "non lo sappiamo". Trattare le due cose allo stesso modo è ciò che rendeva
// il piano diverso da un accesso all'altro — la stessa pagina servita da un
// file server senza API dietro costruiva 15 voci apparentemente normali, che
// erano solo i consigli che non dipendono da nessuna lettura.
const nonRisposto = (v) => v === null || v === undefined;

function buildPlan(byPath) {
    const modules = [];
    const raw = [];
    const perse = new Set();          // endpoint che non hanno risposto
    const muti = [], parziali = [];   // moduli senza nessuna fonte viva / letti a metà
    Object.entries(COACH).forEach(([mod, cfg]) => {
        const srcs = cfg.sources || [];
        const morte = srcs.filter(s => nonRisposto(byPath[s.p]));
        morte.forEach(s => perse.add(s.p));
        // Nessuna fonte tornata: il modulo non dice "tutto a posto" e non dice
        // "fuori soglia". Non dice niente, e da niente non si ricava un consiglio.
        if (srcs.length && morte.length === srcs.length) {
            modules.push({ mod, sev: 'na', nBad: 0, nWatch: 0, muto: true });
            muti.push(mod);
            return;
        }
        if (morte.length) parziali.push(mod);
        const d = {};
        srcs.forEach(s => { d[s.k] = byPath[s.p]; });
        let rows = [], acts = [];
        try { rows = cfg.read(d) || []; } catch (e) { rows = []; }
        try { acts = cfg.actions ? (cfg.actions(d, rows) || []) : []; } catch (e) { acts = []; }
        const graded = rows.filter(r => r.state !== 'na');  // stessa regola del Copilota
        const sev = rows.some(r => r.state === 'bad') ? 'bad'
            : rows.some(r => r.state === 'watch') ? 'watch'
            : (graded.length && graded.length * 2 >= rows.length) ? 'ok' : 'na';
        modules.push({ mod, sev, nBad: rows.filter(r => r.state === 'bad').length, nWatch: rows.filter(r => r.state === 'watch').length, parziale: morte.length > 0 });
        acts.forEach(a => { if (a.plan !== false) raw.push({ ...a, mod, sev, stage: a.stage || 4 }); });
    });

    // Stesso intervento suggerito da più moduli → una voce sola, con l'elenco di dove ricorre.
    const byKey = new Map();
    raw.forEach(it => {
        const k = it.key || (it.mod + '|' + it.title);
        const cur = byKey.get(k);
        if (!cur) { byKey.set(k, { ...it, also: [] }); return; }
        const curWins = cur.urgent !== it.urgent ? cur.urgent : SEV_RANK[cur.sev] <= SEV_RANK[it.sev];
        const win = curWins ? cur : it, lose = curWins ? it : cur;
        byKey.set(k, { ...win, also: [...(cur.also || []), lose.mod].filter(m => m !== win.mod) });
    });

    const list = [...byKey.values()].sort((a, b) =>
        a.stage - b.stage
        || (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0)
        || SEV_RANK[a.sev] - SEV_RANK[b.sev]
        || a.title.localeCompare(b.title)
    );
    list.forEach((it, i) => { it.rank = i + 1; });
    const totali = Object.keys(byPath).length;
    return { list, modules, letture: { totali, perse: [...perse], muti, parziali } };
}

// Stato di avanzamento: le voci segnate come fatte escono dalla lista attiva.
// Non è una to-do list: se dopo RESURFACE_DAYS i dati continuano a generare
// la stessa voce, torna in lista marcata "riaperta" — perché segnarla fatta
// non è la prova che sia stata risolta. La prova è che il dato smetta di chiederla.
//
// Lo stato vive sul server (/v1/plan/done). Prima stava nel localStorage, che è
// per-origine: le stesse spunte risultavano fatte su un dominio della tower e
// ancora aperte sull'altro. Il localStorage resta come specchio — regge il primo
// paint e tiene la pagina utilizzabile se l'API non risponde — ma la fonte è il DB.
const PLAN_DONE_KEY = 'plan_done';
const RESURFACE_DAYS = 7;
const loadDone = () => { try { return JSON.parse(localStorage.getItem(PLAN_DONE_KEY) || '{}'); } catch (e) { return {}; } };
const saveDone = (d) => { try { localStorage.setItem(PLAN_DONE_KEY, JSON.stringify(d)); } catch (e) {} };
const dateIt = (iso) => { try { return new Date(iso).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' }); } catch (e) { return '—'; } };

function PlanItem({ it, onDone }) {
    const [copied, setCopied] = useState(false);
    const [exec, setExec] = useState(null);
    const meta = MODULE_META[it.mod] || { icon: '•', label: it.mod };

    const copy = () => {
        navigator.clipboard.writeText(it.prompt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }).catch(() => {});
    };

    // L'esecuzione non è una simulazione: gli agenti della tower possono avviare
    // scansioni, ricalcoli e sincronizzazioni reali. Quindi si conferma prima.
    const run = async () => {
        const ok = window.confirm(
            "Questa istruzione viene eseguita ORA sugli agenti della tower e puo avere effetti reali "
            + "(avviare una scansione, un ricalcolo, una sincronizzazione).\n\n"
            + it.prompt.slice(0, 300) + (it.prompt.length > 300 ? '…' : '') + "\n\nProcedo?"
        );
        if (!ok) return;
        setExec({ loading: true });
        try {
            const res = await fetch(`${ML_API}/v1/terminal/execute?command=${encodeURIComponent(it.prompt)}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
            });
            const raw = await res.text();
            let d;
            try { d = JSON.parse(raw); } catch (e) { setExec({ error: `Risposta non JSON (HTTP ${res.status}): ${raw.slice(0, 200)}` }); return; }
            if (d.error) { setExec({ error: d.error, agent: d.agent }); return; }
            const text = d.result || d.response || (d.data ? JSON.stringify(d.data, null, 2) : '');
            setExec({
                text: text || 'La risposta non contiene testo. Payload: ' + JSON.stringify(d).slice(0, 400),
                agent: d.agent, action: d.action, latency: d.latency_ms,
            });
        } catch (e) { setExec({ error: e.message }); }
    };

    return (
        <div className={`plan-item ${it.urgent ? 'urgent' : ''} ${it.resurfaced ? 'resurfaced' : ''}`}>
            <div className="plan-rank">{it.rank}</div>
            <div className="plan-main">
                <div className="plan-head">
                    <span className="plan-title">{it.urgent ? '⚠︎ ' : ''}{it.title}</span>
                    <span className="plan-mod">{meta.icon} {meta.label}</span>
                    {!!(it.also || []).length && (
                        <span className="plan-also">segnalato anche in {it.also.map(m => (MODULE_META[m] || {}).label || m).join(', ')}</span>
                    )}
                    {it.resurfaced && <span className="plan-reopen">riaperta — segnata fatta il {dateIt(it.resurfaced)}, il dato la chiede ancora</span>}
                </div>
                <div className="plan-why">{it.why}</div>
                <div className="coach-actprompt">{it.prompt}</div>
                <div className="plan-btns">
                    <button className="coach-copy" onClick={copy}>{copied ? '✓ Copiato' : '⧉ Copia istruzione'}</button>
                    <button className="plan-run" onClick={run} disabled={exec && exec.loading} title="Esegue l'istruzione sugli agenti interni della tower — con conferma, perché può avere effetti reali">
                        {exec && exec.loading ? '… in esecuzione' : '▶ Esegui nel Terminale AI'}
                    </button>
                    <button className="plan-donebtn" onClick={() => onDone(it.key, it.title)}>✓ Segna come fatta</button>
                </div>
                {exec && !exec.loading && (
                    <div className={`plan-exec ${exec.error ? 'err' : ''}`}>
                        <div className="plan-execmeta">{exec.error ? 'Errore' : `Risposta · ${exec.agent || 'sistema'}`}{exec.action ? ` · azione: ${exec.action}` : ''}{exec.latency ? ` · ${exec.latency}ms` : ''}</div>
                        <div className="plan-exectext">{exec.error || exec.text}</div>
                    </div>
                )}
            </div>
        </div>
    );
}

function PlanPage() {
    const [byPath, setByPath] = useState(null);
    const [loading, setLoading] = useState(true);
    const [done, setDone] = useState(loadDone);
    const [showDone, setShowDone] = useState(false);
    const [copiedAll, setCopiedAll] = useState(false);
    const [condiviso, setCondiviso] = useState(null); // null = ancora da stabilire

    const applica = useCallback((res) => {
        if (!res || !res.items) return false;
        setDone(res.items); saveDone(res.items); setCondiviso(true);
        return true;
    }, []);

    // All'apertura: il server è la verità. Le spunte fatte prima che lo stato
    // diventasse condiviso vivono solo qui: si salgono una volta sola.
    useEffect(() => {
        let vivo = true;
        (async () => {
            const res = await api('/v1/plan/done');
            if (!vivo) return;
            if (!res || !res.items) { setCondiviso(false); return; }
            const locali = loadDone();
            const daMigrare = Object.keys(locali).filter(k => !(k in res.items));
            if (!daMigrare.length) { applica(res); return; }
            for (const k of daMigrare) {
                await api('/v1/plan/done', { method: 'POST', body: JSON.stringify({ key: k, title: (locali[k] || {}).title || k }) });
            }
            const dopo = await api('/v1/plan/done');
            if (vivo) applica(dopo) || setCondiviso(false);
        })();
        return () => { vivo = false; };
    }, [applica]);

    // A gruppi di tre, non tutte insieme. Il pool di connessioni del ml-worker e'
    // da 10 (pool_size 5 + overflow 5): una raffica di 12 richieste lo esaurisce e
    // le letture scadono in timeout invece di tornare, lasciando il piano vuoto.
    // Il piano si apre a mano: qualche secondo in piu' non si nota, una pagina vuota si.
    const load = useCallback(() => {
        const paths = [...new Set(Object.values(COACH).flatMap(c => (c.sources || []).map(s => s.p)))];
        setLoading(true);
        (async () => {
            const m = {};
            const AMPIEZZA = 3;
            for (let i = 0; i < paths.length; i += AMPIEZZA) {
                const gruppo = paths.slice(i, i + AMPIEZZA);
                const res = await Promise.all(gruppo.map(p => api(p)));
                gruppo.forEach((p, k) => { m[p] = res[k]; });
            }
            setByPath(m);
            setLoading(false);
        })().catch(() => { setByPath({}); setLoading(false); });
    }, []);
    useEffect(() => { load(); }, [load]);

    // Scritture ottimistiche: la lista si aggiorna subito, poi il server conferma.
    const markDone = (k, title) => {
        const d = { ...done, [k]: { at: new Date().toISOString(), title } };
        setDone(d); saveDone(d);
        api('/v1/plan/done', { method: 'POST', body: JSON.stringify({ key: k, title }) }).then(applica);
    };
    const reopen = (k) => {
        const d = { ...done }; delete d[k];
        setDone(d); saveDone(d);
        api(`/v1/plan/done/${encodeURIComponent(k)}`, { method: 'DELETE' }).then(applica);
    };
    const clearConfirmed = () => {
        const ancoraGenerate = new Set(all.map(i => i.key));
        const daPulire = Object.keys(done).filter(k => !ancoraGenerate.has(k));
        const d = {}; Object.entries(done).forEach(([k, v]) => { if (ancoraGenerate.has(k)) d[k] = v; });
        setDone(d); saveDone(d);
        (async () => {
            let ultimo = null;
            for (const k of daPulire) ultimo = await api(`/v1/plan/done/${encodeURIComponent(k)}`, { method: 'DELETE' });
            applica(ultimo);
        })();
    };

    const { list: all, modules, letture } = byPath ? buildPlan(byPath) : { list: [], modules: [], letture: null };
    const perse = letture ? letture.perse.length : 0;
    const cieco = !!letture && perse === letture.totali;  // nessun endpoint ha risposto
    const nomeMod = (m) => (MODULE_META[m] || {}).label || m;

    // 3 stati: attive · segnate fatte ma ancora generate dai dati · confermate (sparite dai dati)
    const nowMs = Date.now();
    const active = [], completed = [];
    all.forEach(it => {
        const rec = done[it.key];
        if (!rec) { active.push(it); return; }
        const days = (nowMs - new Date(rec.at).getTime()) / 864e5;
        if (days >= RESURFACE_DAYS) active.push({ ...it, resurfaced: rec.at });
        else completed.push({ ...it, doneAt: rec.at });
    });
    active.forEach((it, i) => { it.rank = i + 1; });
    const generatedKeys = new Set(all.map(i => i.key));
    const confirmed = Object.entries(done).filter(([k]) => !generatedKeys.has(k));
    const urgent = active.filter(i => i.urgent).length;

    const planText = () => {
        const head = `PIANO D'AZIONE micron-è — ${new Date().toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' })}\n`
            + `Ordine di esecuzione: misurare → fondamenta → sbloccare → ottimizzare → espandere\n`
            + `${active.length} interventi aperti${urgent ? `, di cui ${urgent} urgenti` : ''}`
            + `${completed.length ? ` · ${completed.length} segnati come fatti` : ''}.\n`
            // Il piano finisce incollato in una sessione Claude Code: se è stato
            // costruito su letture mancanti, deve dirlo lì dentro, non solo a schermo.
            + (perse ? `ATTENZIONE — piano PARZIALE: ${perse} endpoint su ${letture.totali} non hanno risposto`
                + `${letture.muti.length ? `; moduli esclusi: ${letture.muti.map(nomeMod).join(', ')}` : ''}`
                + `${letture.parziali.length ? `; letti a metà: ${letture.parziali.map(nomeMod).join(', ')}` : ''}.`
                + ` Non usarlo per decidere finché la tower non risponde per intero.\n` : '')
            + `Eseguili nell'ordine: ogni stadio presuppone il precedente.\n`;
        const body = active.map(it => {
            const st = PLAN_STAGES.find(s => s.n === it.stage);
            const meta = MODULE_META[it.mod] || { label: it.mod };
            return `\n${it.rank}. [${st ? st.label : '—'} · ${meta.label}]${it.urgent ? ' ⚠ URGENTE' : ''} ${it.title}\n   Perché: ${it.why}\n   Istruzione: ${it.prompt}`;
        }).join('\n');
        return head + body;
    };
    const copyAll = () => {
        navigator.clipboard.writeText(planText()).then(() => { setCopiedAll(true); setTimeout(() => setCopiedAll(false), 2500); }).catch(() => {});
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Piano d'Azione</h2>
                <div style={{ display: 'flex', gap: '10px' }}>
                    <button className="plan-cta" onClick={copyAll}>{copiedAll ? '✓ Piano copiato negli appunti' : `⧉ Copia il piano completo (${active.length})`}</button>
                    <button className="refresh-btn" onClick={load}>↻ Ricalcola</button>
                </div>
            </div>

            <div className="plan-intro">
                Tutti i consigli dei moduli della tower, deduplicati e messi in <strong>ordine di esecuzione</strong>, non di gravità.
                L'ordine segue la catena di dipendenza: non si ottimizza ciò che non si misura, e non si espande su fondamenta sbagliate.
                Il piano è ricalcolato dai dati correnti a ogni apertura — quando segni una voce come fatta esce dalla lista, ma se dopo {RESURFACE_DAYS} giorni
                i dati continuano a chiederla torna marcata <em>riaperta</em>: la prova che un intervento è chiuso non è la spunta, è che il dato smetta di generarlo.
            </div>

            {loading && <div className="coach-empty" style={{ padding: '20px 0' }}>Lettura di tutti i moduli in corso…</div>}

            {!loading && !!perse && (
                <div className={`plan-alert ${cieco ? 'cieco' : ''}`}>
                    <div className="plan-alerthead">
                        {cieco
                            ? `Nessuno dei ${letture.totali} endpoint della tower ha risposto — questo non è il piano`
                            : `${perse} endpoint su ${letture.totali} non hanno risposto — piano parziale`}
                    </div>
                    <div className="plan-alertbody">
                        {cieco ? (
                            <React.Fragment>
                                Le voci qui sotto sono soltanto quelle che non dipendono da nessuna lettura: compaiono sempre, anche a tower spenta.
                                Tutti i moduli che leggono un dato sono esclusi. Succede quando la pagina è aperta da un file server statico
                                (es. <code>localhost</code>) che non ha dietro l'API, oppure quando l'accesso non è autenticato:
                                apri la tower dal suo dominio — <code>tower.worldofmerino.com</code> o <code>tower.merinouniversity.com</code> — dove <code>/v1/*</code> risponde davvero.
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                {!!letture.muti.length && <React.Fragment><strong>Esclusi dal piano</strong> (nessuna fonte tornata): {letture.muti.map(nomeMod).join(', ')}. </React.Fragment>}
                                {!!letture.parziali.length && <React.Fragment><strong>Letti a metà</strong> (qualche fonte manca, le soglie restano attive sul resto): {letture.parziali.map(nomeMod).join(', ')}. </React.Fragment>}
                                Finché non tornano, il piano descrive una parte del sistema: <strong>ricalcola</strong> prima di prendere decisioni di budget o priorità.
                            </React.Fragment>
                        )}
                        <div className="plan-alertsrc">Non hanno risposto: {letture.perse.map(p => <code key={p}>{p}</code>).reduce((acc, x, i) => i ? [...acc, ' · ', x] : [x], [])}</div>
                    </div>
                </div>
            )}

            {!loading && (
                <React.Fragment>
                    <div className="plan-summary">
                        <div className="plan-kpi">
                            <div className="plan-kpin">{active.length}</div>
                            <div className="plan-kpil">interventi aperti</div>
                        </div>
                        <div className="plan-kpi">
                            <div className="plan-kpin" style={{ color: urgent ? '#f87171' : '#4ade80' }}>{urgent}</div>
                            <div className="plan-kpil">urgenti</div>
                        </div>
                        <div className="plan-kpi">
                            <div className="plan-kpin" style={{ color: '#4ade80' }}>{confirmed.length}</div>
                            <div className="plan-kpil">chiusi e confermati</div>
                        </div>
                        <div className="plan-sync" title={condiviso ? 'Le spunte stanno sul server: valgono su ogni dominio della tower e su ogni browser.' : 'Il server non risponde: le spunte restano su questo browser e non sono visibili altrove.'}>
                            <span className="coach-dot" style={{ background: condiviso === null ? CST.na.c : condiviso ? CST.ok.c : CST.watch.c }}></span>
                            {condiviso === null ? 'stato in sincronizzazione…' : condiviso ? 'spunte condivise fra i domini' : 'spunte solo su questo browser'}
                        </div>
                        <div className="plan-modstrip">
                            {modules.map(m => {
                                const meta = MODULE_META[m.mod] || { icon: '•', label: m.mod };
                                const nota = m.muto ? 'nessuna fonte ha risposto: escluso dal piano'
                                    : m.parziale ? `letto a metà — ${m.nBad} fuori soglia · ${m.nWatch} da osservare, su fonti incomplete`
                                    : `${m.nBad} fuori soglia · ${m.nWatch} da osservare`;
                                return (
                                    <span className={`plan-modchip ${m.muto ? 'muto' : ''}`} key={m.mod} title={nota}>
                                        <span className="coach-dot" style={{ background: (CST[m.sev] || CST.na).c }}></span>
                                        {meta.label}{m.parziale ? ' ½' : ''}
                                    </span>
                                );
                            })}
                        </div>
                    </div>

                    {!active.length && (
                        <div className="plan-clear">
                            {perse
                                ? "Nessun intervento in lista, ma non è un via libera: i moduli che avrebbero potuto segnalarne non sono stati letti."
                                : "Nessun intervento aperto: i moduli non stanno segnalando nulla che richieda un'azione."}
                        </div>
                    )}

                    {PLAN_STAGES.map(st => {
                        const items = active.filter(i => i.stage === st.n);
                        if (!items.length) return null;
                        return (
                            <div className="plan-stage" key={st.n}>
                                <div className="plan-stagehead">
                                    <span className="plan-stagen">{st.n}</span>
                                    <span className="plan-stagelabel">{st.label}</span>
                                    <span className="plan-stagecount">{items.length} intervent{items.length > 1 ? 'i' : 'o'}</span>
                                </div>
                                <div className="plan-stagerule">{st.rule}</div>
                                {items.map(it => <PlanItem key={it.key} it={it} onDone={markDone} />)}
                            </div>
                        );
                    })}

                    {(completed.length > 0 || confirmed.length > 0) && (
                        <div className="plan-donebox">
                            <div className="plan-donehead" onClick={() => setShowDone(!showDone)}>
                                <span>✓ Segnate come fatte ({completed.length}){confirmed.length ? ` · confermate dai dati (${confirmed.length})` : ''}</span>
                                <span className="plan-donetoggle">{showDone ? 'nascondi ▲' : 'mostra ▼'}</span>
                            </div>
                            {showDone && (
                                <div className="plan-donebody">
                                    {completed.map(it => (
                                        <div className="plan-donerow" key={it.key}>
                                            <span className="plan-donetitle">{it.title}</span>
                                            <span className="plan-donemeta">
                                                segnata il {dateIt(it.doneAt)} · il dato la genera ancora, torna in lista fra {Math.max(0, Math.ceil(RESURFACE_DAYS - (nowMs - new Date(it.doneAt).getTime()) / 864e5))} g
                                            </span>
                                            <button className="plan-link" onClick={() => reopen(it.key)}>riapri</button>
                                        </div>
                                    ))}
                                    {confirmed.map(([k, v]) => (
                                        <div className="plan-donerow ok" key={k}>
                                            <span className="plan-donetitle">{v.title}</span>
                                            <span className="plan-donemeta">segnata il {dateIt(v.at)} · <strong style={{ color: '#4ade80' }}>confermata</strong>: i dati non la segnalano più</span>
                                        </div>
                                    ))}
                                    {!!confirmed.length && <button className="plan-link" style={{ marginTop: '8px' }} onClick={clearConfirmed}>pulisci le confermate dallo storico</button>}
                                </div>
                            )}
                        </div>
                    )}

                    <div className="plan-foot">
                        Il piano legge {[...new Set(Object.values(COACH).flatMap(c => (c.sources || []).map(s => s.p)))].length} endpoint e applica le stesse soglie del Copilota.
                        Quando lo stesso intervento è suggerito da più moduli compare una volta sola, sotto il modulo che lo motiva meglio.
                        <br />
                        Le spunte sono salvate sul server (<code>/v1/plan/done</code>), non nel browser: valgono su tower.worldofmerino.com, su tower.merinouniversity.com e su qualunque altro accesso.
                        Riaprire una voce non cancella lo storico, lo marca — serve al meccanismo che la ripropone dopo {RESURFACE_DAYS} giorni se i dati continuano a chiederla.
                        <br />
                        <strong style={{ color: '#a1a1aa' }}>Esegui nel Terminale AI</strong> lancia l'istruzione sugli agenti interni della tower (dati reali, risposta in pagina).
                        Le istruzioni che nominano una skill — semrush-specialist, adv-budget-allocator, albeni-wp-operator — vivono invece in Claude Code: lì il pulsante di copia è la via giusta,
                        perché la tower non può aprire una sessione Claude Code.
                    </div>
                </React.Fragment>
            )}
        </React.Fragment>
    );
}

function DashboardPage({ health, notionStats }) {
    const [metrics, setMetrics] = useState(null);
    const clusterChart = useRef(null);
    const funnelChart = useRef(null);

    useEffect(() => { api('/v1/dashboard/metrics').then(setMetrics); }, []);
    const [traffic, setTraffic] = useState(null);
    useEffect(() => {
        const load = () => api('/v1/dashboard/traffic?hours=24').then(setTraffic).catch(() => {});
        load();
        const t = setInterval(load, 60000);
        return () => clearInterval(t);
    }, []);

    useEffect(() => {
        // Fix 2026-05-06: usa metrics (visitatori) come fonte primaria; notionStats è fallback per contenuti.
        // Bug A: il guard precedente usciva se notionStats era null (Notion not_configured) bloccando entrambi i chart.
        // Bug B: typo nel funnel chart che riassegnava clusterChart.current invece di funnelChart.current.
        const clusterData = (metrics && metrics.cluster_distribution) || (notionStats && notionStats.by_cluster) || {};
        const funnelData  = (metrics && metrics.intent_stage_distribution) || (notionStats && notionStats.by_funnel) || {};
        if (!Object.keys(clusterData).length && !Object.keys(funnelData).length) return;
        // Cluster chart
        if (clusterChart.current) clusterChart.current.destroy();
        const ctx1 = document.getElementById('clusterChart')?.getContext('2d');
        if (ctx1 && Object.keys(clusterData).length) {
            clusterChart.current = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(clusterData),

// NOTION PIPELINE PAGE
// ============================================================
function NotionPage({ onStatsUpdate }) {
    const [tasks, setTasks] = useState([]);
    const [loading, setLoading] = useState(true);
    const [generating, setGenerating] = useState(false);
    const [genResults, setGenResults] = useState(null);
    const [genLimit, setGenLimit] = useState(1);

    const loadTasks = async () => {
        setLoading(true);
        const data = await api('/v1/notion/pipeline');
        setTasks(data?.tasks || []);
        setLoading(false);
        const stats = await api('/v1/notion/pipeline/stats');
        if (stats && onStatsUpdate) onStatsUpdate(stats);
    };

    useEffect(() => { loadTasks(); }, []);

    const generateContent = async () => {
        setGenerating(true);
        setGenResults(null);
        const data = await api(`/v1/notion/generate-from-pipeline?limit=${genLimit}`, { method: 'POST' });
        setGenResults(data);
        setGenerating(false);
        loadTasks();
    };

    const statusBadge = (status) => {
        const map = { 'Da Fare': 'badge-red', 'In Produzione': 'badge-yellow', 'In Traduzione': 'badge-purple', 'In Revisione': 'badge-blue', 'Pubblicato': 'badge-green' };
        return <span className={`badge ${map[status] || 'badge-gray'}`}>{status || '—'}</span>;
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Notion Content Pipeline</h2>
                <div className="btn-group">
                    <button className="btn btn-secondary" onClick={loadTasks}>Aggiorna</button>
                </div>
            </div>

            <div className="card" style={{marginBottom:'20px', display:'flex', alignItems:'center', gap:'16px', flexWrap:'wrap'}}>
                <span style={{fontSize:'13px',color:'#a1a1aa'}}>Genera contenuti AI per i task "Da Fare":</span>
                <select value={genLimit} onChange={e=>setGenLimit(Number(e.target.value))}
                    style={{background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'6px 12px',fontSize:'13px'}}>
                    {[1,2,3,5,10].map(n => <option key={n} value={n}>{n} task</option>)}
                </select>
                <button className="btn btn-primary" onClick={generateContent} disabled={generating}>
                    {generating ? <React.Fragment><span className="spinner" style={{marginRight:'8px'}}></span> Generando...</React.Fragment> : '🤖 Genera + Valida'}
                </button>
            </div>

            {genResults && (
                <div className="card" style={{marginBottom:'20px', borderColor: genResults.results?.every(r=>r.validation_passed) ? '#166534' : '#92400e'}}>
                    <h3 style={{fontSize:'14px',marginBottom:'12px',color:'#fafafa'}}>Risultati Generazione</h3>
                    {genResults.results?.map((r, i) => (
                        <div key={i} style={{padding:'10px 0', borderBottom:'1px solid #27272a'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                <span style={{fontWeight:500,color:'#e4e4e7'}}>{r.title}</span>
                                <span className={`badge ${r.validation_passed ? 'badge-green' : 'badge-red'}`}>
                                    CQS: {r.cqs_score}/100 {r.validation_passed ? '✅' : '❌'}
                                </span>
                            </div>
                            {r.errors?.length > 0 && <div style={{color:'#f87171',fontSize:'12px',marginTop:'6px'}}>{r.errors.join(' | ')}</div>}
                            {r.warnings?.length > 0 && <div style={{color:'#fbbf24',fontSize:'12px',marginTop:'4px'}}>{r.warnings.join(' | ')}</div>}
                            <div style={{color:'#52525b',fontSize:'11px',marginTop:'4px'}}>Model: {r.model_used} | AI Verdict: {r.ai_verdict || '—'} | Tokens: {r.tokens_used || 0}</div>
                        </div>
                    ))}
                </div>
            )}

            <div className="table-wrap">
                <div className="table-header">
                    <h3>Tutti i Contenuti ({tasks.length})</h3>
                </div>
                <table>
                    <thead>
                        <tr><th>Contenuto</th><th>Cluster</th><th>Dominio</th><th>Funnel</th><th>Lingua</th><th>Mese</th><th>Stato</th></tr>
                    </thead>
                    <tbody>
                        {loading ? <tr><td colSpan={7} style={{textAlign:'center'}}><span className="spinner"></span></td></tr> :
                        tasks.map((t, i) => (
                            <tr key={i}>
                                <td style={{fontWeight:500,maxWidth:'250px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.title}</td>
                                <td><span className="badge badge-purple">{t.cluster || '—'}</span></td>
                                <td style={{fontSize:'12px'}}>{t.domain || '—'}</td>
                                <td><span className={`badge ${t.funnel_stage==='TOFU'?'badge-blue':t.funnel_stage==='MOFU'?'badge-yellow':'badge-red'}`}>{t.funnel_stage || '—'}</span></td>
                                <td>{(t.languages||[]).join(', ')}</td>
                                <td>{t.month || '—'}</td>
                                <td>{statusBadge(t.status)}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </React.Fragment>
    );
}

    const [syncResult, setSyncResult] = useState(null);

    useEffect(() => {
        Promise.all([
            api('/v1/dashboard/crm-overview'),
            api('/v1/dashboard/metrics')
        ]).then(([ov, m]) => {
            setOverview(ov);
            setSyncHealth(m?.metrics?.klaviyo_sync_health || m?.klaviyo_sync_health || null);

        });

        const n = (name || '').toLowerCase();
        if (n.startsWith('wom') || n.includes('worldofmerino')) return { label: 'WoM', color: '#60a5fa' };
        if (n.startsWith('mu') || n.includes('manifesto') || n.includes('cpw')) return { label: 'MU', color: '#a78bfa' };
        return { label: '—', color: '#52525b' };
    };

    const testSync = async () => {
        setSyncing(true);
        const result = await api('/v1/crm/sync-lead', {
            method: 'POST',
            body: JSON.stringify({
                email: 'test-dashboard@micron-e.com',
                ids_score: 55,
                cluster_tag: 'conscious_premium',
                intent_stage: 'MOFU',
                source_domain: 'worldofmerino.com',
                language: 'it'
            })
        });
        setSyncResult(result);
        setSyncing(false);
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Klaviyo CRM</h2>
            </div>

            <div className="cards-grid">
                <div className="card">
                    <div className="card-label">Account</div>
                    <div className="card-value" style={{fontSize:'18px'}}>Best Before Srl</div>
                    <div className="card-sub">Unico account per tutto l'ecosistema (WoM + MU + store)</div>
                </div>
                <div className="card">
                    <div className="card-label">Stato</div>
                    {loading
                        ? <div className="card-value" style={{fontSize:'18px'}}>…</div>
                        : (overview && !overview.lists_error && !overview.flows_error)
                            ? <div className="card-value green" style={{fontSize:'18px'}}>Connesso</div>
                            : <div className="card-value" style={{fontSize:'18px',color:'#f59e0b'}}>Parziale</div>}
                    <div className="card-sub">{overview?.cached ? 'Dati in cache (≤5 min)' : 'Lettura live API Klaviyo'}</div>
                </div>
                <div className="card">
                    <div className="card-label">Lead 24h (catena arricchimento)</div>
                    <div className="card-value" style={{fontSize:'18px'}}>{syncHealth ? syncHealth.last_24h_leads : '…'}</div>
                    <div className="card-sub">{syncHealth ? `${syncHealth.last_24h_total} sync · ${syncHealth.success_rate}% ok` : 'da klaviyo_sync_log'}</div>
                </div>
            </div>

            {syncHealth?.last_24h_by_domain && (
                <div className="card" style={{marginBottom:'20px'}}>
                    <h3 style={{fontSize:'15px',marginBottom:'8px',color:'#fafafa'}}>🌐 Sync 24h per dominio di provenienza</h3>
                    <p style={{fontSize:'12px',color:'#a1a1aa',marginBottom:'12px'}}>

                    {Object.keys(syncHealth.last_24h_by_domain).length === 0

                        : <table style={{width:'100%'}}>
                            <thead><tr><th>Dominio</th><th>Sync</th><th>Lead distinti</th></tr></thead>
                            <tbody>
                                {Object.entries(syncHealth.last_24h_by_domain)
                                    .sort((a,b) => b[1].syncs - a[1].syncs)
                                    .map(([dom, v]) => (
                                    <tr key={dom}>
                                        <td>{dom}</td>
                                        <td>{v.syncs}</td>
                                        <td>{v.leads}</td>
                                    </tr>
                                ))}
                            </tbody>

            <div className="card" style={{marginBottom:'20px'}}>

}

// CONTENT AI PAGE (Generator + Validator)

function ContentPage() {
    const [cluster, setCluster] = useState('business_professional');
    const [language, setLanguage] = useState('it');
    const [contentType, setContentType] = useState('email_copy');
    const [domain, setDomain] = useState('perfectmerinoshirt.com');
    const [result, setResult] = useState(null);
    const [generating, setGenerating] = useState(false);
    const [savedToast, setSavedToast] = useState(false);

    const clusters = ['business_professional','heritage_mature','conscious_premium','modern_minimalist','italian_authentic'];
    const types = ['email_copy','blog_draft','landing_copy','lead_magnet'];
    const domains = ['worldofmerino.com','merinouniversity.com','perfectmerinoshirt.com','micron-e.com'];
    const langs = ['it','en','de','fr','es'];

    const generate = async () => {
        setGenerating(true);
        const data = await api('/v1/content/generate', {
            method: 'POST',
            body: JSON.stringify({ cluster, language, content_type: contentType, domain })
        });
        if (data && data.generated_content) {
            // Auto-save to Content Library (localStorage)
            const entry = {
                id: 'cai_' + Date.now(),
                date: new Date().toISOString(),
                cluster, language, contentType, domain,
                result: data
            };
            try {
                const existing = JSON.parse(localStorage.getItem('albeni_content_library') || '[]');
                existing.unshift(entry);
                localStorage.setItem('albeni_content_library', JSON.stringify(existing));
                setSavedToast(true);
                setTimeout(() => setSavedToast(false), 3000);
            } catch(e) { console.warn('localStorage save failed', e); }
        }
        setResult(data);
        setGenerating(false);
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Content AI Generator + Validator</h2>
            </div>
            {savedToast && (
                <div style={{background:'#052e16',border:'1px solid #166534',borderRadius:'8px',padding:'12px 16px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'10px'}}>
                    <span style={{fontSize:'16px'}}>✅</span>
                    <span style={{fontSize:'13px',color:'#4ade80',fontWeight:500}}>Contenuto salvato automaticamente nella Content Library</span>
                </div>
            )}

            <div className="card" style={{marginBottom:'20px'}}>
                <h3 style={{fontSize:'15px',marginBottom:'16px',color:'#fafafa'}}>Genera Contenuto</h3>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'12px',marginBottom:'16px'}}>
                    <div>
                        <label style={{fontSize:'11px',color:'#71717a',display:'block',marginBottom:'4px'}}>CLUSTER</label>
                        <select value={cluster} onChange={e=>setCluster(e.target.value)} style={{width:'100%',background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'8px'}}>
                            {clusters.map(c => <option key={c} value={c}>{c.replace(/_/g,' ')}</option>)}
                        </select>
                    </div>
                    <div>
                        <label style={{fontSize:'11px',color:'#71717a',display:'block',marginBottom:'4px'}}>TIPO</label>
                        <select value={contentType} onChange={e=>setContentType(e.target.value)} style={{width:'100%',background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'8px'}}>
                            {types.map(t => <option key={t} value={t}>{t.replace(/_/g,' ')}</option>)}
                        </select>
                    </div>
                    <div>
                        <label style={{fontSize:'11px',color:'#71717a',display:'block',marginBottom:'4px'}}>LINGUA</label>
                        <select value={language} onChange={e=>setLanguage(e.target.value)} style={{width:'100%',background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'8px'}}>
                            {langs.map(l => <option key={l} value={l}>{l.toUpperCase()}</option>)}
                        </select>
                    </div>
                    <div>
                        <label style={{fontSize:'11px',color:'#71717a',display:'block',marginBottom:'4px'}}>DOMINIO</label>
                        <select value={domain} onChange={e=>setDomain(e.target.value)} style={{width:'100%',background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'8px'}}>
                            {domains.map(d => <option key={d} value={d}>{d}</option>)}
                        </select>
                    </div>
                </div>
                <button className="btn btn-primary" onClick={generate} disabled={generating}>
                    {generating ? <React.Fragment><span className="spinner" style={{marginRight:'8px'}}></span> Generando...</React.Fragment> : '🤖 Genera con Gemini'}
                </button>
            </div>

            {result && (
                <div className="card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
                        <h3 style={{fontSize:'15px',color:'#fafafa'}}>Risultato</h3>
                        <div style={{display:'flex',gap:'8px'}}>
                            <span className={`badge ${result.content_quality_score >= 76 ? 'badge-green' : 'badge-red'}`}>CQS: {result.content_quality_score}/100</span>
                            <span className="badge badge-blue">{result.model_used}</span>
                            <span className="badge badge-gray">{result.tokens_used} tokens</span>
                        </div>
                    </div>
                    <pre style={{background:'#111113',padding:'16px',borderRadius:'8px',fontSize:'12px',color:'#d4d4d8',whiteSpace:'pre-wrap',maxHeight:'400px',overflowY:'auto'}}>
                        {JSON.stringify(result.generated_content, null, 2)}
                    </pre>
                </div>
            )}
        </React.Fragment>
    );
}

// RESEARCH DATA HUB PAGE (Universal Upload & Browse)
// ============================================================
function SemrushDataPage() {
    const [imports, setImports] = useState([]);
    const [stats, setStats] = useState(null);
    const [loading, setLoading] = useState(true);
    const [uploading, setUploading] = useState(false);
    const [uploadResult, setUploadResult] = useState(null);
    const [selectedImport, setSelectedImport] = useState(null);
    const [importData, setImportData] = useState(null);
    const [loadingData, setLoadingData] = useState(false);
    const [searchQuery, setSearchQuery] = useState('');
    const [searchResults, setSearchResults] = useState(null);
    const [searchLoading, setSearchLoading] = useState(false);
    const [activeTab, setActiveTab] = useState('library');
    const [sourceFilter, setSourceFilter] = useState('');
    const fileInputRef = useRef(null);

    const loadLibrary = async () => {
        setLoading(true);
        const url = sourceFilter ? `/v1/hub?source=${sourceFilter}` : '/v1/hub';
        const data = await api(url);
        setImports(data?.imports || []);
        setStats(data?.stats || null);
        setLoading(false);
    };

    useEffect(() => { loadLibrary(); }, [sourceFilter]);

    const handleUpload = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        setUploading(true);
        setUploadResult(null);

        const results = [];
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('label', file.name);

            try {
                const res = await fetch(`${ML_API}/v1/hub/upload`, {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (!res.ok) {
                    results.push({ filename: file.name, status: 'error', error: data.detail || `HTTP ${res.status}` });
                } else {
                    results.push({ filename: file.name, ...data });
                }
            } catch (err) {
                results.push({ filename: file.name, status: 'error', error: err.message });
            }
        }

        setUploadResult(results);
        setUploading(false);
        loadLibrary();
        if (fileInputRef.current) fileInputRef.current.value = '';
    };

    const viewImport = async (imp) => {
        if (selectedImport?.id === imp.id) {
            setSelectedImport(null);
            setImportData(null);
            return;
        }
        setSelectedImport(imp);
        setLoadingData(true);
        const data = await api(`/v1/hub/${imp.id}`);
        setImportData(data);
        setLoadingData(false);
    };

    const deleteImport = async (importId) => {
        await fetch(`${ML_API}/v1/hub/${importId}`, { method: 'DELETE' });
        setSelectedImport(null);
        setImportData(null);
        loadLibrary();
    };

    const searchKeywords = async () => {
        if (!searchQuery.trim()) return;
        setSearchLoading(true);
        const data = await api(`/v1/hub/search/all?q=${encodeURIComponent(searchQuery)}${sourceFilter ? '&source=' + sourceFilter : ''}`);
        setSearchResults(data);
        setSearchLoading(false);
    };

    const fmt = (n) => typeof n === 'number' ? n.toLocaleString('it-IT') : '—';
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

    const sourceMeta = {
        semrush: { label: 'Semrush', icon: '📊', color: 'badge-yellow' },
        google_analytics: { label: 'Google Analytics', icon: '📈', color: 'badge-blue' },
        google_ads: { label: 'Google Ads', icon: '💰', color: 'badge-green' },
        search_console: { label: 'Search Console', icon: '🔍', color: 'badge-purple' },
        ahrefs: { label: 'Ahrefs', icon: '🔗', color: 'badge-blue' },
        screaming_frog: { label: 'Screaming Frog', icon: '🐸', color: 'badge-green' },
        shopify: { label: 'Shopify', icon: '🛒', color: 'badge-green' },
        klaviyo: { label: 'Klaviyo', icon: '📧', color: 'badge-purple' },
        skill: { label: 'AI Skill', icon: '🧠', color: 'badge-purple' },
        custom: { label: 'Custom', icon: '📄', color: 'badge-gray' },
        pdf: { label: 'PDF', icon: '📕', color: 'badge-red' },
        docx: { label: 'Word', icon: '📘', color: 'badge-blue' },
        text: { label: 'Testo', icon: '📝', color: 'badge-gray' },
        json: { label: 'JSON', icon: '🔧', color: 'badge-gray' },
    };

    const typeLabels = {
        keyword_overview: 'Keyword Overview',
        keyword_magic: 'Keyword Magic Tool',
        organic_research_positions: 'Organic Positions',
        organic_research_competitors: 'Organic Competitors',
        organic_research_pages: 'Organic Pages',
        advertising_research: 'Advertising Research',
        keyword_gap: 'Keyword Gap',
        backlink_overview: 'Backlink Overview',
        backlink_referring_domains: 'Referring Domains',
        position_tracking: 'Position Tracking',
        site_audit: 'Site Audit',
        domain_overview: 'Domain Overview',
        custom: 'Custom Export',
    };

    const sourceBadge = (source, fileType) => {
        const src = source || fileType || 'custom';
        const meta = sourceMeta[src] || sourceMeta.custom;
        return <span className={`badge ${meta.color}`}>{meta.icon} {meta.label}</span>;
    };

    const typeBadge = (t, source, fileType) => {
        // If we have source info from Research Hub, use source badge
        if (source) return sourceBadge(source, fileType);
        // Fallback to old Semrush type labels
        const colors = {
            keyword_overview: 'badge-blue', keyword_magic: 'badge-blue',
            organic_research_positions: 'badge-green', organic_research_competitors: 'badge-purple',
            advertising_research: 'badge-yellow', keyword_gap: 'badge-red',
            backlink_overview: 'badge-gray', position_tracking: 'badge-green',

        return <span className={`badge ${colors[t] || 'badge-gray'}`}>{typeLabels[t] || t}</span>;
    };

    // --- Context Provider state ---
    const [contextCategories, setContextCategories] = useState([]);
    const [agentContextMap, setAgentContextMap] = useState([]);
    const [taggedFiles, setTaggedFiles] = useState([]);
    const [contextSummary, setContextSummary] = useState(null);
    const [taggingImport, setTaggingImport] = useState(null);
    const [selectedTags, setSelectedTags] = useState([]);
    const [tagPriority, setTagPriority] = useState(5);
    const [autoTagResult, setAutoTagResult] = useState(null);
    const [skillSyncResult, setSkillSyncResult] = useState(null);
    const [skillSyncing, setSkillSyncing] = useState(false);
    const [autoTagAllResult, setAutoTagAllResult] = useState(null);
    const [autoTagAllRunning, setAutoTagAllRunning] = useState(false);

    const syncSkills = async () => {
        setSkillSyncing(true);
        setSkillSyncResult(null);
        try {
            const res = await fetch(ML_API + '/v1/context/sync-skills', { method: 'POST' });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Sync failed');
            setSkillSyncResult(data);
            loadContext();
        } catch (e) {
            setSkillSyncResult({ error: e.message });
        }
        setSkillSyncing(false);
    };

    const autoTagAll = async () => {
        setAutoTagAllRunning(true);
        setAutoTagAllResult(null);
        try {
            const res = await fetch(ML_API + '/v1/context/auto-tag-all', { method: 'POST' });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Auto-tag failed');
            setAutoTagAllResult(data);
            loadContext();
            loadLibrary();
        } catch (e) {
            setAutoTagAllResult({ error: e.message });
        }
        setAutoTagAllRunning(false);
    };

    const loadContext = async () => {
        const [cats, agMap, summary, tagged] = await Promise.all([
            api('/v1/context/categories'),
            api('/v1/context/agent-map'),
            api('/v1/context/summary'),
            api('/v1/context/tagged'),
        ]);
        setContextCategories(cats?.categories || []);
        setAgentContextMap(agMap?.agents || []);
        setContextSummary(summary);
        setTaggedFiles(tagged?.tagged || []);
    };

    const handleTag = async () => {
        if (!taggingImport || selectedTags.length === 0) return;
        await fetch(`${ML_API}/v1/context/tag?import_id=${taggingImport.id}&priority=${tagPriority}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(selectedTags),

        setTaggingImport(null);
        setSelectedTags([]);
        setAutoTagResult(null);
        loadContext();
        loadLibrary();
    };

    const handleAutoTag = async (imp) => {
        setTaggingImport(imp);
        setAutoTagResult(null);
        const result = await api(`/v1/context/auto-tag?import_id=${imp.id}`);

        if (result?.suggested_tags) {
            setSelectedTags(result.suggested_tags.filter(t => t.score >= 2).map(t => t.tag));
        }

    const handleUntag = async (importId) => {
        await fetch(`${ML_API}/v1/context/tag/${importId}`, { method: 'DELETE' });
        loadContext();
    };

    const tabs = [
        { id: 'library', label: 'Libreria Dati' },
        { id: 'context', label: '🧠 Contesto Agenti' },
        { id: 'search', label: 'Cerca Keyword' },
        { id: 'upload', label: 'Carica File' },

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Data Hub — Research Library</h2>

            {/* Stats cards */}
            {stats && (
                <React.Fragment>
                    <div className="cards-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>

                            <div className="card-value green">{stats.total_imports}</div>
                        </div>
                        <div className="card">
                            <div className="card-label">Righe Totali</div>
                            <div className="card-value">{fmt(stats.total_rows)}</div>
                        </div>
                        <div className="card">
                            <div className="card-label">Fonti Dati</div>
                            <div className="card-value">{stats.by_source ? Object.keys(stats.by_source).length : '—'}</div>

                        <div className="card">
                            <div className="card-label">Keyword Uniche</div>
                            <div className="card-value">{fmt(stats.unique_keywords)}</div>

                    {/* Source breakdown pills */}

                                    border: !sourceFilter ? '1px solid #3b82f6' : '1px solid #3f3f46'}}>
                                Tutti ({stats.total_imports})
                            </span>
                            {Object.entries(stats.by_source).map(([src, srcData]) => (
                                <span key={src} onClick={() => setSourceFilter(sourceFilter === src ? '' : src)}
                                    style={{padding:'5px 12px',borderRadius:'20px',fontSize:'11px',fontWeight:500,cursor:'pointer',
                                        background: sourceFilter === src ? '#1e3a5f' : '#27272a',color: sourceFilter === src ? '#60a5fa' : '#a1a1aa',
                                        border: sourceFilter === src ? '1px solid #3b82f6' : '1px solid #3f3f46'}}>
                                    {(srcData && srcData.icon) || sourceMeta[src]?.icon || '📄'} {(srcData && srcData.label) || sourceMeta[src]?.label || src} ({typeof srcData === 'object' ? srcData.count : srcData})
                                </span>
                            ))}
                        </div>
                    )}
                </React.Fragment>
            )}

            {/* Tab navigation */}
            <div style={{display:'flex',gap:'4px',marginBottom:'20px',marginTop:'8px',borderBottom:'1px solid #27272a'}}>
                {tabs.map(t => (
                    <div key={t.id} onClick={()=>setActiveTab(t.id)}
                        style={{padding:'10px 16px',fontSize:'13px',cursor:'pointer',borderBottom: activeTab===t.id ? '2px solid #60a5fa' : '2px solid transparent',
                            color: activeTab===t.id ? '#60a5fa' : '#71717a', fontWeight: activeTab===t.id ? 500 : 400}}>
                        {t.label}
                    </div>
                ))}
            </div>

            {/* TAB: Upload */}
            {activeTab === 'upload' && (
                <React.Fragment>
                    <div className="card" style={{marginBottom:'20px',textAlign:'center',padding:'40px',border:'2px dashed #3f3f46',cursor:'pointer'}}
                        onClick={() => fileInputRef.current?.click()}>
                        <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls,.txt,.json,.pdf,.docx,.doc,.tsv" multiple onChange={handleUpload}
                            style={{display:'none'}} />
                        <div style={{fontSize:'40px',marginBottom:'12px'}}>📂</div>
                        <div style={{fontSize:'15px',color:'#fafafa',fontWeight:500,marginBottom:'8px'}}>
