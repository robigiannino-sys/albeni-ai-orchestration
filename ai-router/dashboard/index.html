function ContentLibraryPage() {
    const [entries, setEntries] = React.useState([]);
    const [stats, setStats] = React.useState(null);
    const [search, setSearch] = React.useState('');
    const [filterType, setFilterType] = React.useState('all');
    const [filterLang, setFilterLang] = React.useState('all');
    const [filterStatus, setFilterStatus] = React.useState('all');
    const [filterCluster, setFilterCluster] = React.useState('all');
    const [selected, setSelected] = React.useState(null);
    const [copied, setCopied] = React.useState(false);
    const [loading, setLoading] = React.useState(false);
    const [updatingStatus, setUpdatingStatus] = React.useState(false);

    const TYPE_LABELS = {
        'email_copy': '📧 Email Copy', 'blog_draft': '📝 Blog Draft',
        'landing_copy': '🎯 Landing Copy', 'lead_magnet': '🧲 Lead Magnet'
    };
    const TYPE_COLORS = {
        'email_copy': '#facc15', 'blog_draft': '#60a5fa',
        'landing_copy': '#f472b6', 'lead_magnet': '#4ade80'
    };
    const STATUS_COLORS = {
        'pending': '#f59e0b', 'approved': '#22c55e', 'rejected': '#ef4444', 'revised': '#8b5cf6'
    };
    const clusters = ['business_professional','heritage_mature','conscious_premium','modern_minimalist','italian_authentic'];
    const types = ['email_copy','blog_draft','landing_copy','lead_magnet'];
    const langs = ['it','en','de','fr','es'];

    const load = async () => {
        setLoading(true);
        try {
            const params = new URLSearchParams();
            params.set('limit', '200');
            if (filterType !== 'all') params.set('content_type', filterType);
            if (filterLang !== 'all') params.set('language', filterLang);
            if (filterStatus !== 'all') params.set('status', filterStatus);
            if (filterCluster !== 'all') params.set('cluster', filterCluster);
            if (search) params.set('search', search);

            const [data, st] = await Promise.all([
                api(`/v1/content/lake?${params.toString()}`),
                api('/v1/content/lake/stats/summary')
            ]);
            setEntries(data?.items || []);
            setStats(st);
        } catch(e) { console.error('Content Lake load error:', e); }
        setLoading(false);
    };

    React.useEffect(() => { load(); }, [filterType, filterLang, filterStatus, filterCluster]);

    const doSearch = () => { load(); };

    const updateReviewStatus = async (id, newStatus) => {
        setUpdatingStatus(true);
        await api(`/v1/content/lake/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ review_status: newStatus, reviewer: 'admin' })
        });
        if (selected?.id === id) setSelected({...selected, review_status: newStatus});
        await load();
        setUpdatingStatus(false);
    };

    const fmtDate = d => { try { return new Date(d).toLocaleString('it-IT', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch { return d; } };
    const getTitle = (e) => {
        try {
            const gc = typeof e.content === 'string' ? JSON.parse(e.content) : e.content;
            if (gc?.subject) return gc.subject;
            if (gc?.headline) return gc.headline;
            if (gc?.title) return gc.title;
        } catch {}
        return `${(e.content_type||'').replace(/_/g,' ')} · ${e.cluster?.replace(/_/g,' ')} · ${e.language?.toUpperCase()}`;
    };
    const getPreview = (e) => {
        if (!e.content) return '—';
        const str = typeof e.content === 'string' ? e.content : JSON.stringify(e.content);
        return str.replace(/[{}"\[\]]/g,' ').replace(/\s+/g,' ').trim().substring(0, 160) + '…';
    };
    const getBody = (e) => {
        if (!e.content) return '—';
        try {
            const parsed = typeof e.content === 'string' ? JSON.parse(e.content) : e.content;
            return JSON.stringify(parsed, null, 2);
        } catch { return e.content; }
    };
    const copyBody = () => {
        if (!selected) return;
        navigator.clipboard.writeText(getBody(selected)).then(() => { setCopied(true); setTimeout(()=>setCopied(false),2000); });
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <div>
                    <h2>🗄️ Content Lake</h2>
                    <p style={{fontSize:'12px',color:'#71717a',marginTop:'4px'}}>
                        Repository persistente di tutti i contenuti generati — salvati in PostgreSQL
                    </p>
                </div>
                <button className="btn btn-primary" onClick={load} disabled={loading}>
                    {loading ? <React.Fragment><span className="spinner" style={{marginRight:'6px'}}></span>Caricando...</React.Fragment> : '🔄 Aggiorna'}
                </button>
            </div>

            {/* Stats from DB */}
            {stats && (
                <div className="cards-grid" style={{gridTemplateColumns:'repeat(6,1fr)',marginBottom:'20px'}}>
                    <div className="card">
                        <div className="card-label">Totale generati</div>
                        <div className="card-value">{stats.total}</div>
                    </div>
                    <div className="card">
                        <div className="card-label">In attesa</div>
                        <div className="card-value yellow">{stats.pending}</div>
                    </div>
                    <div className="card">
                        <div className="card-label">Approvati</div>
                        <div className="card-value green">{stats.approved}</div>
                    </div>
                    <div className="card">
                        <div className="card-label">Rifiutati</div>
                        <div className="card-value red">{stats.rejected}</div>
                    </div>
                    <div className="card">
                        <div className="card-label">Token totali</div>
                        <div className="card-value" style={{color:'#c084fc'}}>{(stats.total_tokens_used||0).toLocaleString()}</div>
                    </div>
                    <div className="card">
                        <div className="card-label">CQS medio</div>
                        <div className="card-value green">{stats.avg_quality_score}<span style={{fontSize:'14px',color:'#71717a'}}>/100</span></div>
                    </div>
                </div>
            )}

            {/* Distribution cards */}
            {stats && (stats.total > 0) && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'16px',marginBottom:'20px'}}>
                    <div className="card">
                        <h4 style={{fontSize:'12px',color:'#71717a',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Per Cluster</h4>
                        {Object.entries(stats.by_cluster||{}).map(([k,v]) => (
                            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:'12px'}}>
                                <span style={{color:'#a1a1aa'}}>{k.replace(/_/g,' ')}</span>
                                <span style={{color:'#e4e4e7',fontWeight:600}}>{v}</span>
                            </div>
                        ))}
                    </div>
                    <div className="card">
                        <h4 style={{fontSize:'12px',color:'#71717a',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Per Tipo</h4>
                        {Object.entries(stats.by_type||{}).map(([k,v]) => (
                            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:'12px'}}>
                                <span style={{color: TYPE_COLORS[k]||'#a1a1aa'}}>{TYPE_LABELS[k]||k}</span>
                                <span style={{color:'#e4e4e7',fontWeight:600}}>{v}</span>
                            </div>
                        ))}
                    </div>
                    <div className="card">
                        <h4 style={{fontSize:'12px',color:'#71717a',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}}>Per Lingua</h4>
                        {Object.entries(stats.by_language||{}).map(([k,v]) => (
                            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:'12px'}}>
                                <span style={{color:'#a1a1aa'}}>{k.toUpperCase()}</span>
                                <span style={{color:'#e4e4e7',fontWeight:600}}>{v}</span>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* Filters */}
            <div style={{display:'flex',gap:'10px',marginBottom:'16px',flexWrap:'wrap',alignItems:'center'}}>
                <div style={{position:'relative',flex:1,minWidth:'200px'}}>
                    <span style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',color:'#71717a'}}>🔍</span>
                    <input value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') doSearch(); }}
                        placeholder="Cerca nel contenuto... (Invio per cercare)"
                        style={{width:'100%',background:'#27272a',border:'1px solid #3f3f46',color:'#e4e4e7',padding:'9px 12px 9px 32px',borderRadius:'8px',fontSize:'13px',outline:'none'}}/>
                </div>
                <select value={filterCluster} onChange={e=>setFilterCluster(e.target.value)}
                    style={{background:'#27272a',border:'1px solid #3f3f46',color:'#e4e4e7',padding:'9px 12px',borderRadius:'8px',fontSize:'12px'}}>
                    <option value="all">Tutti i cluster</option>
                    {clusters.map(c=><option key={c} value={c}>{c.replace(/_/g,' ')}</option>)}
                </select>
                <select value={filterType} onChange={e=>setFilterType(e.target.value)}
                    style={{background:'#27272a',border:'1px solid #3f3f46',color:'#e4e4e7',padding:'9px 12px',borderRadius:'8px',fontSize:'12px'}}>
                    <option value="all">Tutti i tipi</option>
                    {types.map(t=><option key={t} value={t}>{t.replace(/_/g,' ')}</option>)}
                </select>
                <select value={filterLang} onChange={e=>setFilterLang(e.target.value)}
                    style={{background:'#27272a',border:'1px solid #3f3f46',color:'#e4e4e7',padding:'9px 12px',borderRadius:'8px',fontSize:'12px'}}>
                    <option value="all">Tutte le lingue</option>
                    {langs.map(l=><option key={l} value={l}>{l.toUpperCase()}</option>)}
                </select>
                <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
                    style={{background:'#27272a',border:'1px solid #3f3f46',color:'#e4e4e7',padding:'9px 12px',borderRadius:'8px',fontSize:'12px'}}>
                    <option value="all">Tutti gli stati</option>
                    <option value="pending">⏳ Pending</option>
                    <option value="approved">✅ Approved</option>
                    <option value="rejected">❌ Rejected</option>
                    <option value="revised">✏️ Revised</option>
                </select>
            </div>

            <p style={{fontSize:'12px',color:'#71717a',marginBottom:'12px'}}>{entries.length} risultati dal database</p>

            {entries.length === 0 && !loading ? (
                <div className="card" style={{textAlign:'center',padding:'60px 40px'}}>
                    <div style={{fontSize:'48px',marginBottom:'16px'}}>🗄️</div>
                    <h3 style={{fontSize:'18px',marginBottom:'8px',color:'#fafafa'}}>Content Lake vuoto</h3>
                    <p style={{color:'#71717a',lineHeight:1.6}}>
                        Vai su <strong style={{color:'#e4e4e7'}}>Content AI</strong> e genera il tuo primo contenuto.<br/>
                        Ogni generazione viene persistita automaticamente in PostgreSQL.
                    </p>
                </div>
            ) : (
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:'14px'}}>
                    {entries.map(entry => {
                        const color = TYPE_COLORS[entry.content_type] || '#71717a';
                        const cqs = entry.quality_score || 0;
                        const statusColor = STATUS_COLORS[entry.review_status] || '#71717a';
                        return (
                            <div key={entry.id} onClick={()=>setSelected(entry)}
                                style={{background:'#18181b',border:'1px solid #27272a',borderRadius:'12px',padding:'16px',cursor:'pointer',transition:'all 0.15s'}}
                                onMouseEnter={e=>{e.currentTarget.style.borderColor=color;e.currentTarget.style.transform='translateY(-1px)';}}
                                onMouseLeave={e=>{e.currentTarget.style.borderColor='#27272a';e.currentTarget.style.transform='none';}}>
                                <div style={{display:'flex',alignItems:'flex-start',gap:'10px',marginBottom:'10px'}}>
                                    <div style={{flex:1}}>
                                        <div style={{fontSize:'13px',fontWeight:600,color:'#fafafa',lineHeight:1.35,marginBottom:'4px'}}>
                                            {getTitle(entry)}
                                        </div>
                                        <div style={{fontSize:'11px',color:'#71717a'}}>{fmtDate(entry.created_at)}</div>
                                    </div>
                                    <div style={{display:'flex',flexDirection:'column',gap:'4px',alignItems:'flex-end'}}>
                                        <span style={{fontSize:'10px',fontWeight:700,padding:'2px 8px',borderRadius:'4px',background:`${color}22`,color,whiteSpace:'nowrap'}}>
                                            {TYPE_LABELS[entry.content_type]||entry.content_type}
                                        </span>
                                        <span className={`badge ${cqs>=76?'badge-green':'badge-yellow'}`} style={{fontSize:'10px'}}>CQS {cqs}</span>
                                        <span style={{fontSize:'10px',fontWeight:600,padding:'2px 8px',borderRadius:'4px',background:`${statusColor}22`,color:statusColor}}>
                                            {entry.review_status}
                                        </span>
                                    </div>
                                </div>
                                <p style={{fontSize:'12px',color:'#71717a',lineHeight:1.5,marginBottom:'10px',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
                                    {getPreview(entry)}
                                </p>
                                <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                                    <span style={{fontSize:'10px',padding:'2px 8px',background:'#27272a',border:'1px solid #3f3f46',borderRadius:'4px',color:'#a1a1aa'}}>
                                        {entry.cluster?.replace(/_/g,' ')}
                                    </span>
                                    <span style={{fontSize:'10px',padding:'2px 8px',background:'#27272a',border:'1px solid #3f3f46',borderRadius:'4px',color:'#a1a1aa'}}>
                                        {entry.language?.toUpperCase()}
                                    </span>
                                    <span style={{fontSize:'10px',padding:'2px 8px',background:'#27272a',border:'1px solid #3f3f46',borderRadius:'4px',color:'#60a5fa'}}>
                                        {entry.domain}
                                    </span>
                                    <span style={{fontSize:'10px',padding:'2px 8px',background:'#27272a',border:'1px solid #3f3f46',borderRadius:'4px',color:'#71717a'}}>
                                        {entry.total_tokens||0} tok
                                    </span>
                                </div>
                            </div>
                        );
                    })}
                </div>
            )}

            {/* DETAIL MODAL */}
            {selected && (
                <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) setSelected(null); }}>
                    <div className="modal" style={{maxWidth:'780px',width:'90%',maxHeight:'85vh',display:'flex',flexDirection:'column',padding:0,overflow:'hidden'}}>
                        <div style={{padding:'20px 24px',borderBottom:'1px solid #3f3f46',display:'flex',gap:'14px',alignItems:'flex-start'}}>
                            <div style={{flex:1}}>
                                <div style={{fontSize:'16px',fontWeight:700,color:'#fafafa',marginBottom:'6px'}}>{getTitle(selected)}</div>
                                <div style={{display:'flex',gap:'10px',flexWrap:'wrap',alignItems:'center'}}>
                                    <span style={{fontSize:'11px',color:'#71717a'}}>{fmtDate(selected.created_at)}</span>
                                    <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:'4px',background:`${(TYPE_COLORS[selected.content_type]||'#71717a')}22`,color:TYPE_COLORS[selected.content_type]||'#71717a',fontWeight:600}}>
                                        {TYPE_LABELS[selected.content_type]||selected.content_type}
                                    </span>
                                    <span className="badge badge-blue">{selected.model_used}</span>
                                    <span className={`badge ${(selected.quality_score||0)>=76?'badge-green':'badge-yellow'}`}>CQS {selected.quality_score}</span>
                                    <span className="badge badge-gray">{selected.total_tokens} tokens</span>
                                    <span style={{fontSize:'11px',fontWeight:600,padding:'2px 8px',borderRadius:'4px',background:`${(STATUS_COLORS[selected.review_status]||'#71717a')}22`,color:STATUS_COLORS[selected.review_status]||'#71717a'}}>
                                        {selected.review_status}
                                    </span>
                                </div>
                            </div>
                            <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',color:'#71717a',fontSize:'20px',cursor:'pointer'}}>✕</button>
                        </div>
                        <div style={{padding:'20px 24px',overflowY:'auto',flex:1}}>
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'12px',marginBottom:'20px'}}>
                                {[['Cluster',selected.cluster?.replace(/_/g,' ')],['Dominio',selected.domain],['Lingua',selected.language?.toUpperCase()],['Stage',selected.intent_stage]].map(([k,v])=>(
                                    <div key={k} style={{background:'#111113',border:'1px solid #27272a',borderRadius:'8px',padding:'12px'}}>
                                        <div style={{fontSize:'10px',color:'#71717a',textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:'4px'}}>{k}</div>
                                        <div style={{fontSize:'13px',color:'#e4e4e7',fontWeight:500}}>{v||'—'}</div>
                                    </div>
                                ))}
                            </div>
                            <div style={{fontSize:'11px',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',color:'#71717a',marginBottom:'8px'}}>Contenuto generato</div>
                            <pre style={{background:'#111113',border:'1px solid #27272a',borderRadius:'8px',padding:'16px',fontSize:'12px',color:'#d4d4d8',whiteSpace:'pre-wrap',wordBreak:'break-word',maxHeight:'360px',overflowY:'auto',lineHeight:1.6}}>
                                {getBody(selected)}
                            </pre>
                        </div>
                        <div style={{padding:'16px 24px',borderTop:'1px solid #3f3f46',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <div style={{display:'flex',gap:'8px'}}>
                                <button onClick={()=>updateReviewStatus(selected.id,'approved')} disabled={updatingStatus}
                                    style={{background:'#052e16',border:'1px solid #166534',color:'#4ade80',padding:'8px 14px',borderRadius:'8px',fontSize:'12px',cursor:'pointer',fontWeight:600}}>
                                    ✅ Approva
                                </button>
                                <button onClick={()=>updateReviewStatus(selected.id,'rejected')} disabled={updatingStatus}
                                    style={{background:'#450a0a',border:'1px solid #7f1d1d',color:'#fca5a5',padding:'8px 14px',borderRadius:'8px',fontSize:'12px',cursor:'pointer',fontWeight:600}}>
                                    ❌ Rifiuta
                                </button>
                                <button onClick={()=>updateReviewStatus(selected.id,'revised')} disabled={updatingStatus}
                                    style={{background:'#1e1b4b',border:'1px solid #3730a3',color:'#a78bfa',padding:'8px 14px',borderRadius:'8px',fontSize:'12px',cursor:'pointer',fontWeight:600}}>
                                    ✏️ Revisiona
                                </button>
                            </div>
                            <div style={{display:'flex',gap:'8px'}}>
                                <button className="btn btn-secondary" onClick={()=>setSelected(null)}>Chiudi</button>
                                <button className="btn btn-primary" onClick={copyBody}>{copied?'✓ Copiato!':'📋 Copia contenuto'}</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </React.Fragment>
    );
}

// ============================================================
// USER JOURNEY FUNNEL PAGE (FASE 7.4 — 2026-05-15)
// 6-stage event-driven funnel: visit → engaged → interest → lead → pre_conv → conversion
// Aggregates behavioral_signals via /v1/funnel/journey endpoint
// ============================================================
function FunnelPage() {
    const [period, setPeriod] = useState('30d');
    const [cluster, setCluster] = useState('all');
    const [domain, setDomain] = useState('all');
    const [device, setDevice] = useState('all');
    const [includeTest, setIncludeTest] = useState(false);
    const [data, setData] = useState(null);
    const [byCluster, setByCluster] = useState(null);
    const [byDomain, setByDomain] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    const loadFunnel = () => {
        setLoading(true);
        setError(null);
        const testParam = includeTest ? '&include_test=true' : '';
        const qs = `?period=${period}&cluster=${cluster}&domain=${domain}&device=${device}${testParam}`;
        Promise.all([
            api('/v1/funnel/journey' + qs),
            api(`/v1/funnel/journey/by-cluster?period=${period}&domain=${domain}${testParam}`),
            api(`/v1/funnel/journey/by-domain?period=${period}${testParam}`),
        ]).then(([main, cl, dm]) => {
            setData(main);
            setByCluster(cl);
            setByDomain(dm);
            setLoading(false);
        }).catch(e => {
            setError(e.message || 'Errore nel caricamento funnel');
            setLoading(false);
        });
    };

    useEffect(() => { loadFunnel(); }, [period, cluster, domain, device, includeTest]);

    const clusterLabels = {
        business_professional: 'Business Professional',
        heritage_mature: 'Heritage Mature',
        italian_authentic: 'Italian Authentic',
        modern_minimalist: 'Modern Minimalist',
        conscious_premium: 'Conscious Premium',
        unassigned: 'Non Classificati',
    };
    const clusterColors = {
        business_professional: '#3b82f6',
        heritage_mature: '#8b5cf6',
        italian_authentic: '#22c55e',
        modern_minimalist: '#f97316',
        conscious_premium: '#eab308',
        unassigned: '#6b7280',
    };
    const stageColors = ['#3b82f6', '#22c55e', '#eab308', '#f97316', '#ef4444', '#8b5cf6'];

    return (
        <div className="page">
            <h2>🎯 User Journey Funnel</h2>
            <p style={{color:'#a1a1aa',marginBottom:'16px',fontSize:'14px'}}>
                Conversion funnel a 6 stage aggregato da <code style={{background:'#1f1f23',padding:'2px 6px',borderRadius:'3px'}}>behavioral_signals</code>.
                User-level (DISTINCT user_id per stage). Drop-off calcolato fra stage consecutivi.
            </p>

            {/* Filter bar */}
            <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'20px',padding:'14px',background:'#1f1f23',borderRadius:'8px'}}>
                <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
                    <label style={{fontSize:'12px',color:'#a1a1aa',marginRight:'4px'}}>Periodo:</label>
                    {['7d','30d','90d'].map(p => (
                        <button key={p} onClick={()=>setPeriod(p)}
                            style={{padding:'6px 12px',borderRadius:'6px',border:'none',cursor:'pointer',
                                background: period===p ? '#ff8c42' : '#27272a',
                                color: period===p ? '#fff' : '#a1a1aa',fontSize:'12px',fontWeight: period===p?'600':'400'}}>
                            {p}
                        </button>
                    ))}
                </div>
                <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
                    <label style={{fontSize:'12px',color:'#a1a1aa',marginRight:'4px'}}>Cluster:</label>
                    <select value={cluster} onChange={e=>setCluster(e.target.value)}
                        style={{padding:'6px 10px',borderRadius:'6px',border:'1px solid #3f3f46',background:'#27272a',color:'#e4e4e7',fontSize:'12px'}}>
                        <option value="all">Tutti</option>
                        {Object.entries(clusterLabels).filter(([k])=>k!=='unassigned').map(([k,v])=> <option key={k} value={k}>{v}</option>)}
                    </select>
                </div>
                <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
                    <label style={{fontSize:'12px',color:'#a1a1aa',marginRight:'4px'}}>Dominio:</label>
                    <select value={domain} onChange={e=>setDomain(e.target.value)}
                        style={{padding:'6px 10px',borderRadius:'6px',border:'1px solid #3f3f46',background:'#27272a',color:'#e4e4e7',fontSize:'12px'}}>
                        <option value="all">Tutti</option>
                        <option value="worldofmerino.com">worldofmerino.com</option>
                        <option value="merinouniversity.com">merinouniversity.com</option>
                        <option value="perfectmerinoshirt.com">perfectmerinoshirt.com</option>
                        <option value="micron-e.com">micron-e.com</option>
                    </select>
                </div>
                <div style={{display:'flex',gap:'4px',alignItems:'center'}}>
                    <label style={{fontSize:'12px',color:'#a1a1aa',marginRight:'4px'}}>Device:</label>
                    <select value={device} onChange={e=>setDevice(e.target.value)}
                        style={{padding:'6px 10px',borderRadius:'6px',border:'1px solid #3f3f46',background:'#27272a',color:'#e4e4e7',fontSize:'12px'}}>
                        <option value="all">Tutti</option>
                        <option value="desktop">Desktop</option>
                        <option value="mobile">Mobile</option>
                        <option value="tablet">Tablet</option>
                    </select>
                </div>
                <label style={{display:'flex',alignItems:'center',gap:'6px',marginLeft:'auto',cursor:'pointer',padding:'6px 10px',borderRadius:'6px',background: includeTest ? '#7c2d12' : '#27272a',transition:'background 0.2s'}}>
                    <input type="checkbox" checked={includeTest} onChange={e=>setIncludeTest(e.target.checked)}
                        style={{cursor:'pointer'}} />
                    <span style={{fontSize:'11px',color: includeTest ? '#fed7aa' : '#a1a1aa',fontWeight: includeTest?'600':'400'}}>
                        Mostra test events {includeTest && '⚠'}
                    </span>
                </label>
                <button onClick={loadFunnel} style={{padding:'6px 14px',borderRadius:'6px',border:'none',cursor:'pointer',background:'#3f3f46',color:'#e4e4e7',fontSize:'12px'}}>
                    ↻ Reload
                </button>
            </div>

            {loading && <div style={{padding:'40px',textAlign:'center',color:'#a1a1aa'}}>Caricamento funnel...</div>}
            {error && <div style={{padding:'20px',background:'#7f1d1d',color:'#fca5a5',borderRadius:'8px',marginBottom:'16px'}}>⚠ {error}</div>}

            {data && !loading && (
                <>
                    {/* Top KPI cards */}
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'12px',marginBottom:'20px'}}>
                        <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                            <div style={{fontSize:'11px',color:'#a1a1aa',textTransform:'uppercase',letterSpacing:'0.5px'}}>Total Users</div>
                            <div style={{fontSize:'28px',fontWeight:'700',marginTop:'4px'}}>{data.total_users_in_window}</div>
                            <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>nel periodo {period}</div>
                        </div>
                        <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                            <div style={{fontSize:'11px',color:'#a1a1aa',textTransform:'uppercase',letterSpacing:'0.5px'}}>Total Events</div>
                            <div style={{fontSize:'28px',fontWeight:'700',marginTop:'4px'}}>{data.total_events_in_window}</div>
                            <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>signals raccolti</div>
                        </div>
                        <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                            <div style={{fontSize:'11px',color:'#a1a1aa',textTransform:'uppercase',letterSpacing:'0.5px'}}>Conversion Rate</div>
                            <div style={{fontSize:'28px',fontWeight:'700',marginTop:'4px',color: data.overall_conversion_pct >= 1 ? '#22c55e' : '#f97316'}}>
                                {data.overall_conversion_pct}%
                            </div>
                            <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>checkout_complete / page_view</div>
                        </div>
                        <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                            <div style={{fontSize:'11px',color:'#a1a1aa',textTransform:'uppercase',letterSpacing:'0.5px'}}>Stage attivi</div>
                            <div style={{fontSize:'28px',fontWeight:'700',marginTop:'4px'}}>{data.stages.filter(s=>s.users>0).length}/6</div>
                            <div style={{fontSize:'11px',color:'#6b7280',marginTop:'2px'}}>su 6 fasi journey</div>
                        </div>
                    </div>

                    {/* Main funnel chart */}
                    <div style={{padding:'20px',background:'#1f1f23',borderRadius:'8px',marginBottom:'20px'}}>
                        <h3 style={{marginTop:0,marginBottom:'16px',fontSize:'16px'}}>Funnel Stages</h3>
                        {data.stages.map((s, idx) => {
                            const baselineUsers = data.stages[0].users || 1;
                            const widthPct = Math.max(2, (s.users / baselineUsers) * 100);
                            return (
                                <div key={s.key} style={{marginBottom:'12px'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'4px'}}>
                                        <span style={{fontSize:'13px',fontWeight:'600'}}>
                                            {idx+1}. {s.label}
                                            <span style={{color:'#6b7280',fontSize:'11px',fontWeight:'400',marginLeft:'8px'}}>{s.description}</span>
                                        </span>
                                        <span style={{fontSize:'13px',color:'#e4e4e7'}}>
                                            <strong>{s.users}</strong> users
                                            <span style={{color:'#6b7280',fontSize:'11px',marginLeft:'8px'}}>({s.share_of_baseline_pct}% baseline)</span>
                                        </span>
                                    </div>
                                    <div style={{height:'24px',background:'#0a0a0a',borderRadius:'4px',position:'relative',overflow:'hidden'}}>
                                        <div style={{height:'100%',width: widthPct+'%',background: stageColors[idx],transition:'width 0.4s ease'}}></div>
                                    </div>
                                    {idx > 0 && s.drop_off_pct > 0 && (
                                        <div style={{fontSize:'11px',color: s.drop_off_pct > 60 ? '#ef4444' : s.drop_off_pct > 30 ? '#f97316' : '#a1a1aa',marginTop:'2px',marginLeft:'8px'}}>
                                            ↓ drop-off −{s.drop_off_pct}%
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* By Cluster + By Domain side-by-side */}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px',marginBottom:'20px'}}>
                        {byCluster && byCluster.by_cluster && byCluster.by_cluster.length > 0 && (
                            <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                                <h3 style={{marginTop:0,marginBottom:'12px',fontSize:'14px'}}>Conversion Rate per Cluster</h3>
                                {byCluster.by_cluster.map(c => (
                                    <div key={c.cluster} style={{marginBottom:'10px'}}>
                                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'2px'}}>
                                            <span style={{fontSize:'12px'}}>{clusterLabels[c.cluster] || c.cluster}</span>
                                            <span style={{fontSize:'12px',color:'#a1a1aa'}}>{c.conversion}/{c.visit} ({c.conversion_rate_pct}%)</span>
                                        </div>
                                        <div style={{height:'8px',background:'#0a0a0a',borderRadius:'3px',overflow:'hidden'}}>
                                            <div style={{height:'100%',width: Math.min(100, c.conversion_rate_pct * 10)+'%',background: clusterColors[c.cluster] || '#6b7280'}}></div>
                                        </div>
                                    </div>
                                ))}
                                <div style={{fontSize:'10px',color:'#6b7280',marginTop:'8px'}}>Scale: 100% bar = 10% conversion rate</div>
                            </div>
                        )}
                        {byDomain && byDomain.by_domain && byDomain.by_domain.length > 0 && (
                            <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                                <h3 style={{marginTop:0,marginBottom:'12px',fontSize:'14px'}}>Funnel per Dominio</h3>
                                <table style={{width:'100%',fontSize:'11px',borderCollapse:'collapse'}}>
                                    <thead>
                                        <tr style={{borderBottom:'1px solid #3f3f46',color:'#a1a1aa'}}>
                                            <th style={{textAlign:'left',padding:'6px 4px'}}>Domain</th>
                                            <th style={{textAlign:'right',padding:'6px 4px'}}>Visit</th>
                                            <th style={{textAlign:'right',padding:'6px 4px'}}>Lead</th>
                                            <th style={{textAlign:'right',padding:'6px 4px'}}>Conv</th>
                                            <th style={{textAlign:'right',padding:'6px 4px'}}>CR%</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {byDomain.by_domain.map(d => (
                                            <tr key={d.domain} style={{borderBottom:'1px solid #27272a'}}>
                                                <td style={{padding:'6px 4px',fontSize:'11px'}}>{d.domain}</td>
                                                <td style={{textAlign:'right',padding:'6px 4px'}}>{d.visit}</td>
                                                <td style={{textAlign:'right',padding:'6px 4px'}}>{d.lead}</td>
                                                <td style={{textAlign:'right',padding:'6px 4px'}}>{d.conversion}</td>
                                                <td style={{textAlign:'right',padding:'6px 4px',color: d.conversion_rate_pct >= 1 ? '#22c55e' : '#a1a1aa'}}>{d.conversion_rate_pct}%</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Event type breakdown */}
                    {data.event_type_breakdown && data.event_type_breakdown.length > 0 && (
                        <div style={{padding:'16px',background:'#1f1f23',borderRadius:'8px'}}>
                            <h3 style={{marginTop:0,marginBottom:'12px',fontSize:'14px'}}>Event Type Breakdown ({period})</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:'6px'}}>
                                {data.event_type_breakdown.map(e => (
                                    <div key={e.event_type} style={{padding:'8px 10px',background:'#27272a',borderRadius:'4px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                        <span style={{fontSize:'11px',color:'#e4e4e7',fontFamily:'monospace'}}>{e.event_type}</span>
                                        <span style={{fontSize:'11px'}}>
                                            <strong>{e.events}</strong> <span style={{color:'#6b7280'}}>({e.users}u)</span>
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div style={{textAlign:'right',marginTop:'12px',fontSize:'11px',color:'#6b7280'}}>
                        Aggiornato: {new Date(data.timestamp).toLocaleString('it-IT')}
                    </div>
                </>
            )}
        </div>
    );
}

// GSC INDEXING MONITOR PAGE
// ============================================================
function GSCPage() {
    const [scans, setScans] = useState([]);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('all');
    const chartRef = useRef(null);
    const chartInstance = useRef(null);

    useEffect(() => {
        loadData();
    }, []);

    useEffect(() => {
        if (scans.length > 0) renderChart();
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
    }, [scans, filter]);

    async function loadData() {
        setLoading(true);
        try {
            const res = await api('/v1/gsc/history');
            setScans(res.scans || []);
        } catch (e) {
            console.error('GSC load error:', e);
        }
        setLoading(false);
    }

    function getFiltered() {
        if (filter === 'all') return scans;
        return scans.filter(s => s.site.includes(filter));
    }

    function getLatest(site) {
        return scans.find(s => s.site.includes(site));
    }

    function getHistory(site) {
        return scans.filter(s => s.site.includes(site)).sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    function pct(n, total) {
        if (!total) return '—';
        return (n / total * 100).toFixed(1) + '%';
    }

    function renderChart() {
        if (!chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const muHistory = getHistory('merinouniversity');
        const womHistory = getHistory('worldofmerino');

        // Collect all unique dates
        const allDates = [...new Set([...muHistory.map(s => s.date), ...womHistory.map(s => s.date)])].sort();

        const muData = allDates.map(d => {
            const s = muHistory.find(x => x.date === d);
            return s ? (s.indexed / s.total_urls * 100) : null;
        });
        const womData = allDates.map(d => {
            const s = womHistory.find(x => x.date === d);
            return s ? (s.indexed / s.total_urls * 100) : null;
        });

        const datasets = [];
        if (filter === 'all' || filter === 'merinouniversity') {
            datasets.push({
                label: 'MU — Indexed %',
                data: muData,
                borderColor: '#60a5fa',
                backgroundColor: 'rgba(96,165,250,0.1)',
                fill: true,
                tension: 0.3,
                spanGaps: true,
                pointRadius: 5,
                pointBackgroundColor: '#60a5fa'
            });
        }
        if (filter === 'all' || filter === 'worldofmerino') {
            datasets.push({
                label: 'WoM — Indexed %',
                data: womData,
                borderColor: '#f59e0b',
                backgroundColor: 'rgba(245,158,11,0.1)',
                fill: true,
                tension: 0.3,
                spanGaps: true,
                pointRadius: 5,
                pointBackgroundColor: '#f59e0b'
            });
        }

        chartInstance.current = new Chart(chartRef.current, {
            type: 'line',
            data: { labels: allDates, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#a1a1aa', font: { size: 12 } } },
                    tooltip: {
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
                        }
                    }
                },
                scales: {
                    x: { ticks: { color: '#71717a' }, grid: { color: '#1e1e21' } },
                    y: {
                        min: 0, max: 100,
                        ticks: { color: '#a1a1aa', callback: v => v + '%' },
                        grid: { color: '#1e1e21' }
                    }
                }
            }
        });
    }

    const muLatest = getLatest('merinouniversity');
    const womLatest = getLatest('worldofmerino');

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>📊 GSC Indexing Monitor</h2>
                <button className="refresh-btn" onClick={loadData}>
                    {loading ? <span className="spinner"></span> : '🔄 Aggiorna'}
                </button>
            </div>

            {/* KPI Cards */}
            <div className="cards-grid">
                <div className="card">
                    <div className="card-label">MU — Indexed</div>
                    <div className={`card-value ${muLatest?.indexed > 20 ? 'green' : muLatest?.indexed > 0 ? 'yellow' : 'red'}`}>
                        {muLatest ? muLatest.indexed : '—'}
                    </div>
                    <div className="card-sub">{muLatest ? `su ${muLatest.total_urls} URL (${pct(muLatest.indexed, muLatest.total_urls)})` : 'Nessuna scansione'}</div>
                </div>
                <div className="card">
                    <div className="card-label">WoM — Indexed</div>
                    <div className={`card-value ${womLatest?.indexed > 20 ? 'green' : womLatest?.indexed > 0 ? 'yellow' : 'red'}`}>
                        {womLatest ? womLatest.indexed : '—'}
                    </div>
                    <div className="card-sub">{womLatest ? `su ${womLatest.total_urls} URL (${pct(womLatest.indexed, womLatest.total_urls)})` : 'In attesa scansione'}</div>
                </div>
                <div className="card">
                    <div className="card-label">MU — Not Crawled</div>
                    <div className="card-value red">{muLatest ? muLatest.not_crawled : '—'}</div>
                    <div className="card-sub">{muLatest ? pct(muLatest.not_crawled, muLatest.total_urls) + ' del totale' : ''}</div>
                </div>
                <div className="card">
                    <div className="card-label">Scansioni Totali</div>
                    <div className="card-value">{scans.length}</div>
                    <div className="card-sub">{scans.length > 0 ? `Ultima: ${scans[0]?.date}` : 'Nessun dato'}</div>
                </div>
            </div>

            {/* Progression Chart */}
            <div className="chart-card" style={{marginBottom:'28px'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px'}}>
                    <h3>Progressione Indicizzazione</h3>
                    <div style={{display:'flex', gap:'8px'}}>
                        {['all','merinouniversity','worldofmerino'].map(f => (
                            <button key={f} onClick={()=>setFilter(f)}
                                className={filter === f ? 'btn btn-primary' : 'btn btn-secondary'}
                                style={{padding:'5px 12px', fontSize:'12px'}}>
                                {f === 'all' ? 'Tutti' : f === 'merinouniversity' ? 'MU' : 'WoM'}
                            </button>
                        ))}
                    </div>
                </div>
                <div style={{height:'300px', position:'relative'}}>
                    <canvas ref={chartRef}></canvas>
                </div>
                {scans.length < 2 && (
                    <div style={{textAlign:'center', padding:'12px', color:'#71717a', fontSize:'12px', marginTop:'8px'}}>
                        ℹ️ Il grafico mostrerà la progressione dopo almeno 2 scansioni mensili
                    </div>
                )}
            </div>

            {/* Detail Table */}
            <div className="table-wrap">
                <div className="table-header">
                    <h3>Storico Scansioni</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Sito</th>
                            <th>URL Totali</th>
                            <th>Indexed</th>
                            <th>%</th>
                            <th>Crawled (non indexed)</th>
                            <th>Not Crawled</th>
                            <th>Errori</th>
                            <th>Durata</th>
                        </tr>
                    </thead>
                    <tbody>
                        {getFiltered().map(s => (
                            <tr key={s.id}>
                                <td>{s.date}</td>
                                <td>
                                    <span className={`badge ${s.site.includes('merino') ? 'badge-blue' : 'badge-purple'}`}>
                                        {s.site.includes('merinouniversity') ? 'MU' : 'WoM'}
                                    </span>
                                    {' '}{s.site}
                                </td>
                                <td>{s.total_urls}</td>
                                <td style={{fontWeight:600}}>{s.indexed}</td>
                                <td>
                                    <span className={`badge ${s.indexed/s.total_urls > 0.5 ? 'badge-green' : s.indexed/s.total_urls > 0.1 ? 'badge-yellow' : 'badge-red'}`}>
                                        {pct(s.indexed, s.total_urls)}
                                    </span>
                                </td>
                                <td>{s.crawled_not_indexed || 0}</td>
                                <td>{s.not_crawled || 0}</td>
                                <td>{s.errors || 0}</td>
                                <td>{s.duration_minutes ? s.duration_minutes + ' min' : '—'}</td>
                            </tr>
                        ))}
                        {getFiltered().length === 0 && (
                            <tr><td colSpan={9} style={{textAlign:'center', color:'#71717a', padding:'24px'}}>Nessuna scansione disponibile</td></tr>
                        )}
                    </tbody>
                </table>
            </div>

            {/* Instructions */}
            <div className="card" style={{marginTop:'16px'}}>
                <h3 style={{fontSize:'14px', fontWeight:600, marginBottom:'12px', color:'#fafafa'}}>📋 Come eseguire una scansione</h3>
                <div style={{fontSize:'12px', color:'#a1a1aa', lineHeight:'1.8'}}>
                    <div>1. Apri il Terminale Mac</div>
                    <div style={{fontFamily:'SF Mono, monospace', background:'#111113', padding:'8px 12px', borderRadius:'6px', margin:'6px 0', color:'#60a5fa'}}>
                        cd /Users/roberto/Documents/Claude/Projects/albeni1905.com/scripts
                    </div>
                    <div>2. Lancia MU:</div>
                    <div style={{fontFamily:'SF Mono, monospace', background:'#111113', padding:'8px 12px', borderRadius:'6px', margin:'6px 0', color:'#60a5fa'}}>
                        python3 gsc_index_monitor.py --property "https://merinouniversity.com/" --sitemap https://merinouniversity.com/sitemap_index.xml
                    </div>
                    <div>3. Lancia WoM:</div>
                    <div style={{fontFamily:'SF Mono, monospace', background:'#111113', padding:'8px 12px', borderRadius:'6px', margin:'6px 0', color:'#60a5fa'}}>
                        python3 gsc_index_monitor.py --property "https://worldofmerino.com/" --sitemap https://worldofmerino.com/sitemap_index.xml
                    </div>
                    <div style={{marginTop:'8px', color:'#71717a'}}>
                        ⏱️ ~1h40m per 280 URL · 📅 Task schedulato: 1° di ogni mese · I risultati vengono inviati automaticamente a questa dashboard
                    </div>
                </div>
            </div>
        </React.Fragment>
    );
}

  async function loadReport() {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch('/v1/adv/allocate');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      setReport(data);
      setConfigMonth(data.config.currentMonth);

      setError(e.message);
    } finally {
      setLoading(false);

                                    ? <span style={{color:'#b45309'}}>{attrStaleNote}</span>
                                    : cr.length ? <>CR conversioni / attribuzioni per cluster</> : <span className="exec-skel">In caricamento…</span>}
                            </div>
                            {!isStale && cr.map(c => {
                                const widthPct = maxCr > 0 ? Math.max(c.cr_pct / maxCr * 100, 3) : 0;
                                return (
                                    <div className="exec-cluster" key={c.cluster}>
                                        <span className="name">{c.cluster.replace(/_/g, ' ').slice(0, 14)}</span>
                                        <div className="barwrap"><div className="bar" style={{width: `${widthPct}%`}}></div></div>
                                        <span className="pct">{c.cr_pct}%</span>
                                    </div>
                                );
                            })}
                            <div style={{fontSize:'9px',color:'#71717a',marginTop:'4px'}}>
                                {isStale ? 'La tile torna live al primo click paid tracciato' : `window: ${window}`}
                            </div>
                            <div className="exec-threshold">
                                <div className="exec-tlabel">CR target (doc 19)</div>
                                <div className="exec-tmeta" style={{fontSize:'10px'}}>
                                    <span>Heritage {targets.heritage_mature}%</span><span>Business {targets.business_professional}%</span>
                                </div>
                            </div>
                            <div className="exec-tfoot"><span className="src">/v1/executive/aggregates</span><span>↻ 60s</span></div>
                        </div>
                    );
                })()}

                {/* TILE 7 — SEO Health Multidominio (LIVE) */}
                <div className={`exec-tile ${seoState === 'sg' ? 'sg' : seoState === 'sy' ? 'sy' : 'sr'}`}>
                    <div className="exec-thead">
                        <p className="exec-ttitle">SEO Health 4 domini</p>
                        <span className="exec-tnum">07</span>
                    </div>
                    <span className="exec-sbadge g">● Live</span>
                    <div className="exec-msub" style={{marginBottom:'6px'}}>Cannibalization score · soglia &lt;6%</div>
                    {domains.slice(0, 4).map(d => {
                        const score = d.cannibalization_score ?? 0;
                        const cls = score > 6 ? 'bad' : score > 4 ? 'warn' : 'ok';
                        const name = (d.domain || '').replace(/^https?:\/\//, '').replace(/^www\./, '');
                        return (
                            <div className="exec-dom" key={name}>
                                <span><b>{name}</b></span>
                                <span className={`val ${cls}`}>{score.toFixed(1)}%</span>
                            </div>
                        );
                    })}
                    {domains.length === 0 && <div className="exec-msub exec-skel">In caricamento…</div>}
                    <div className="exec-threshold">
                        <div className="exec-tlabel">Soglie max-domain</div>
                        <div className="exec-tbar"><div className="sg"></div><div className="sy"></div><div className="sr"></div></div>
                        <div className="exec-tmeta"><span>≤4%</span><span>4-6%</span><span>&gt;6%</span></div>
                    </div>
                    <div className="exec-tfoot"><span className="src">/v1/seo/health</span><span>↻ 24h</span></div>
                </div>

                {/* TILE 8 — Anomalie & Alert (LIVE via /v1/anomaly/alerts, Step 3b 14 mag) */}
                {(() => {
                    const an = anomalies;
                    const counts = an?.counts || {INFO: 0, WARNING: 0, CRITICAL: 0};
                    const total = an?.total ?? 0;
                    const recent = (an?.alerts || []).slice(0, 3);
                    // Stato basato sulla severity più alta presente
                    const state = counts.CRITICAL > 0 ? 'sr'
                                : counts.WARNING > 0 ? 'sy'
                                : (total > 0 ? 'sg' : 'sg');  // INFO o vuoto → verde
                    const badgeClass = counts.CRITICAL > 0 ? 'r'
                                     : counts.WARNING > 0 ? 'y'
                                     : 'g';
                    const badgeText = an === null
                        ? '● In caricamento'
                        : total === 0 ? '● Live · Nessuno'
                        : counts.CRITICAL > 0 ? `● ${counts.CRITICAL} CRITICAL`
                        : counts.WARNING > 0 ? `● ${counts.WARNING} WARNING`
                        : `● ${counts.INFO} INFO`;
                    const mainVal = total;
                    return (
                        <div className={`exec-tile ${state}`}>
                            <div className="exec-thead">
                                <p className="exec-ttitle">Anomalie &amp; Alert 7gg</p>
                                <span className="exec-tnum">08</span>
                            </div>
                            <span className={`exec-sbadge ${badgeClass}`}>{badgeText}</span>
                            <div className="exec-metric">
                                <span className="exec-mval" style={{color: counts.CRITICAL > 0 ? '#fca5a5' : counts.WARNING > 0 ? '#fbbf24' : '#4ade80'}}>{mainVal}</span>
                                <span className="exec-munit">alert aperti</span>
                            </div>
                            <div className="exec-msub">
                                CRITICAL <strong>{counts.CRITICAL}</strong> · WARNING <strong>{counts.WARNING}</strong> · INFO <strong>{counts.INFO}</strong>
                            </div>
                            <div className="exec-buglist">
                                {recent.length > 0 ? recent.map(a => (
                                    <div className="row" key={a.id}>{a.severity} · {a.metric_name}: {a.message.length > 70 ? a.message.slice(0, 70) + '…' : a.message}</div>
                                )) : <div className="row" style={{color:'#52525b'}}>Nessun alert in 7gg · sistema sano</div>}
                            </div>
                            <div className="exec-threshold">
                                <div className="exec-tlabel">Severity</div>
                                <div className="exec-tbar"><div className="sg"></div><div className="sy"></div><div className="sr"></div></div>
                                <div className="exec-tmeta"><span>INFO ≥10%</span><span>WARN ≥25%</span><span>CRIT ≥50%</span></div>
                            </div>
                            <div className="exec-tfoot"><span className="src">/v1/anomaly/alerts · cron 04:15 UTC</span><span>↻ 60s</span></div>
                        </div>
                    );
                })()}

            </div>

            {/* PANNELLO SEMANTIC DEFENSE — cluster C6 (moat competitivo micron-è) */}
            {(() => {
                const sd = semanticDefense;
                const latest = sd?.latest;
                const hasData = !!latest;
                const fmt = (n) => (n === null || n === undefined ? '—' : Number(n).toLocaleString('it-IT'));

                return (
                    <div className="sd-panel">
                        <div className="sd-header">
                            <div>
                                <div className="sd-title">Cluster C6 · Semantic Defense — moat competitivo</div>
                                <div className="sd-subtitle">
                                    {hasData
                                        ? `Snapshot del ${latest.date} · 25% budget · 3 cornerstones MerinoUniversity (Cut&Sew, Super 120's, 17-Micron Reda)`
                                        : 'Engine in warming up — lancia POST /v1/semantic-defense/snapshot per il primo daily'}
                                </div>
                            </div>
                            <span className="sd-tag">{hasData ? `${sd.snapshots_count} snapshot(s)` : 'NO DATA'}</span>
                        </div>

                        <div className="sd-grid">
                            <div className="sd-card">
                                <div className="sd-card-label">Featured Snippets</div>
                                <div>
                                    <span className="sd-card-value">{hasData ? fmt(latest.featured_snippets_count) : '—'}</span>
                                    <span className="sd-card-unit">pos 0 SERP</span>
                                </div>
                                <div className="sd-card-sub">
                                    {hasData && latest.featured_snippets_data && latest.featured_snippets_data.length > 0
                                        ? <>Top: <strong>{latest.featured_snippets_data[0].keyword}</strong></>
                                        : <span className="sd-skel">Nessuna keyword in pos 0</span>}
                                </div>
                            </div>

                            <div className="sd-card">
                                <div className="sd-card-label">Authority Backlinks</div>
                                <div>
                                    <span className="sd-card-value">{hasData ? fmt(latest.authority_backlinks_count) : '—'}</span>
                                    <span className="sd-card-unit">DR ≥ 40</span>
                                </div>
                                <div className="sd-card-sub">
                                    {hasData && latest.authority_backlinks_top_domains && latest.authority_backlinks_top_domains.length > 0
                                        ? <>Top: <strong>{latest.authority_backlinks_top_domains[0].domain}</strong></>
                                        : <span className="sd-skel">Nessun backlink rilevato</span>}
                                </div>
                            </div>

                            <div className="sd-card">
                                <div className="sd-card-label">Topical Authority</div>
                                <div>
                                    <span className="sd-card-value">{hasData ? fmt(latest.keywords_top10) : '—'}</span>
                                    <span className="sd-card-unit">keyword in top10</span>
                                </div>
                                <div className="sd-card-sub">
                                    {hasData
                                        ? <>top3 <strong>{latest.keywords_top3}</strong> · tracked <strong>{latest.keywords_total_tracked}</strong>{latest.keywords_avg_position !== null && <> · avg pos <strong>{latest.keywords_avg_position}</strong></>}</>
                                        : <span className="sd-skel">Snapshot non disponibile</span>}
                                </div>
                            </div>

                            <div className="sd-card">
                                <div className="sd-card-label">Educational Engagement</div>
                                <div>
                                    <span className="sd-card-value">{hasData ? fmt(latest.edu_sessions_count) : '—'}</span>
                                    <span className="sd-card-unit">sess. MU 7gg</span>
                                </div>
                                <div className="sd-card-sub">
                                    {hasData && latest.edu_avg_ids !== null
                                        ? <>IDS medio <strong>{latest.edu_avg_ids}</strong></>
                                        : <span className="sd-skel">Sessioni MU non sufficienti</span>}
                                </div>
                            </div>
                        </div>

                        {hasData && latest.keywords_data && latest.keywords_data.length > 0 && (
                            <div className="sd-kw-list">
                                <div className="sd-card-label" style={{marginBottom: 8}}>Top keyword in rank (snapshot più recente)</div>
                                {latest.keywords_data.slice(0, 5).map((kw, i) => (
                                    <div className="sd-kw-row" key={i}>
                                        <span>{kw.keyword} <span style={{color:'#64748b'}}>· {kw.domain}</span></span>
                                        <span className="sd-kw-pos">pos {kw.position}{kw.volume ? <span style={{color:'#94a3b8',fontWeight:400}}> · {kw.volume.toLocaleString('it-IT')} vol</span> : null}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="sd-foot">
                            <span>Source: <code>/v1/semantic-defense/dashboard</code> · cron daily 04:45 UTC</span>
                            <span>{hasData ? `↻ ${sd.window_days}d trend` : '↻ 60s'}</span>
                        </div>
                    </div>
                );
            })()}

            <div className="exec-footnote">
                <strong>Dashboard Executive v1 · Step 1 wiring live.</strong>{' '}
                Tile <span style={{color:'#4ade80'}}><strong>VERDE</strong></span> (3, 4, 5, 7) connessi agli endpoint reali con refresh 60s.{' '}
                Tile <span style={{color:'#fbbf24'}}><strong>GIALLO</strong></span> (1, 2, 6) attendono aggregazione GA4 cross-channel.{' '}
                Tile <strong>8</strong> ora live via <code>/v1/anomaly/alerts</code>: cron daily 04:15 UTC + 3 KPI monitorati (cpa_7d, organic_pct, heritage_mature_cr).{' '}
                Pannello <strong>Semantic Defense</strong> (sotto la griglia) wirato a <code>/v1/semantic-defense/dashboard</code>, cron daily 04:45 UTC con 4 metriche (Featured Snippets · Authority Backlinks · Topical Authority · Educational Engagement).
            </div>
        </div>
    );
}
</script>
</body>
</html>
