                        <div style={{fontSize:'12px',color:'#71717a',lineHeight:'1.8'}}>
                            CSV, XLSX, PDF, DOCX, JSON, TXT — Riconoscimento automatico della fonte<br/>
                            📊 Semrush &nbsp; 📈 Google Analytics &nbsp; 💰 Google Ads &nbsp; 🔍 Search Console &nbsp; 🔗 Ahrefs &nbsp; 🐸 Screaming Frog &nbsp; 🛒 Shopify &nbsp; 📧 Klaviyo &nbsp; 📄 Custom
                        </div>
                        {uploading && <div style={{marginTop:'12px'}}><span className="spinner"></span></div>}
                    </div>

                    {uploadResult && (
                        <div className="card" style={{borderColor:'#166534'}}>
                            <h3 style={{fontSize:'14px',marginBottom:'12px',color:'#fafafa'}}>Risultati Import</h3>
                            {uploadResult.map((r, i) => (
                                <React.Fragment key={i}>
                                    <div style={{padding:'8px 0',borderBottom:'1px solid #1e1e21',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                        <div>
                                            <span style={{fontWeight:500,color:'#e4e4e7',fontSize:'13px'}}>{r.filename}</span>
                                            {(r.source || r.export_type) && <span style={{marginLeft:'8px'}}>{typeBadge(r.export_type, r.source, r.file_type)}</span>}
                                        </div>
                                        <div style={{display:'flex',gap:'8px',alignItems:'center',flexShrink:0}}>
                                            {r.rows_imported && <span style={{fontSize:'12px',color:'#4ade80'}}>{fmt(r.rows_imported)} righe</span>}
                                            <span className={`badge ${r.status === 'imported' ? 'badge-green' : 'badge-red'}`}>
                                                {r.status === 'imported' ? '✅ Importato' : '❌ Errore'}
                                            </span>
                                        </div>
                                    </div>
                                    {r.status === 'error' && r.error && (
                                        <div style={{fontSize:'11px',color:'#f87171',marginTop:'4px',paddingLeft:'8px',paddingBottom:'6px'}}>{r.error}</div>
                                    )}
                                </React.Fragment>
                            ))}
                        </div>
                    )}
                </React.Fragment>
            )}

            {/* TAB: Library */}
            {activeTab === 'library' && (
                <React.Fragment>
                    {loading ? (
                        <div style={{textAlign:'center',padding:'40px'}}><span className="spinner"></span></div>
                    ) : imports.length === 0 ? (
                        <div className="card" style={{textAlign:'center',padding:'40px',color:'#52525b'}}>
                            Nessun dato importato. Vai alla tab "Carica File" per importare dati da qualsiasi fonte (Semrush, GA4, Google Ads, Ahrefs, PDF, DOCX...).
                        </div>
                    ) : (
                        <React.Fragment>
                            <div className="table-wrap">
                                <div className="table-header">
                                    <h3>Dataset Importati ({imports.length})</h3>
                                </div>
                                <table>
                                    <thead><tr><th>File</th><th>Fonte</th><th>Tipo</th><th>Righe</th><th>Dettaglio</th><th>Importato</th><th>Azioni</th></tr></thead>
                                    <tbody>
                                        {imports.map(imp => (
                                            <tr key={imp.id} style={{cursor:'pointer',background: selectedImport?.id === imp.id ? '#1e1e21' : 'transparent'}}
                                                onClick={() => viewImport(imp)}>
                                                <td style={{fontWeight:500}}>{imp.metadata?.label || imp.label || imp.filename}</td>
                                                <td>{sourceBadge(imp.source, imp.file_type)}</td>
                                                <td style={{fontSize:'11px',color:'#a1a1aa'}}>{imp.category || imp.export_type || imp.file_type || '—'}</td>
                                                <td>{fmt(imp.rows_count || imp.row_count)}</td>
                                                <td style={{fontSize:'11px',color:'#71717a'}}>{imp.summary?.keywords ? `${fmt(imp.summary.keywords)} kw` : imp.summary?.word_count ? `${fmt(imp.summary.word_count)} parole` : '—'}</td>
                                                <td style={{fontSize:'12px',color:'#71717a'}}>{fmtDate(imp.imported_at)}</td>
                                                <td>
                                                    <div style={{display:'flex',gap:'4px'}}>
                                                        <button className="btn btn-secondary" style={{padding:'3px 8px',fontSize:'10px'}}
                                                            onClick={(e) => { e.stopPropagation(); handleAutoTag(imp); setActiveTab('context'); }}>
                                                            🏷️
                                                        </button>
                                                        <button className="btn btn-secondary" style={{padding:'3px 8px',fontSize:'10px',color:'#f87171'}}
                                                            onClick={(e) => { e.stopPropagation(); deleteImport(imp.id); }}>
                                                            Elimina
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Import detail panel */}
                            {selectedImport && (
                                <div className="card" style={{marginTop:'16px',borderColor:'#3b82f6'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                                        <h3 style={{fontSize:'14px',color:'#fafafa'}}>
                                            {selectedImport.metadata?.label || selectedImport.filename} — Dettaglio
                                        </h3>
                                        <div style={{display:'flex',gap:'6px'}}>
                                            {typeBadge(selectedImport.export_type, selectedImport.source, selectedImport.file_type)}
                                            <span className="badge badge-gray">{fmt(selectedImport.rows_count)} righe</span>
                                        </div>
                                    </div>

                                    {/* Top keywords */}
                                    {selectedImport.summary?.top_volume_keywords?.length > 0 && (
                                        <div style={{marginBottom:'12px'}}>
                                            <div style={{fontSize:'11px',color:'#52525b',textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:'6px'}}>Top keyword per volume</div>
                                            <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                                                {selectedImport.summary.top_volume_keywords.map((kw, i) => (
                                                    <span key={i} style={{fontSize:'11px',padding:'4px 10px',background:'#1e1e21',borderRadius:'6px',color:'#a1a1aa'}}>
                                                        {kw.keyword} <span style={{color:'#4ade80',fontWeight:600}}>{fmt(kw.volume)}</span>
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Data table */}
                                    {loadingData ? (
                                        <div style={{textAlign:'center',padding:'20px'}}><span className="spinner"></span></div>
                                    ) : importData?.data ? (
                                        <div style={{maxHeight:'350px',overflowY:'auto',border:'1px solid #1e1e21',borderRadius:'8px'}}>
                                            <table style={{fontSize:'11px'}}>
                                                <thead>
                                                    <tr>
                                                        {selectedImport.columns?.slice(0, 8).map(col => (
                                                            <th key={col} style={{position:'sticky',top:0,background:'#111113',zIndex:1}}>{col}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {importData.data.slice(0, 100).map((row, i) => (
                                                        <tr key={i}>
                                                            {selectedImport.columns?.slice(0, 8).map(col => (
                                                                <td key={col} style={{fontSize:'11px',maxWidth:'200px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                                                    {typeof row[col] === 'number' ? fmt(row[col]) : (row[col] || '—')}
                                                                </td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            {importData.data.length > 100 && (
                                                <div style={{textAlign:'center',padding:'8px',fontSize:'11px',color:'#52525b'}}>
                                                    Mostrate 100 di {fmt(importData.data.length)} righe
                                                </div>
                                            )}
                                        </div>
                                    ) : null}
                                </div>
                            )}
                        </React.Fragment>
                    )}
                </React.Fragment>
            )}

            {/* TAB: Context (Agent Knowledge Bridge) */}
            {activeTab === 'context' && (
                <React.Fragment>
                    {!contextSummary && (() => { loadContext(); return null; })()}

                    {/* Context summary cards */}
                    {contextSummary && (
                        <div className="cards-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:'20px'}}>
                            <div className="card">
                                <div className="card-label">File Taggati</div>
                                <div className="card-value green">{contextSummary.tagged_imports}</div>
                                <div className="card-sub">su {contextSummary.total_imports_in_hub} importati</div>
                            </div>
                            <div className="card">
                                <div className="card-label">Non Taggati</div>
                                <div className="card-value yellow">{contextSummary.untagged_imports}</div>
                                <div className="card-sub">da classificare</div>
                            </div>
                            <div className="card">
                                <div className="card-label">Categorie Attive</div>
                                <div className="card-value">{contextSummary.categories_in_use}</div>
                                <div className="card-sub">su {contextSummary.categories_available} disponibili</div>
                            </div>
                            <div className="card">
                                <div className="card-label">Agenti Serviti</div>
                                <div className="card-value green">{agentContextMap.filter(a => a.total_context_files > 0).length}</div>
                                <div className="card-sub">su {agentContextMap.length} totali</div>
                            </div>
                        </div>
                    )}

                    {/* Skill Sync Section */}
                    <div className="card" style={{marginBottom:'20px',padding:'20px'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <div>
                                <h3 style={{fontSize:'14px',color:'#fafafa',marginBottom:'4px'}}>🧠 Sincronizza Skill Cowork</h3>
                                <div style={{fontSize:'12px',color:'#71717a'}}>
                                    Importa le skill AI (SEO Agent, MT Translator, MT Validator, MT Orchestrator) nel Data Hub per arricchire il contesto degli agenti.
                                </div>
                            </div>
                            <button className="btn btn-primary" style={{padding:'8px 20px',fontSize:'12px',whiteSpace:'nowrap'}}
                                onClick={syncSkills} disabled={skillSyncing}>
                                {skillSyncing ? '⏳ Sincronizzando...' : '🔄 Sincronizza Skill'}
                            </button>
                        </div>
                        {skillSyncResult && !skillSyncResult.error && (
                            <div style={{marginTop:'14px',padding:'12px',background:'#052e16',borderRadius:'8px',border:'1px solid #166534'}}>
                                <div style={{fontSize:'12px',color:'#4ade80',marginBottom:'6px'}}>✅ Sincronizzazione completata</div>
                                <div style={{display:'flex',gap:'20px',fontSize:'12px',color:'#a1a1aa'}}>
                                    <span>📥 Importati: <strong style={{color:'#4ade80'}}>{skillSyncResult.synced || 0}</strong></span>
                                    <span>⏭️ Già presenti: <strong style={{color:'#facc15'}}>{skillSyncResult.skipped || 0}</strong></span>
                                    {skillSyncResult.errors > 0 && <span>❌ Errori: <strong style={{color:'#f87171'}}>{skillSyncResult.errors}</strong></span>}
                                </div>
                                {skillSyncResult.details && skillSyncResult.details.length > 0 && (
                                    <div style={{marginTop:'10px',maxHeight:'120px',overflowY:'auto'}}>
                                        {skillSyncResult.details.map((d, i) => (
                                            <div key={i} style={{fontSize:'11px',color:'#4ade80',padding:'2px 0'}}>
                                                📥 {d.file} — {d.action === 're-tagged' ? 'ri-taggato' : 'importato e taggato'} ({(d.tags||[]).join(', ')})
                                            </div>
                                        ))}
                                        {(skillSyncResult.skipped_details||[]).map((d, i) => (
                                            <div key={'s'+i} style={{fontSize:'11px',color:'#facc15',padding:'2px 0'}}>
                                                ⏭️ {d.file} — {d.reason || 'saltato'}
                                            </div>
                                        ))}
                                        {(skillSyncResult.error_details||[]).map((d, i) => (
                                            <div key={'e'+i} style={{fontSize:'11px',color:'#f87171',padding:'2px 0'}}>
                                                ❌ {d.file} — {d.error || 'errore'}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        {skillSyncResult?.error && (
                            <div style={{marginTop:'14px',padding:'12px',background:'#450a0a',borderRadius:'8px',border:'1px solid #991b1b'}}>
                                <div style={{fontSize:'12px',color:'#f87171'}}>❌ Errore: {skillSyncResult.error}</div>
                            </div>
                        )}
                    </div>

                    {/* Tagging modal */}
                    {taggingImport && (
                        <div className="card" style={{marginBottom:'20px',borderColor:'#8b5cf6',padding:'24px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
                                <h3 style={{fontSize:'15px',color:'#fafafa'}}>
                                    🏷️ Tagga: {taggingImport.label || taggingImport.filename}
                                </h3>
                                <button className="btn btn-secondary" style={{padding:'4px 10px',fontSize:'11px'}}
                                    onClick={() => { setTaggingImport(null); setAutoTagResult(null); setSelectedTags([]); }}>✕ Chiudi</button>
                            </div>

                            {/* Auto-tag suggestions */}
                            {autoTagResult?.suggested_tags?.length > 0 && (
                                <div style={{marginBottom:'16px',padding:'12px',background:'#1e1e21',borderRadius:'8px'}}>
                                    <div style={{fontSize:'11px',color:'#a1a1aa',marginBottom:'8px'}}>🤖 Suggerimenti automatici (basati sul contenuto):</div>
                                    <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                                        {autoTagResult.suggested_tags.map(s => (
                                            <span key={s.tag} onClick={() => setSelectedTags(prev => prev.includes(s.tag) ? prev.filter(t => t !== s.tag) : [...prev, s.tag])}
                                                style={{padding:'4px 10px',borderRadius:'14px',fontSize:'11px',cursor:'pointer',
                                                    background: selectedTags.includes(s.tag) ? '#5b21b6' : '#27272a',
                                                    color: selectedTags.includes(s.tag) ? '#e9d5ff' : '#a1a1aa',
                                                    border: selectedTags.includes(s.tag) ? '1px solid #7c3aed' : '1px solid #3f3f46'}}>
                                                {s.label} ({s.score})
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* All categories */}
                            <div style={{fontSize:'11px',color:'#71717a',marginBottom:'8px'}}>Tutte le categorie:</div>
                            <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'16px'}}>
                                {contextCategories.map(cat => (
                                    <span key={cat.key} onClick={() => setSelectedTags(prev => prev.includes(cat.key) ? prev.filter(t => t !== cat.key) : [...prev, cat.key])}
                                        style={{padding:'5px 12px',borderRadius:'14px',fontSize:'11px',cursor:'pointer',
                                            background: selectedTags.includes(cat.key) ? '#5b21b6' : '#18181b',
                                            color: selectedTags.includes(cat.key) ? '#e9d5ff' : '#a1a1aa',
                                            border: selectedTags.includes(cat.key) ? '1px solid #7c3aed' : '1px solid #27272a'}}>
                                        {cat.icon} {cat.label}
                                    </span>
                                ))}
                            </div>

                            {/* Priority slider */}
                            <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'16px'}}>
                                <span style={{fontSize:'12px',color:'#a1a1aa'}}>Priorità:</span>
                                <input type="range" min="1" max="10" value={tagPriority} onChange={e => setTagPriority(parseInt(e.target.value))}
                                    style={{flex:1}} />
                                <span style={{fontSize:'13px',fontWeight:600,color: tagPriority >= 8 ? '#4ade80' : tagPriority >= 5 ? '#fbbf24' : '#a1a1aa'}}>
                                    {tagPriority}/10
                                </span>
                            </div>

                            <button className="btn btn-primary" onClick={handleTag} disabled={selectedTags.length === 0}>
                                🏷️ Salva Tag ({selectedTags.length} selezionati)
                            </button>
                        </div>
                    )}

                    {/* Agent context map */}
                    <div className="table-wrap" style={{marginBottom:'20px'}}>
                        <div className="table-header">
                            <h3>🧠 Mappa Contesto → Agenti</h3>
                        </div>
                        <table>
                            <thead><tr><th>Agente</th><th>Categorie Contesto</th><th>File Disponibili</th></tr></thead>
                            <tbody>
                                {agentContextMap.map(agent => (
                                    <tr key={agent.agent_id}>
                                        <td style={{fontWeight:500}}>{agent.agent_name}</td>
                                        <td>
                                            <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
                                                {agent.context_categories.map(cat => (
                                                    <span key={cat.category} style={{fontSize:'10px',padding:'2px 8px',borderRadius:'10px',
                                                        background: cat.files_available > 0 ? '#052e16' : '#1e1e21',
                                                        color: cat.files_available > 0 ? '#4ade80' : '#52525b'}}>
                                                        {cat.icon} {cat.label}
                                                    </span>
                                                ))}
                                            </div>
                                        </td>
                                        <td>
                                            <span className={`badge ${agent.total_context_files > 0 ? 'badge-green' : 'badge-gray'}`}>
                                                {agent.total_context_files} file
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Tagged files list */}
                    <div className="table-wrap" style={{marginBottom:'20px'}}>
                        <div className="table-header">
                            <h3>🏷️ File Taggati ({taggedFiles.length})</h3>
                        </div>
                        {taggedFiles.length === 0 ? (
                            <div style={{padding:'32px',textAlign:'center',color:'#52525b',fontSize:'13px'}}>
                                Nessun file taggato. Vai alla tab "Libreria Dati" e clicca 🏷️ su un file per taggarlo.
                            </div>
                        ) : (
                            <table>
                                <thead><tr><th>File</th><th>Tag</th><th>Priorità</th><th>Azioni</th></tr></thead>
                                <tbody>
                                    {taggedFiles.map(f => (
                                        <tr key={f.id}>
                                            <td style={{fontWeight:500}}>{f.label || f.filename}</td>
                                            <td>
                                                <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
                                                    {(f.tag_icons || []).map((icon, i) => (
                                                        <span key={i} className="badge badge-purple" style={{fontSize:'10px'}}>
                                                            {icon} {f.tag_labels?.[i]}
                                                        </span>
                                                    ))}
                                                </div>
                                            </td>
                                            <td><span style={{color: f.priority >= 8 ? '#4ade80' : f.priority >= 5 ? '#fbbf24' : '#a1a1aa',fontWeight:600}}>{f.priority}/10</span></td>
                                            <td>
                                                <div style={{display:'flex',gap:'4px'}}>
                                                    <button className="btn btn-secondary" style={{padding:'3px 8px',fontSize:'10px'}}
                                                        onClick={() => handleAutoTag(f)}>🏷️ Modifica</button>
                                                    <button className="btn btn-secondary" style={{padding:'3px 8px',fontSize:'10px',color:'#f87171'}}
                                                        onClick={() => handleUntag(f.id)}>Rimuovi</button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>

                    {/* Untagged files: show library items not yet tagged */}
                    {imports.filter(imp => !taggedFiles.some(t => t.id === imp.id)).length > 0 && (
                        <div className="table-wrap">
                            <div className="table-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                <h3>📂 File Non Taggati — Da Classificare</h3>
                                <button className="btn btn-primary" style={{padding:'6px 16px',fontSize:'12px'}}
                                    onClick={autoTagAll} disabled={autoTagAllRunning}>
                                    {autoTagAllRunning ? '⏳ Analisi in corso...' : '🤖 Auto-Tag Tutti'}
                                </button>
                            </div>
                            {autoTagAllResult && !autoTagAllResult.error && (
                                <div style={{padding:'12px 16px',background:'#052e16',borderBottom:'1px solid #166534'}}>
                                    <div style={{fontSize:'12px',color:'#4ade80',marginBottom:'6px'}}>✅ Auto-classificazione completata</div>

                                        {autoTagAllResult.errors > 0 && <span>❌ Errori: <strong style={{color:'#f87171'}}>{autoTagAllResult.errors}</strong></span>}
                                    </div>
                                    {autoTagAllResult.details && autoTagAllResult.details.filter(d => d.status === 'tagged').length > 0 && (
                                        <div style={{marginTop:'8px',maxHeight:'100px',overflowY:'auto'}}>
                                            {autoTagAllResult.details.filter(d => d.status === 'tagged').map((d, i) => (
                                                <div key={i} style={{fontSize:'11px',color:'#4ade80',padding:'1px 0'}}>
                                                    🏷️ {d.filename} → {(d.tags_applied||[]).join(', ')} (priorità {d.priority})
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                            {autoTagAllResult?.error && (
                                <div style={{padding:'12px 16px',background:'#450a0a',borderBottom:'1px solid #991b1b'}}>
                                    <div style={{fontSize:'12px',color:'#f87171'}}>❌ Errore: {autoTagAllResult.error}</div>
                                </div>
                            )}
                            <table>
                                <thead><tr><th>File</th><th>Fonte</th><th>Righe</th><th>Azioni</th></tr></thead>
                                <tbody>
                                    {imports.filter(imp => !taggedFiles.some(t => t.id === imp.id)).map(imp => (
                                        <tr key={imp.id}>
                                            <td style={{fontWeight:500}}>{imp.label || imp.metadata?.label || imp.filename}</td>
                                            <td>{sourceBadge(imp.source, imp.file_type)}</td>
                                            <td>{fmt(imp.rows_count || imp.row_count)}</td>
                                            <td>
                                                <button className="btn btn-primary" style={{padding:'4px 12px',fontSize:'11px'}}
                                                    onClick={() => handleAutoTag(imp)}>
                                                    🤖 Auto-Tag
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </React.Fragment>
            )}

            {/* TAB: Search */}
            {activeTab === 'search' && (
                <React.Fragment>
                    <div className="card" style={{marginBottom:'16px',display:'flex',gap:'12px',alignItems:'center'}}>
                        <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && searchKeywords()}
                            placeholder="Cerca keyword in tutti i dataset importati (es: merino, wool, lana...)"
                            style={{flex:1,background:'#27272a',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'6px',padding:'10px 14px',fontSize:'13px',outline:'none'}} />
                        <button className="btn btn-primary" onClick={searchKeywords} disabled={searchLoading}>
                            {searchLoading ? <span className="spinner"></span> : '🔎 Cerca'}
                        </button>
                    </div>

                    {searchResults && (
                        <div className="table-wrap">
                            <div className="table-header">
                                <h3>Risultati per "{searchResults.query}" ({searchResults.total})</h3>
                            </div>
                            <table>
                                <thead><tr><th>Keyword</th><th>Volume</th><th>KD</th><th>CPC</th><th>Position</th><th>Fonte</th></tr></thead>
                                <tbody>
                                    {searchResults.results?.slice(0, 50).map((r, i) => (
                                        <tr key={i}>
                                            <td style={{fontWeight:500}}>{r.keyword || '—'}</td>
                                            <td style={{color:'#4ade80'}}>{fmt(r.volume)}</td>
                                            <td><span className={`badge ${(r.kd||0) > 60 ? 'badge-red' : (r.kd||0) > 30 ? 'badge-yellow' : 'badge-green'}`}>{r.kd || '—'}</span></td>
                                            <td>{typeof r.cpc === 'number' ? `€${r.cpc.toFixed(2)}` : '—'}</td>
                                            <td>{r.position || '—'}</td>
                                            <td style={{fontSize:'11px',color:'#52525b'}}>{r._source_file || '—'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {!searchResults && (
                        <div className="card" style={{textAlign:'center',padding:'40px',color:'#52525b'}}>
                            Cerca keyword e contenuti in tutti i dataset importati. I risultati verranno ordinati per rilevanza e volume.
                        </div>
                    )}
                </React.Fragment>
            )}
        </React.Fragment>
    );
}

        let result;
        if (task.method === 'GET') {
            result = await api(task.endpoint);
        } else {
            result = await api(task.endpoint, {
                method: task.method,
                body: task.body ? JSON.stringify(task.body) : undefined,
            });
        }
        const elapsed = Date.now() - startTime;

        const completedLog = {
            time: new Date().toLocaleTimeString('it-IT'),
            agent: agent.name,
            task: task.label,
            status: result && !result.error ? 'success' : 'error',
            latency: elapsed,
        };
        setTaskLog(prev => [completedLog, ...prev.filter(l => l !== logEntry)].slice(0, 50));

        setTaskResult({ agent: agent.name, task: task.label, data: result, latency: elapsed });

                                        <div style={{fontSize:'10px',color:'#3f3f46',marginTop:'2px',fontFamily:'monospace'}}>{task.method} {task.endpoint}</div>
                                    </div>
                                    <button className="btn btn-primary" style={{padding:'6px 14px',fontSize:'12px',whiteSpace:'nowrap'}}
                                        onClick={(e) => { e.stopPropagation(); runTask(selectedAgent, task); }}
                                        disabled={isRunning}>
                                        {isRunning ? <React.Fragment><span className="spinner" style={{marginRight:'6px'}}></span> Running...</React.Fragment> : '▶ Esegui'}
                                    </button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}

            {/* Task Result - only in orchestration tab */}
            {agentTab === 'orchestration' && taskResult && (
                <div className="card" style={{marginBottom:'28px',borderColor: taskResult.data && !taskResult.data.error ? '#166534' : '#7f1d1d'}}>

                        <div style={{display:'flex',gap:'8px'}}>

                                {taskResult.data && !taskResult.data.error ? '✅ Successo' : '❌ Errore'}
                            </span>
                            <span className="badge badge-gray">{taskResult.latency}ms</span>
                        </div>
                    </div>
                    <pre style={{background:'#111113',padding:'16px',borderRadius:'8px',fontSize:'11px',color:'#d4d4d8',whiteSpace:'pre-wrap',maxHeight:'300px',overflowY:'auto',fontFamily:'SF Mono, monospace'}}>
                        {JSON.stringify(taskResult.data, null, 2)}
                    </pre>
                </div>
            )}

            {/* Task Execution Log - only in orchestration tab */}
            {agentTab === 'orchestration' && taskLog.length > 0 && (
                <div className="table-wrap">
                    <div className="table-header">
                        <h3>Log Esecuzioni ({taskLog.length})</h3>
                        <button className="btn btn-secondary" style={{padding:'4px 12px',fontSize:'11px'}} onClick={() => setTaskLog([])}>Pulisci</button>
                    </div>
                    <table>
                        <thead><tr><th>Orario</th><th>Agente</th><th>Task</th><th>Stato</th><th>Latenza</th></tr></thead>
                        <tbody>
                            {taskLog.map((log, i) => (
                                <tr key={i}>
                                    <td style={{fontFamily:'monospace',fontSize:'12px',color:'#52525b'}}>{log.time}</td>
                                    <td style={{fontWeight:500}}>{log.agent}</td>
                                    <td>{log.task}</td>
                                    <td>
                                        <span className={`badge ${log.status==='success'?'badge-green':log.status==='error'?'badge-red':'badge-yellow'}`}>
                                            {log.status === 'success' ? '✅ OK' : log.status === 'error' ? '❌ Error' : '⏳ Running'}

                                    </td>
                                    <td style={{fontFamily:'monospace'}}>{log.latency ? `${log.latency}ms` : '—'}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </React.Fragment>
    );
}

// AI TERMINAL PAGE (Natural Language Command Interface)
// ============================================================
function TerminalPage() {
    const [input, setInput] = useState('');
    const [history, setHistory] = useState([
        { type: 'system', agent: 'Sistema', text: 'Benvenuto nel Terminale AI di micron-è. Scrivi un comando o una domanda in linguaggio naturale.', time: new Date().toLocaleTimeString('it-IT') },
        { type: 'system', agent: 'Sistema', text: 'Digita "help" per vedere i comandi disponibili.', time: new Date().toLocaleTimeString('it-IT') },
    ]);
    const [loading, setLoading] = useState(false);
    const [cmdHistory, setCmdHistory] = useState([]);
    const [historyIndex, setHistoryIndex] = useState(-1);
    const scrollRef = useRef(null);
    const inputRef = useRef(null);

    useEffect(() => {
        if (scrollRef.current) {
            scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
    }, [history]);

    const executeCommand = async (cmd) => {
        if (!cmd.trim()) return;

        // Add user message
        const userMsg = { type: 'user', text: cmd, time: new Date().toLocaleTimeString('it-IT') };
        setHistory(prev => [...prev, userMsg]);
        setCmdHistory(prev => [cmd, ...prev].slice(0, 50));
        setHistoryIndex(-1);
        setInput('');
        setLoading(true);

        try {
            // POST with explicit empty JSON body — without it, FastAPI/uvicorn
            // rejects with "Invalid HTTP request received." (Content-Type declared
            // application/json but no body present). The endpoint takes `command`
            // as query string, so the body itself is unused.
            const res = await fetch(`${ML_API}/v1/terminal/execute?command=${encodeURIComponent(cmd)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
            });
            // Defensive parse: if upstream returned plain text (proxy / 4xx error),
            // surface the actual text instead of throwing on JSON.parse.
            const raw = await res.text();
            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                throw new Error(`Backend returned non-JSON (HTTP ${res.status}): ${raw.substring(0, 200)}`);
            }

            if (data.response) {
                // Help or text response
                setHistory(prev => [...prev, {
                    type: 'response',
                    agent: data.agent || 'Sistema',
                    text: data.response,
                    latency: data.latency_ms,
                    time: new Date().toLocaleTimeString('it-IT'),
                }]);
            } else if (data.error) {
                setHistory(prev => [...prev, {
                    type: 'error',
                    agent: data.agent || 'Sistema',
                    text: `Errore: ${data.error}`,
                    latency: data.latency_ms,
                    time: new Date().toLocaleTimeString('it-IT'),
                }]);
            } else {
                // Result: could be AI text response or structured JSON
                const isTextResponse = typeof data.result === 'string';
                setHistory(prev => [...prev, {
                    type: isTextResponse ? 'response' : 'result',
                    agent: data.agent || '?',
                    action: data.action,
                    text: isTextResponse ? data.result : undefined,
                    data: isTextResponse ? undefined : data.result,
                    latency: data.latency_ms,
                    time: new Date().toLocaleTimeString('it-IT'),
                }]);
            }
        } catch (e) {
            setHistory(prev => [...prev, {
                type: 'error',
                agent: 'Sistema',
                text: `Connessione fallita: ${e.message}. Verifica che i container Docker siano attivi.`,
                time: new Date().toLocaleTimeString('it-IT'),
            }]);
        }

        setLoading(false);
        if (inputRef.current) inputRef.current.focus();
    };

    const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            executeCommand(input);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (cmdHistory.length > 0) {
                const newIndex = Math.min(historyIndex + 1, cmdHistory.length - 1);
                setHistoryIndex(newIndex);
                setInput(cmdHistory[newIndex]);
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex > 0) {
                const newIndex = historyIndex - 1;
                setHistoryIndex(newIndex);
                setInput(cmdHistory[newIndex]);
            } else {
                setHistoryIndex(-1);
                setInput('');
            }
        }
    };

    const quickCommands = [
        { label: 'Status', cmd: 'status' },
        { label: 'Pipeline', cmd: 'pipeline' },
        { label: 'Overview SEO', cmd: 'overview' },
        { label: 'Balance 85/15', cmd: 'balance' },
        { label: 'Benchmark', cmd: 'benchmark' },
        { label: 'Contesto', cmd: 'contesto' },
        { label: 'Agenti', cmd: 'agenti' },
        { label: '💡 Strategia SEO+Paid', cmd: 'implementa una strategia SEO e Paid per i 5 mercati con budget €2500/mese per 6 mesi, con focus su keyword a bassa competizione per i primi 3 mesi' },
        { label: '💡 Piano Editoriale', cmd: 'suggerisci un piano editoriale per i prossimi 3 mesi per tutti e 4 i domini, con focus sul mercato tedesco e il cluster business_professional' },
    ];

    const renderMessage = (msg, i) => {
        if (msg.type === 'user') {
            return (
                <div key={i} style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px'}}>
                    <div style={{maxWidth:'75%',background:'#1e3a5f',borderRadius:'12px 12px 4px 12px',padding:'10px 14px'}}>
                        <div style={{fontSize:'13px',color:'#e4e4e7'}}>{msg.text}</div>
                        <div style={{fontSize:'10px',color:'#52525b',marginTop:'4px',textAlign:'right'}}>{msg.time}</div>
                    </div>
                </div>
            );
        }

        if (msg.type === 'system') {
            return (
                <div key={i} style={{display:'flex',justifyContent:'flex-start',marginBottom:'12px'}}>
                    <div style={{maxWidth:'85%',background:'#18181b',border:'1px solid #27272a',borderRadius:'12px 12px 12px 4px',padding:'10px 14px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px'}}>
                            <span style={{fontSize:'10px',padding:'2px 6px',background:'#27272a',borderRadius:'4px',color:'#a1a1aa',fontWeight:600}}>{msg.agent}</span>
                        </div>
                        <div style={{fontSize:'13px',color:'#a1a1aa',whiteSpace:'pre-wrap',lineHeight:'1.6'}}>{msg.text}</div>
                        <div style={{fontSize:'10px',color:'#3f3f46',marginTop:'4px'}}>{msg.time}</div>
                    </div>
                </div>
            );
        }

        if (msg.type === 'error') {
            return (
                <div key={i} style={{display:'flex',justifyContent:'flex-start',marginBottom:'12px'}}>
                    <div style={{maxWidth:'85%',background:'#1c1012',border:'1px solid #450a0a',borderRadius:'12px 12px 12px 4px',padding:'10px 14px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px'}}>
                            <span style={{fontSize:'10px',padding:'2px 6px',background:'#450a0a',borderRadius:'4px',color:'#fca5a5',fontWeight:600}}>{msg.agent}</span>
                            {msg.latency && <span style={{fontSize:'10px',color:'#52525b'}}>{msg.latency}ms</span>}
                        </div>
                        <div style={{fontSize:'13px',color:'#f87171'}}>{msg.text}</div>
                        <div style={{fontSize:'10px',color:'#3f3f46',marginTop:'4px'}}>{msg.time}</div>
                    </div>
                </div>
            );
        }

        // type === 'result' or 'response'
        const agentColors = {
            'Notion Sync': '#8b5cf6',
            'Content Validator': '#22c55e',
            'Content AI Layer': '#3b82f6',
            'Semrush Specialist': '#f97316',
            'Context Provider': '#a78bfa',
            'Data Hub': '#22d3ee',
            'AI Strategy Director': '#f59e0b',
            'AI Router': '#14b8a6',
            'Klaviyo CRM Sync': '#ec4899',
            'SEO Semantic Brain': '#06b6d4',
            'Intent Engine': '#eab308',
            'Cluster Predictor': '#a855f7',
            'AI Routing Layer': '#14b8a6',
            'Sistema': '#6b7280',
            'System': '#6b7280',
        };
        const agentColor = agentColors[msg.agent] || '#60a5fa';

        return (
            <div key={i} style={{display:'flex',justifyContent:'flex-start',marginBottom:'12px'}}>
                <div style={{maxWidth:'85%',background:'#18181b',border:`1px solid ${agentColor}33`,borderRadius:'12px 12px 12px 4px',padding:'10px 14px',width:'100%'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}}>
                        <span style={{fontSize:'10px',padding:'2px 8px',background:`${agentColor}22`,borderRadius:'4px',color:agentColor,fontWeight:600}}>{msg.agent}</span>
                        {msg.action && <span style={{fontSize:'10px',color:'#52525b'}}>{msg.action}</span>}
                        {msg.latency && <span style={{fontSize:'10px',color:'#52525b',marginLeft:'auto'}}>{msg.latency}ms</span>}
                    </div>
                    {msg.text ? (
                        <div style={{fontSize:'13px',color:'#a1a1aa',whiteSpace:'pre-wrap',lineHeight:'1.6'}}>{msg.text}</div>
                    ) : (
                        <pre style={{fontSize:'11px',color:'#d4d4d8',whiteSpace:'pre-wrap',maxHeight:'250px',overflowY:'auto',background:'#111113',padding:'10px',borderRadius:'6px',fontFamily:'SF Mono, Menlo, monospace',margin:0}}>
                            {JSON.stringify(msg.data, null, 2)}
                        </pre>
                    )}
                    <div style={{fontSize:'10px',color:'#3f3f46',marginTop:'4px'}}>{msg.time}</div>
                </div>
            </div>
        );
    };

    return (
        <React.Fragment>
            <div className="page-header">
                <h2>Terminale AI</h2>
                <div className="btn-group">
                    <button className="btn btn-secondary" style={{padding:'6px 12px',fontSize:'11px'}} onClick={() => {
                        fetch(ML_API + '/v1/terminal/history', {method:'DELETE'}).catch(() => {});
                        setHistory([
                            { type: 'system', agent: 'Sistema', text: 'Terminale pulito. Cronologia conversazione resettata.', time: new Date().toLocaleTimeString('it-IT') }
                        ]);
                    }}>Pulisci</button>
                </div>
            </div>

            {/* Quick commands */}
            <div style={{display:'flex',gap:'6px',marginBottom:'16px',flexWrap:'wrap'}}>
                {quickCommands.map(qc => (
                    <button key={qc.cmd} className="btn btn-secondary" style={{padding:'5px 12px',fontSize:'11px',borderRadius:'20px'}}
                        onClick={() => executeCommand(qc.cmd)} disabled={loading}>
                        {qc.label}
                    </button>
                ))}
            </div>

            {/* Chat area */}
            <div style={{background:'#111113',border:'1px solid #27272a',borderRadius:'12px',display:'flex',flexDirection:'column',height:'calc(100vh - 220px)'}}>
                {/* Messages */}
                <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'20px'}}>
                    {history.map((msg, i) => renderMessage(msg, i))}
                    {loading && (
                        <div style={{display:'flex',justifyContent:'flex-start',marginBottom:'12px'}}>
                            <div style={{background:'#18181b',border:'1px solid #27272a',borderRadius:'12px 12px 12px 4px',padding:'12px 16px',display:'flex',alignItems:'center',gap:'8px'}}>
                                <span className="spinner"></span>
                                <span style={{fontSize:'12px',color:'#71717a'}}>Elaborando...</span>
                            </div>
                        </div>
                    )}
                </div>

                {/* Input area */}
                <div style={{borderTop:'1px solid #27272a',padding:'12px 16px',display:'flex',gap:'10px',alignItems:'center'}}>
                    <div style={{position:'relative',flex:1}}>
                        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown}
                            placeholder="Scrivi un comando... (es: 'quanti task sono pendenti?', 'keyword merino wool', 'benchmark')"
                            disabled={loading}
                            style={{width:'100%',background:'#18181b',color:'#e4e4e7',border:'1px solid #3f3f46',borderRadius:'8px',padding:'12px 16px',fontSize:'13px',outline:'none',fontFamily:'Inter, sans-serif'}} />
                    </div>
                    <button className="btn btn-primary" onClick={() => executeCommand(input)} disabled={loading || !input.trim()} style={{padding:'12px 20px'}}>
                        {loading ? <span className="spinner"></span> : '→'}
                    </button>
                </div>
            </div>
        </React.Fragment>
    );
}
