<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micron-è — AI Control Tower</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #09090b; color: #e4e4e7; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: #111113; border-right: 1px solid #27272a; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .sidebar-brand { padding: 24px 20px; border-bottom: 1px solid #27272a; }
        .sidebar-brand h1 { font-size: 18px; font-weight: 700; color: #fafafa; letter-spacing: -0.5px; }
        .sidebar-brand .subtitle { font-size: 11px; color: #52525b; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
        .nav-section { margin-bottom: 8px; }
        .nav-section-label { font-size: 10px; color: #52525b; text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 12px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #a1a1aa; transition: all 0.15s; }
        .nav-item:hover { background: #18181b; color: #e4e4e7; }
        .nav-item.active { background: #1e3a5f; color: #60a5fa; font-weight: 500; }
        .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
        .nav-item .badge { margin-left: auto; background: #dc2626; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 600; }
        .sidebar-footer { padding: 16px 20px; border-top: 1px solid #27272a; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .status-dot.yellow { background: #eab308; }
        .status-dot.red { background: #ef4444; }

        /* Main content */
        .main { margin-left: 260px; flex: 1; padding: 24px 32px; min-height: 100vh; }
        .page-header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h2 { font-size: 22px; font-weight: 600; color: #fafafa; }
        .page-header .refresh-btn { padding: 8px 16px; background: #1e3a5f; color: #60a5fa; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .page-header .refresh-btn:hover { background: #1e4a7f; }

        /* Cards grid */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; }
        .card-label { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
        .card-value { font-size: 28px; font-weight: 700; color: #fafafa; }
        .card-sub { font-size: 12px; color: #71717a; margin-top: 4px; }
        .card-value.green { color: #4ade80; }
        .card-value.yellow { color: #facc15; }
        .card-value.red { color: #f87171; }

        /* Table */
        .table-wrap { background: #18181b; border: 1px solid #27272a; border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
        .table-header { padding: 16px 20px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
        .table-header h3 { font-size: 15px; font-weight: 600; color: #fafafa; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 16px; font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #27272a; background: #111113; }
        td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #1e1e21; color: #d4d4d8; }
        tr:hover td { background: #1c1c1f; }

        /* Status badges */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #052e16; color: #4ade80; }
        .badge-yellow { background: #422006; color: #fbbf24; }
        .badge-red { background: #450a0a; color: #fca5a5; }
        .badge-blue { background: #0c1f3d; color: #60a5fa; }
        .badge-purple { background: #2e1065; color: #c084fc; }
        .badge-gray { background: #27272a; color: #a1a1aa; }

        /* Charts container */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
        .chart-card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; }
        .chart-card h3 { font-size: 14px; font-weight: 600; color: #fafafa; margin-bottom: 16px; }
        canvas { max-height: 260px; }

        /* Action buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #1e3a5f; color: #64748b; cursor: not-allowed; }
        .btn-secondary { background: #27272a; color: #d4d4d8; }
        .btn-secondary:hover { background: #3f3f46; }
        .btn-danger { background: #7f1d1d; color: #fca5a5; }
        .btn-success { background: #052e16; color: #4ade80; }
        .btn-group { display: flex; gap: 8px; }

        /* Logs */
        .log-entry { padding: 10px 16px; border-bottom: 1px solid #1e1e21; font-size: 12px; font-family: 'SF Mono', monospace; }
        .log-entry .time { color: #52525b; margin-right: 12px; }
        .log-entry .level-info { color: #60a5fa; }
        .log-entry .level-warn { color: #fbbf24; }
        .log-entry .level-error { color: #f87171; }
        .log-entry .level-success { color: #4ade80; }

        /* Loading spinner */
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #3f3f46; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .modal { background: #18181b; border: 1px solid #3f3f46; border-radius: 16px; padding: 28px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #fafafa; }

        /* Progress bar */
        .progress-bar { height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

        /* ============================================================ */
        /* Dashboard Executive — vista sintetica 8 tile (board / partner) */
        /* ============================================================ */
        .exec-page { padding: 0; }
        .exec-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
        .exec-title { font-size: 22px; font-weight: 600; color: #e4e4e7; letter-spacing: -0.01em; margin: 0; }
        .exec-tag { font-size: 10px; font-weight: 600; color: #60a5fa; background: #1e3a5f; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 10px; vertical-align: middle; }
        .exec-meta { font-size: 11px; color: #71717a; text-align: right; }
        .exec-meta strong { color: #a1a1aa; }
        .exec-subtitle { font-size: 12px; color: #71717a; margin: 4px 0 18px; }
        .exec-legend { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
        .exec-legend-title { font-size: 10px; font-weight: 600; text-transform: uppercase; color: #71717a; letter-spacing: 0.05em; }
        .exec-legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #a1a1aa; }
        .exec-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .exec-dot.g { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .exec-dot.y { background: #eab308; }
        .exec-dot.r { background: #ef4444; }
        .exec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        @media (max-width: 1280px) { .exec-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 720px)  { .exec-grid { grid-template-columns: 1fr; } }
        .exec-tile { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px 16px 12px; display: flex; flex-direction: column; min-height: 230px; position: relative; overflow: hidden; }
        .exec-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
        .exec-tile.sg::before { background: #22c55e; }
        .exec-tile.sy::before { background: #eab308; }
        .exec-tile.sr::before { background: #ef4444; }
        .exec-thead { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 6px; }
        .exec-ttitle { font-size: 10px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
        .exec-tnum { font-size: 9px; font-weight: 600; color: #71717a; background: #111113; border: 1px solid #27272a; padding: 1px 5px; border-radius: 4px; }
        .exec-sbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 999px; margin-bottom: 10px; align-self: flex-start; }
        .exec-sbadge.g { color: #4ade80; background: #052e16; }
        .exec-sbadge.y { color: #fbbf24; background: #422006; }
        .exec-sbadge.r { color: #fca5a5; background: #450a0a; }
        .exec-metric { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 4px; }
        .exec-mval { font-size: 30px; font-weight: 600; color: #e4e4e7; line-height: 1.1; letter-spacing: -0.02em; }
        .exec-munit { font-size: 13px; color: #71717a; font-weight: 500; }
        .exec-msub { font-size: 11px; color: #a1a1aa; margin-top: 2px; min-height: 16px; }
        .exec-msub strong { color: #e4e4e7; font-weight: 600; }
        .exec-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; margin-left: 4px; }
        .exec-trend.up   { color: #4ade80; }
        .exec-trend.down { color: #fca5a5; }
        .exec-threshold { margin-top: auto; padding-top: 8px; border-top: 1px solid #27272a; }
        .exec-tlabel { font-size: 9px; font-weight: 600; text-transform: uppercase; color: #71717a; letter-spacing: 0.06em; margin-bottom: 5px; }
        .exec-tbar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
        .exec-tbar > div { flex: 1; }
        .exec-tbar .sg { background: #22c55e; opacity: 0.85; }
        .exec-tbar .sy { background: #eab308; opacity: 0.85; }
        .exec-tbar .sr { background: #ef4444; opacity: 0.85; }
        .exec-tbar .sk { background: #52525b; }
        .exec-tmeta { font-size: 9px; color: #71717a; display: flex; justify-content: space-between; }
        .exec-tfoot { margin-top: 8px; padding-top: 6px; font-size: 9px; color: #71717a; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; border-top: 1px solid #27272a; }
        .exec-tfoot .src { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9px; color: #a1a1aa; }
        .exec-stack { display: flex; height: 5px; margin: 6px 0 3px; border-radius: 3px; overflow: hidden; background: #111113; }
        .exec-stack .sa { background: #22c55e; opacity: 0.85; }
        .exec-stack .sb { background: #60a5fa; opacity: 0.85; }
        .exec-smeta { display: flex; justify-content: space-between; font-size: 9px; color: #71717a; margin-bottom: 6px; }
        .exec-dom { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; color: #a1a1aa; }
        .exec-dom b { color: #e4e4e7; font-weight: 600; }
        .exec-dom .val { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
        .exec-dom .val.ok   { color: #4ade80; }
        .exec-dom .val.warn { color: #fbbf24; }
        .exec-dom .val.bad  { color: #fca5a5; }
        .exec-alert { margin-top: 6px; font-size: 10px; background: #422006; color: #fbbf24; padding: 5px 7px; border-radius: 5px; border-left: 2px solid #eab308; }
        .exec-block { margin-top: 6px; font-size: 10px; color: #fca5a5; background: #450a0a; padding: 6px 7px; border-radius: 5px; border-left: 2px solid #ef4444; }
        .exec-block code { background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; font-size: 9px; }
        .exec-cluster { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 4px; }
        .exec-cluster .name { flex: 0 0 85px; color: #a1a1aa; font-size: 10px; }
        .exec-cluster .barwrap { flex: 1; background: #111113; height: 5px; border-radius: 3px; overflow: hidden; border: 1px solid #27272a; }
        .exec-cluster .bar { height: 100%; background: #60a5fa; border-radius: 3px; }
        .exec-cluster .pct { flex: 0 0 32px; text-align: right; font-weight: 600; color: #e4e4e7; font-size: 10px; }
        .exec-trio { display: flex; gap: 10px; font-size: 10px; color: #71717a; margin-top: 4px; }
        .exec-trio > div strong { display: block; color: #e4e4e7; font-size: 16px; font-weight: 600; }
        .exec-buglist { margin-top: 6px; font-size: 10px; color: #a1a1aa; }
        .exec-buglist .row { margin-bottom: 3px; }
        .exec-buglist .row::before { content: '●'; color: #ef4444; font-size: 9px; margin-right: 4px; }
        @keyframes exec-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .exec-pulse { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; animation: exec-pulse 1.6s ease-in-out infinite; display: inline-block; margin-right: 4px; vertical-align: middle; }
        .exec-footnote { margin-top: 18px; padding: 12px 16px; background: #18181b; border: 1px solid #27272a; border-radius: 10px; font-size: 11px; color: #a1a1aa; line-height: 1.5; }
        .exec-footnote strong { color: #e4e4e7; }
        .sd-panel { margin-top: 24px; padding: 18px 20px; background: #0f172a; border: 1px solid #1e3a5f; border-radius: 12px; }
        .sd-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
        .sd-title { font-size: 14px; font-weight: 600; color: #e0e7ff; letter-spacing: 0.02em; }
        .sd-subtitle { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        .sd-tag { font-size: 9px; padding: 2px 8px; background: #1e3a5f; border-radius: 4px; color: #93c5fd; text-transform: uppercase; letter-spacing: 0.05em; }
        .sd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .sd-card { padding: 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; }
        .sd-card-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        .sd-card-value { font-size: 28px; font-weight: 700; color: #e0e7ff; line-height: 1; }
        .sd-card-unit { font-size: 10px; color: #94a3b8; margin-left: 4px; }
        .sd-card-sub { font-size: 10px; color: #cbd5e1; margin-top: 8px; }
        .sd-card-sub strong { color: #93c5fd; }
        .sd-foot { margin-top: 14px; font-size: 10px; color: #64748b; display:flex; justify-content:space-between; }
        .sd-foot code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #93c5fd; font-family: monospace; }
        .sd-kw-list { margin-top: 10px; padding: 10px 12px; background: #1e293b; border-radius: 6px; }
        .sd-kw-row { display:flex; justify-content:space-between; font-size: 10px; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #334155; }
        .sd-kw-row:last-child { border-bottom: 0; }
        .sd-kw-pos { font-weight: 700; color: #93c5fd; }
        .sd-skel { color: #475569; font-style: italic; }
        .exec-skel { color: #52525b; font-style: italic; }

        /* ── Copilota (intelligenza attiva di modulo) ── */
        .coach { margin-bottom: 20px; }
        .coach-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #111318; border: 1px solid #27272a; border-radius: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .coach-bar:hover { border-color: #3f3f46; background: #14161c; }
        .coach-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #7dd3fc; text-transform: uppercase; white-space: nowrap; }
        .coach-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .coach-verdict { font-size: 12.5px; color: #a1a1aa; flex: 1; }
        .coach-toggle { font-size: 11px; color: #52525b; white-space: nowrap; }
        .coach-panel { margin-top: -1px; border: 1px solid #27272a; border-top: 0; border-radius: 0 0 10px 10px; background: #0d0e12; }
        .coach-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #1f1f23; }
        .coach-tab { position: relative; padding: 8px 14px; font-size: 12px; color: #71717a; cursor: pointer; border-radius: 6px 6px 0 0; }
        .coach-tab:hover { color: #d4d4d8; background: #141519; }
        .coach-tab.active { color: #7dd3fc; background: #141a22; font-weight: 600; }
        .coach-tabdot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #f87171; }
        .coach-body { padding: 14px 16px 16px; }
        .coach-empty { font-size: 12px; color: #52525b; font-style: italic; }
        .coach-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #17171a; }
        .coach-row:last-of-type { border-bottom: 0; }
        .coach-row .coach-dot { margin-top: 6px; }
        .coach-rowmain { flex: 1; min-width: 0; }
        .coach-rowhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
        .coach-rowlabel { font-size: 12.5px; font-weight: 600; color: #e4e4e7; }
        .coach-rowval { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .coach-rowstate { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .coach-rowwhy { font-size: 12px; line-height: 1.55; color: #8b8b93; margin-top: 3px; }
        .coach-src { margin-top: 12px; font-size: 10.5px; color: #3f3f46; }
        .coach-src code { color: #52525b; background: #141519; padding: 1px 5px; border-radius: 3px; }
        .coach-act { padding: 12px 14px; background: #131419; border: 1px solid #1f1f23; border-left: 2px solid #3f3f46; border-radius: 6px; margin-bottom: 10px; }
        .coach-act.urgent { border-left-color: #f87171; background: #16111400; background: #151013; }
        .coach-acthead { font-size: 12.5px; font-weight: 600; color: #e4e4e7; }
        .coach-actwhy { font-size: 12px; line-height: 1.55; color: #8b8b93; margin-top: 4px; }
        .coach-actprompt { margin-top: 9px; padding: 9px 11px; background: #0a0b0e; border: 1px solid #1f1f23; border-radius: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.6; color: #a5b4c4; white-space: pre-wrap; }
        .coach-copy { margin-top: 8px; padding: 5px 12px; background: #1e3a5f; color: #93c5fd; border: 0; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .coach-copy:hover { background: #1e4a7f; }
        .coach-hint { margin-top: 12px; font-size: 11px; color: #52525b; line-height: 1.5; }
        .coach-block { margin-bottom: 14px; }
        .coach-block:last-child { margin-bottom: 0; }
        .coach-blabel { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #52525b; margin-bottom: 5px; }
        .coach-block p { font-size: 12.5px; line-height: 1.6; color: #a1a1aa; }
        .coach-trap { font-size: 12.5px; line-height: 1.6; color: #8b8b93; padding: 9px 0 9px 14px; border-left: 2px solid #27272a; margin-bottom: 8px; }

        /* ── Piano d'Azione ── */
        .plan-intro { font-size: 13px; line-height: 1.6; color: #a1a1aa; background: #111318; border: 1px solid #27272a; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
        .plan-intro strong { color: #e4e4e7; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ML_API and ROUTER_API: empty string = same origin (Railway production).
// ai-router serves the dashboard AND proxies /v1/* to ml-worker via app.all('/v1/*').
// For local dev override with ?api=http://localhost:8000&router=http://localhost:3000
const _qs = new URLSearchParams(window.location.search);
const ML_API = _qs.get('api') ?? '';
const ROUTER_API = _qs.get('router') ?? '';

// ============================================================
// API Helper
// ============================================================
async function api(path, opts = {}) {
    try {
        const res = await fetch(`${ML_API}${path}`, {
            headers: { 'Content-Type': 'application/json' },
            ...opts,
        });
        return await res.json();
    } catch (e) {
        console.error(`API error ${path}:`, e);
        return null;
    }
}

// ============================================================
// APP
// ============================================================
function App() {
    const [page, setPage] = useState('dashboard');
    const [health, setHealth] = useState(null);
    const [notionStats, setNotionStats] = useState(null);

    const refreshHealth = useCallback(async () => {
        const h = await api('/health');
        setHealth(h);
    }, []);

    useEffect(() => { refreshHealth(); const i = setInterval(refreshHealth, 30000); return () => clearInterval(i); }, []);
    useEffect(() => { api('/v1/notion/pipeline/stats').then(setNotionStats); }, []);

    const pendingCount = notionStats?.by_status?.['Da Fare'] || 0;

    return (
        <React.Fragment>
            <Sidebar page={page} setPage={setPage} health={health} pendingCount={pendingCount} />
            <div className="main">
                <Coach page={page} />
                {page === 'plan' && <PlanPage />}
                {page === 'executive' && <ExecutivePage />}
                {page === 'dashboard' && <DashboardPage health={health} notionStats={notionStats} />}
                {page === 'notion' && <NotionPage onStatsUpdate={setNotionStats} />}
                {page === 'klaviyo' && <KlaviyoPage />}
                {page === 'seo' && <SEOPage />}
                {page === 'content' && <ContentPage />}
                {page === 'content_library' && <ContentLibraryPage />}
                {page === 'semrush_data' && <SemrushDataPage />}
                {page === 'adv' && <ADVPage />}
                {page === 'agents' && <AgentsPage health={health} />}
                {page === 'terminal' && <TerminalPage />}
                {page === 'gsc' && <GSCPage />}
                {page === 'funnel' && <FunnelPage />}
                {page === 'adv-budget' && <ADVBudgetPage />}
                {page === 'logs' && <LogsPage health={health} />}
            </div>
        </React.Fragment>
    );
}

// ============================================================
// COPILOTA — intelligenza attiva di modulo (v1, 27/07/2026)
// ------------------------------------------------------------
// Ogni modulo della tower espone 4 risposte:
//   1. Cos'è      → che cosa sto guardando e da dove viene il numero
//   2. Oggi dice  → lettura del dato LIVE contro soglie dichiarate PRIMA
//   3. Cosa faccio→ azione condizionata allo stato + istruzione copiabile
//   4. Trappole   → gli errori di lettura tipici di QUESTO dato
//
// Il layer è data-autonomo: rilegge gli stessi endpoint della pagina,
// quindi non tocca nessun componente esistente (mount unico in <main>).
// Le soglie sono scritte nel codice: il verdetto non dipende da come
// il grafico "sembra" oggi.
// ============================================================

const CST = {
    ok:    { c: '#4ade80', bg: '#052e16', l: 'in linea' },
    watch: { c: '#fbbf24', bg: '#2e1f05', l: 'da osservare' },
    bad:   { c: '#f87171', bg: '#2e0505', l: 'fuori soglia' },
    na:    { c: '#71717a', bg: '#1c1c1f', l: 'dato assente' },
};

// helper: riga di lettura
const R = (label, value, state, why) => ({ label, value, state, why });
const num = (v) => (v === null || v === undefined || Number.isNaN(v) ? null : Number(v));
const pct = (v) => (v === null || v === undefined ? '—' : `${Number(v).toFixed(1)}%`);
const band = (v, okMax, watchMax) => (v === null ? 'na' : v <= okMax ? 'ok' : v <= watchMax ? 'watch' : 'bad');
const bandUp = (v, okMin, watchMin) => (v === null ? 'na' : v >= okMin ? 'ok' : v >= watchMin ? 'watch' : 'bad');
const daysAgo = (iso) => { if (!iso) return null; const t = new Date(iso.length <= 10 ? iso + 'T00:00:00Z' : iso).getTime(); return Math.floor((Date.now() - t) / 864e5); };

// ─────────────────────────────────────────────────────────────
// KNOWLEDGE BASE — un'entrata per modulo
// ─────────────────────────────────────────────────────────────
const COACH = {

// ══════════════ OVERVIEW ══════════════
executive: {
    what: "Otto tile che riassumono lo stato dell'ecosistema per una lettura da board. Non è un modulo operativo: qui non si agisce, si decide DOVE guardare. Ogni tile ha una soglia dichiarata e un endpoint sorgente scritto sotto al numero.",
    decides: "Su cosa concentrare la settimana: acquisizione (traffico/IDS), contenuto (CQS/pipeline) o conversione (CPA/mix organic-paid).",
    cadence: "Una lettura a settimana. Più spesso amplifica il rumore.",
    sources: [
        { k: 'metrics', p: '/v1/dashboard/metrics' },
        { k: 'agg',     p: '/v1/executive/aggregates?window_days=7' },
        { k: 'an',      p: '/v1/anomaly/alerts?days=7' },
        { k: 'seo',     p: '/v1/seo/health' },
        { k: 'lake',    p: '/v1/content/lake/stats/summary' },
        // Non produce un tile: serve all'azione sui rossi della catena di misura,
        // per distinguere "il dato non arriva" da "il dato arriva ed è brutto".
        // Path già letto dalla Dashboard KPI: nel Piano viene deduplicato.
        { k: 'traffic', p: '/v1/dashboard/traffic?hours=24' },
    ],
    read: (d) => {
        const rows = [];
        const ids = num(d.metrics?.avg_ids_score);
        rows.push(R('IDS medio', ids === null ? '—' : ids.toFixed(1), bandUp(ids, 45, 25),
            "Quanto è 'caldo' il visitatore medio. Sotto 25 il traffico arriva ma non è qualificato: è un problema di sorgente (dove compri/attiri), non di sito."));

        // marketing_attributions non cresce senza click paid: fuori finestra le due righe
        // qui sotto banderebbero numeri di mesi fa, producendo un'azione che non ha causa.
        const attrAge = num(d.agg?.org_paid_mix_7d?.data_age_days);
        const attrOld = d.agg?.org_paid_mix_7d?.window === 'all_time' || (attrAge !== null && attrAge > 7);
        const preLaunch = attrAge !== null ? `Ultima attribuzione ${attrAge}g fa: l'ADV non è partito.` : "L'ADV non è partito.";

        const cpa = d.agg?.cpa_7d;
        const cpaV = num(cpa?.value);
        rows.push(R('CPA finestra', cpaV === null ? (attrOld ? '— (pre-lancio ADV)' : `— (${cpa?.reason || 'nessun dato'})`) : `€${cpaV}`,
            cpaV === null ? 'na' : band(cpaV, 9, 15),
            attrOld
                ? `Costo per conversione paid. ${preLaunch} Il valore resta indisponibile per costruzione finché non c'è spend: non è un peggioramento da investigare.`
                : "Costo per conversione paid. Il modello regge fino a €17,92; €19,39 è il tetto. Se è '—' non significa buono: significa che non c'è spesa registrata in adv_spend."));

        const mix = d.agg?.org_paid_mix_7d?.value;
        const org = num(mix?.organic_pct);
        rows.push(R('Mix organico', attrOld ? '— (pre-lancio ADV)' : org === null ? '—' : pct(org),
            attrOld ? 'na' : bandUp(org, 60, 35),
            attrOld
                ? `${preLaunch} La percentuale storica (${org === null ? 'n/d' : pct(org)}) descrive l'ultima campagna, non la settimana in corso: non va usata per decidere il mix.`
                : `L'obiettivo del sistema è che il paid faccia da ponte mentre l'organico sale. ${mix ? `Base: ${mix.total} attribuzioni.` : ''} Con meno di 10 attribuzioni la finestra 7g cade su all_time: leggi sempre il campo window.`));

        const c = d.an?.counts || {};
        const crit = num(c.CRITICAL) || 0, warn = num(c.WARNING) || 0;
        rows.push(R('Alert aperti 7g', `${num(d.an?.total) ?? 0} (${crit} crit · ${warn} warn)`,
            crit > 0 ? 'bad' : warn > 0 ? 'watch' : 'ok',
            "Scostamenti rilevati dal cron anomalie (04:15 UTC) su cpa_7d, organic_pct, heritage_mature_cr. Un CRITICAL va guardato oggi, non lunedì."));

        const doms = d.seo?.domains || [];
        const cann = doms.length ? Math.max(...doms.map(x => num(x.cannibalization_score) || 0)) : null;
        rows.push(R('Cannibalizzazione max', cann === null ? '—' : pct(cann), band(cann, 4, 6),
            "Percentuale di keyword per cui due tuoi domini competono fra loro. Sopra il 6% stai pagando due volte per la stessa posizione."));

        const cqs = num(d.lake?.avg_quality_score);
        rows.push(R('Content Quality Score', cqs === null ? '—' : cqs.toFixed(1), bandUp(cqs, 80, 76),
            "Qualità media dei contenuti generati. Sotto 76 il problema è a monte (brief/prompt), non nella revisione."));
        return rows;
    },
    actions: (d, rows) => {
        const a = [];
        const bad = rows.filter(r => r.state === 'bad');
        const crit = num(d.an?.counts?.CRITICAL) || 0;
        if (crit > 0) a.push({
            urgent: true, stage: 1, key: 'alert-critical', title: `Chiudi i ${crit} alert CRITICAL prima di ogni altra cosa`,
            why: "Un CRITICAL è uno scostamento che il sistema non sa spiegare da solo: finché è aperto ogni altra lettura è inaffidabile.",
            prompt: "Apri albeni-master. Recupera gli alert CRITICAL degli ultimi 7 giorni da /v1/anomaly/alerts, per ognuno dimmi: metrica, valore osservato vs atteso, quale modulo della tower lo genera e quale azione lo chiude. Poi proponi l'ordine di intervento.",
        });
        // `state !== 'ok'` comprendeva anche 'na', cioè il pre-lancio ADV: la voce
        // usciva mentre adv_spend è vuota e marketing_attributions ferma. Un ponte
        // paid → organico non si riequilibra se il paid non è mai partito.
        if (rows.find(r => r.label === 'Mix organico' && (r.state === 'bad' || r.state === 'watch'))) a.push({
            stage: 4, key: 'paid-organic', title: "Riequilibra il ponte paid → organico",
            why: "Se l'organico non sale mentre il paid gira, stai comprando traffico senza costruire l'asset.",
            prompt: "Apri adv-budget-allocator. Fammi il report di allocazione corrente e dimmi quali pagine sono ancora sotto copertura paid dopo 30+ giorni: sono i casi in cui l'handoff a organico non è avvenuto. Per ognuna indica se il problema è indicizzazione, contenuto o keyword.",
        });
        if (rows.find(r => r.label === 'Cannibalizzazione max' && r.state !== 'ok')) a.push({
            stage: 4, key: 'cannibalizzazione', title: "Sciogli le sovrapposizioni fra domini",
            why: "Due domini sulla stessa keyword si tolgono posizione a vicenda: è l'unico problema SEO che peggiora facendo più contenuto.",
            prompt: "Apri semrush-specialist. Estrai le keyword in conflitto fra worldofmerino.com, merinouniversity.com e micron-e.com. Per ognuna dimmi quale dominio deve tenerla secondo il ruolo di funnel (WoM=TOFU, MU=MOFU, micron-e=BOFU) e cosa fare sull'altra pagina (de-ottimizzare, canonical o riscrivere l'intento).",
        });
        if (!a.length) a.push({
            stage: 5, key: 'espansione', title: "Nessuna emergenza: usa la settimana per costruire",
            why: "Quando tutti i tile sono in linea la mossa giusta non è ottimizzare, è aggiungere superficie (contenuto nuovo, mercati nuovi).",
            prompt: "Apri albeni-master. Tutti i tile executive sono in soglia. Dimmi qual è il prossimo blocco di lavoro a maggior impatto sui 90 giorni, con le decisioni ancora aperte che lo bloccano.",
        });
        // "Un unico problema a monte" è vero solo se i rossi stanno sulla STESSA
        // catena. IDS, CPA, mix e alert nascono tutti da tracking → ingestion →
        // behavioral_signals: due di loro rossi insieme sono un indizio. La
        // cannibalizzazione (SEO fra domini) e il CQS (qualità del brief) non
        // condividono niente a monte con quella catena né fra loro — e per giunta
        // arrivano da uno snapshot SEMrush, non dalla finestra corrente. Contarli
        // tutti insieme mandava a rifare l'audit tracker/Redis anche quando il
        // problema stava altrove ed era già coperto da un'azione specifica.
        const CATENA_MISURA = ['IDS medio', 'CPA finestra', 'Mix organico', 'Alert aperti 7g'];
        const badMisura = bad.filter(r => CATENA_MISURA.includes(r.label));
        if (badMisura.length > 1) {
            // Se il pannello traffico mostra eventi recenti su tutti i domini
            // l'ingestion sta scrivendo: dirlo evita di far ripartire l'istruzione
            // da una verifica che i dati hanno già escluso.
            const dom = d.traffic?.domains || [];
            const fermi = dom.filter(x => { const g = daysAgo(x.last_event); return g === null || g > 3; });
            const viva = dom.length && !fermi.length;
            a.push({
                stage: 1, key: 'verifica-misurazione', title: `Attenzione: ${badMisura.length} indicatori della catena di misura fuori soglia insieme`,
                why: `${badMisura.map(r => r.label).join(' e ')} nascono dalla stessa catena (tracker → ingestion → behavioral_signals): rossi insieme sono quasi sempre un unico guasto a monte, non due problemi separati.`
                    + (viva ? " L'ingestion però sta scrivendo su tutti i domini, quindi la causa comune non è il trasporto del dato." : ''),
                prompt: "Apri albeni-master. Ho più indicatori executive della catena di misura fuori soglia contemporaneamente"
                    + (viva
                        ? `, ma il pannello traffico mostra eventi recenti su tutti i ${dom.length} domini: l'ingestion sta scrivendo, quindi NON ripartire dall'audit tracker/Redis. Vai al passaggio dopo: qualità della sorgente di traffico e classificazione (IDS per dominio e per canale, distribuzione cluster, stadi di intento). Dimmi se il traffico è davvero poco qualificato o se è la classificazione a sbagliare.`
                        : `${fermi.length ? ` e ${fermi.map(x => x.domain).join(', ')} non emette eventi da oltre 3 giorni` : ''}. Verifica le cause comuni in ordine: tracker attivo sui domini muti, health ml-worker/Redis, ingestion behavioral_signals. Dimmi se è un problema di misurazione o di performance reale.`),
            });
        }
        return a;
    },
    traps: [
        "**Grigio non è rosso.** Un tile senza valore dice «non lo sto misurando», non «va male». Prima di reagire leggi il campo `reason` dell'endpoint.",
        "**La finestra si sposta da sola.** Sotto 10 attribuzioni la finestra 7g cade su `all_time`: un numero che «migliora» può essere solo un campione diverso. Controlla `meta.window_actually_used`.",
        "**Otto tile insieme creano una storia che non esiste.** Il cervello collega numeri vicini nello spazio. Leggili uno alla volta e chiediti per ognuno: quale decisione cambierebbe se fosse il doppio?",
    ],
},

dashboard: {
    what: "I KPI comportamentali in tempo reale: chi sta navigando adesso sui 4 domini, quanto è qualificato (IDS), in che cluster viene classificato e a che punto del funnel si trova. La fonte è la tabella behavioral_signals alimentata dal tracker.",
    decides: "Se il tracking sta funzionando e se il traffico che arriva assomiglia al pubblico per cui hai scritto.",
    cadence: "Sguardo quotidiano di 30 secondi: serve a intercettare i buchi di misurazione, non a valutare le performance.",
    sources: [
        { k: 'metrics', p: '/v1/dashboard/metrics' },
        { k: 'traffic', p: '/v1/dashboard/traffic?hours=24' },
    ],
    read: (d) => {
        const rows = [];
        const doms = d.traffic?.domains || [];
        const ev24 = doms.reduce((s, x) => s + (num(x.events_window) || 0), 0);
        const ev7 = doms.reduce((s, x) => s + (num(x.events_7d) || 0), 0);
        // Soglia relativa alla baseline del sistema, non a un numero fisso: dopo il consenso CMP
        // (23/07) il volume è sceso di circa l'80% e ogni soglia assoluta scritta prima è finzione.
        const base = ev7 / 7;
        const ratio = base > 0 ? ev24 / base : null;
        const ageH = (x) => x.last_event ? (Date.now() - new Date(x.last_event + 'Z').getTime()) / 36e5 : Infinity;
        const live = doms.filter(x => ageH(x) < 72).length;
        const live24 = doms.filter(x => ageH(x) < 24).length;
        rows.push(R('Domini che trasmettono', `${live}/4`, live >= 4 ? 'ok' : live >= 3 ? 'watch' : 'bad',
            `Domini con almeno un evento nelle ultime 72h (${live24} nelle ultime 24h). La finestra è 72h e non 24h perché i domini minori viaggiano sotto i 2 eventi al giorno: a 24h un giorno vuoto è statistica, non guasto. Un silenzio oltre le 72h invece è quasi sempre tracker o ingestion, non calo di traffico.`));
        rows.push(R('Eventi 24h', base > 0 ? `${ev24} · baseline ${base.toFixed(1)}/g` : String(ev24),
            ev24 === 0 ? 'bad' : ratio === null ? 'na' : ratio >= 0.7 ? 'ok' : ratio >= 0.4 ? 'watch' : 'bad',
            "Confrontato con la media giornaliera degli ultimi 7 giorni, non con una soglia fissa: così si ritara da sola quando il volume cambia. Dal consenso CMP questo numero conta i visitatori che accettano, non i visitatori."));
        rows.push(R('Visitatori 7g', String(doms.reduce((s, x) => s + (num(x.visitors_7d) || 0), 0)),
            'na', "Utenti distinti sui 7 giorni. È il campione su cui poggiano cluster e funnel: sotto ~100 le distribuzioni non sono leggibili."));
        const ids = num(d.metrics?.avg_ids_score);
        rows.push(R('IDS medio', ids === null ? '—' : ids.toFixed(1), bandUp(ids, 45, 25),
            "Intent Detection Score: quanto il visitatore medio mostra segnali d'acquisto. Sale con la qualità della sorgente, non con il numero di pagine."));
        const cd = d.metrics?.cluster_distribution || {};
        const top = Object.entries(cd).sort((a, b) => b[1] - a[1])[0];
        const tot = Object.values(cd).reduce((s, x) => s + x, 0);
        rows.push(R('Cluster dominante', top ? `${top[0]} (${tot ? Math.round(top[1] / tot * 100) : 0}%)` : '—', 'na',
            "Il cluster più rappresentato nel traffico. Dice a chi stai parlando di fatto — che spesso non è il cluster per cui hai scritto la pagina."));
        return rows;
    },
    actions: (d, rows) => {
        const a = [];
        const doms = d.traffic?.domains || [];
        const muti = doms.filter(x => !x.last_event || (Date.now() - new Date(x.last_event + 'Z').getTime()) > 2592e5).map(x => x.domain);
        if (muti.length) a.push({
            urgent: true, stage: 1, key: 'tracker-muto', title: `Domini muti da 3+ giorni: ${muti.join(', ')}`,
            why: "Ogni giorno di silenzio è un buco permanente nel dataset: cluster e funnel dei prossimi 30 giorni nasceranno storti.",
            prompt: `Apri albeni-railway-operator. I domini ${muti.join(', ')} non inviano eventi da più di 72h. Verifica in quest'ordine: 1) snippet tracker presente e non bloccato dal CMP, 2) health del ml-worker e di Redis, 3) ingestion in behavioral_signals. Dimmi dove si interrompe la catena.`,
        });
        const ids = num(d.metrics?.avg_ids_score);
        if (ids !== null && ids < 25) a.push({
            stage: 4, key: 'ids-sorgente', title: "IDS basso: il traffico non è qualificato",
            why: "Con IDS sotto 25 stai attirando persone che non comprerebbero comunque. Ottimizzare le pagine non sposta niente: si sposta la sorgente.",
            prompt: "Apri albeni-seo-agent. L'IDS medio è sotto 25. Analizza da quali keyword e canali arriva il traffico attuale e dimmi quali stanno portando visitatori fuori target. Proponi come spostare budget e contenuto verso query a intento più alto, restando nell'envelope EU (DE/IT/FR).",
        });
        a.push({
            stage: 4, key: 'cluster-mismatch', title: "Confronta il cluster che arriva con il cluster per cui scrivi",
            why: "È il controllo anti-bias più utile di questa pagina: la distribuzione reale smentisce spesso l'assunzione di partenza.",
            prompt: "Apri albeni-master. Confronta la distribuzione cluster reale del traffico (da /v1/dashboard/metrics) con la distribuzione dei contenuti pubblicati per cluster. Dove c'è disallineamento dimmi se conviene adattare il contenuto o correggere l'acquisizione.",
        });
        return a;
    },
    traps: [
        "**Il cluster più numeroso non è il più redditizio.** Il volume misura chi passa, non chi compra: incrocia sempre con il CR per cluster (Executive, tile 6) prima di riallocare contenuto.",
        "**Zero eventi ≈ problema tecnico.** Nell'esperienza di questo sistema il traffico non crolla a zero: si interrompe la misurazione. Cerca la causa tecnica prima della spiegazione di marketing.",
        "**24 ore su volumi bassi sono rumore.** Con poche decine di eventi al giorno la variazione giornaliera è casuale. Se devi confrontare, confronta 7g su 7g.",
    ],
},

notion: {

klaviyo: {
    what: "Il ponte fra il comportamento sui domini e il CRM: quando un visitatore lascia un contatto, cluster e IDS lo seguono dentro Klaviyo, così i flussi email parlano la lingua del suo cluster.",
    decides: "Se i lead che raccogli arrivano al CRM completi di contesto comportamentale — o se arrivano nudi, e la mail parte generica.",
    cadence: "Al primo lead di ogni nuova campagna, e dopo ogni modifica al tracker o al consenso CMP.",
    // Il modulo era senza sorgenti: le sue due azioni erano incondizionate e
    // restavano nel Piano per sempre, qualunque cosa dicessero i dati. Adesso
    // legge KlaviyoSyncLog (dentro /v1/dashboard/metrics, path già letto altrove
    // e deduplicato nel Piano): finestra 24h, la stessa cadenza dichiarata qui
    // sopra — la verifica ha senso quando un lead è appena passato, non sempre.
    sources: [{ k: 'metrics', p: '/v1/dashboard/metrics' }],
    read: (d) => {
        const h = d.metrics?.klaviyo_sync_health || {};
        const tot = num(h.last_24h_total), ok = num(h.last_24h_successful), rate = num(h.success_rate);
        // Una riga di KlaviyoSyncLog e' un sync, non una persona: la stessa lead
        // ne genera una per punto di raccolta. Il numero grande e' quello delle
        // persone; i sync restano accanto perche' e' su quelli che si misura il
        // tasso di riuscita.
        const leads = num(h.last_24h_leads), test = num(h.last_24h_test_syncs) || 0;
        const testNote = test
            ? ` Nella stessa finestra ci sono ${test} sync di prova (email test*, visitor probe*), esclusi dal conteggio: sono sessioni di verifica, non contatti.`
            : '';
        return [R('Lead arricchiti 24h',
            tot === null ? '—' : tot === 0 ? '0' : `${leads === null ? tot : leads} (${tot} sync · ${pct(rate)})`,
            tot === null ? 'na' : tot === 0 ? 'na' : bandUp(rate, 95, 80),
            tot === 0
                ? "Nessun lead è passato dalla catena di arricchimento nelle ultime 24h. Zero non è un guasto e non è una conferma: senza lead non c'è niente da segmentare, ma nemmeno niente che provi che la catena funzioni. Se sai che dei contatti sono arrivati, stanno entrando in Klaviyo da un'altra porta (form WP diretto) e nascono senza cluster." + testNote
                : "Persone distinte arrivate in Klaviyo dalla catena, con accanto il numero di sync e la quota riuscita (tabella KlaviyoSyncLog). Un sync fallito non produce un errore visibile: produce un profilo povero, e i flussi segmentati continuano a girare trattando tutti allo stesso modo." + testNote)];
    },
    actions: (d) => {
        const h = d.metrics?.klaviyo_sync_health || {};
        const tot = num(h.last_24h_total) || 0;
        const leads = num(h.last_24h_leads) || 0;
        const test = num(h.last_24h_test_syncs) || 0;
        // Senza un lead passato di recente non c'è niente da ispezionare: chiedere
        // "quale percentuale arriva senza proprietà" su una finestra vuota è una
        // domanda senza risposta possibile. La domanda vera diventa un'altra.
        // I sync di prova non contano come traffico: mandare a indagare il
        // consenso su righe generate dalle proprie verifiche fa diagnosticare
        // un guasto su dati che non descrivono nessun visitatore (29/07).
        if (!tot) return [{
            stage: 1, key: 'klaviyo-porta-ingresso', title: "Nessun lead passa dalla catena di arricchimento",
            why: test
                ? `Il contatore dei sync reali è a zero: le ${test} righe della finestra sono sync di prova. O non arrivano contatti, o arrivano entrando in Klaviyo da un'altra porta (form WP diretto) e in quel caso nascono senza cluster, IDS e lingua.`
                : "Il contatore dei sync è a zero: o non arrivano contatti, o arrivano entrando in Klaviyo da un'altra porta (form WP diretto) e in quel caso nascono senza cluster, IDS e lingua — e nessun flusso segmentato può recuperarli dopo.",
            prompt: "Apri albeni-master. Il contatore KlaviyoSyncLog è a zero nelle ultime 24h (escludendo i sync di prova). Dimmi quali punti di raccolta lead esistono oggi sui domini (form lead magnet, waitlist, chatbot CS) e per ognuno se il contatto passa da /v1/crm/sync-lead o se scrive direttamente su Klaviyo. Per quelli che bypassano l'arricchimento, indica che cosa serve per farli passare dalla catena.",
        }];
        return [
            { stage: 1, key: 'klaviyo-props', title: "Verifica che il cluster arrivi davvero in Klaviyo", why: `${leads} lead (${tot} sync) nelle ultime 24h: è la finestra giusta per controllare. Se la proprietà cluster non è popolata, i flussi segmentati girano ma trattano tutti allo stesso modo, e l'errore non produce alcun errore visibile.`, prompt: "Apri albeni-master. Verifica la catena lead → Klaviyo: quali proprietà comportamentali (cluster, IDS, dominio di origine, lingua) vengono scritte sul profilo e quali flussi le usano davvero come condizione di ingresso. Segnala le proprietà scritte ma mai usate e i flussi che dovrebbero usarle." },
            { stage: 1, key: 'consenso-tracking', title: "Controlla l'effetto del consenso sul tracking", why: "Dal 23/07 il CMP blocca i tracker finché non c'è consenso: chi lascia l'email prima di accettare arriva con IDS 0 e cluster ignoto.", prompt: `Apri albeni-master. Con il CMP Complianz attivo sono passati ${leads} lead (${tot} sync) dalla catena nelle ultime 24h: dimmi quanti hanno le proprietà comportamentali popolate, e per quelli poveri se l'email è stata lasciata prima del consenso. Dal 29/07 un sync senza segnale non sovrascrive più un profilo già arricchito: verifica che la regola tenga anche sui lead veri.` },
        ];
    },
    traps: [
        "**Il silenzio non è successo.** Una sync fallita non genera errori a schermo: genera profili poveri. Verifica sul profilo, non sul log.",
        "**Segmentare senza dati è peggio che non segmentare.** Un flusso «heritage mature» che riceve tutti indistintamente peggiora la deliverability e ti convince che la segmentazione non funziona.",
    ],
},

seo: {
    what: "Lo stato competitivo dei domini con dati SEMrush live: keyword in rank, traffico organico stimato, authority score e il bilanciamento 85/15 fra espansione comportamentale e difesa semantica. Il campo `data_source` dice se il numero è live, da cache Redis o fallback.",
    decides: "Quale dominio spinge, quale difende e dove i tuoi domini si stanno rubando posizioni fra loro.",
    cadence: "Settimanale. I dati SEMrush hanno cache 1h per risparmiare unità API: aggiornare più spesso non porta numeri nuovi.",
    sources: [{ k: 'seo', p: '/v1/seo/health' }],
    read: (d) => {
        const doms = d.seo?.domains || [];
        if (!doms.length) return [R('Domini analizzati', '—', 'na', "Nessun dato SEMrush disponibile: probabile esaurimento unità API o chiave non configurata.")];
        const rows = doms.map(x => R(
            x.domain,
            `${num(x.keywords_in_rank) || 0} kw · AS ${num(x.authority_score) || 0} · cann ${pct(num(x.cannibalization_score))}`,
            band(num(x.cannibalization_score), 4, 6),
            `Ruolo ${x.funnel_stage || '—'} · mercato ${x.semrush_database || '—'} · fonte dato: ${x.data_source || '—'}. Le keyword in rank sono la superficie reale di questo dominio; la cannibalizzazione è quanta di quella superficie si sovrappone a un altro tuo dominio.`
        ));
        const worst = doms.reduce((w, x) => (num(x.cannibalization_score) || 0) > (num(w.cannibalization_score) || 0) ? x : w, doms[0]);
        rows.push(R('Peggiore sovrapposizione', `${worst.domain} · ${pct(num(worst.cannibalization_score))}`, band(num(worst.cannibalization_score), 4, 6),
            "Sopra il 6% due tuoi domini competono sulla stessa query: Google ne sceglie uno, l'altro lavoro è speso a vuoto."));
        return rows;
    },
    actions: (d) => {
        const doms = d.seo?.domains || [];
        const cannBad = doms.filter(x => (num(x.cannibalization_score) || 0) > 6).map(x => x.domain);
        const a = [];
        // L'urgenza presuppone che il numero descriva oggi. Con il piano SEMrush
        // sospeso questi punteggi arrivano da uno snapshot Postgres (`data_source`)
        // che può avere mesi: resta un problema reale da chiudere, ma non è la cosa
        // da fare stamattina, e la voce deve dire su che data si sta decidendo.
        const eta = doms.filter(x => cannBad.includes(x.domain)).map(x => daysAgo(x.fetched_at)).filter(x => x !== null).sort((x, y) => y - x)[0];
        const vecchio = eta !== undefined && eta > 30;
        if (cannBad.length) a.push({
            urgent: !vecchio, stage: 4, key: 'cannibalizzazione',
            title: `Cannibalizzazione sopra soglia: ${cannBad.join(', ')}${vecchio ? ` (misura di ${eta} giorni fa)` : ''}`,
            why: "È l'unico problema SEO che peggiora producendo più contenuto: ogni pagina nuova sullo stesso intento aggrava la sovrapposizione."
                + (vecchio ? ` Attenzione però alla data: il punteggio viene da uno snapshot di ${eta} giorni fa (piano SEMrush sospeso), non dalla settimana in corso — la sovrapposizione di oggi può essere diversa in entrambe le direzioni.` : ''),
            prompt: `Apri semrush-specialist. Estrai le keyword in conflitto per ${cannBad.join(', ')}. Per ognuna: volume, posizione per dominio, intento. Assegna la keyword al dominio corretto secondo il ruolo di funnel e dimmi cosa fare sulla pagina perdente (de-ottimizzare, canonical, riscrivere l'intento o unire).`
                + (vecchio ? ` Nota: il punteggio in tower è di ${eta} giorni fa, quindi rimisura prima di intervenire.` : ''),
        });
        a.push({
            stage: 2, key: 'pesi-cluster', title: "Rimetti i pesi cluster dell'allocator sui mercati veri",
            why: "I pesi in uso sono stati calcolati su US/UK, fuori dall'envelope EU attuale: ogni allocazione di budget parte da una foto sbagliata.",
            prompt: "Apri semrush-specialist. Ricalcola i pesi cluster dell'ADV allocator sui mercati DE/IT/FR (i pesi attuali sono pre-pivot, calcolati su US/UK). Dammi i nuovi pesi per i cluster A–F con il volume e la difficoltà media che li giustificano, pronti da inserire nella config dell'allocator.",
        });
        a.push({
            stage: 4, key: 'perimetro-semantico', title: "Verifica il perimetro semantico da difendere",
            why: "La difesa dei termini proprietari (Invisible Luxury, merino wool t-shirt, cut & sew, 17 micron) è ciò che rende il traffico non replicabile dai competitor.",
            prompt: "Apri semrush-specialist. Verifica la posizione attuale sui termini del perimetro semantico micron-è: brand defense (micron-è, Invisible Luxury) e semantic moat (merino wool t-shirt, cut & sew, 17 micron, Super 120's, base layer). Dimmi dove sono entrati competitor e quali pagine devono difendere ciascun termine.",
        });
        return a;
    },
    traps: [
        "**`data_source: fallback` vuol dire che stai leggendo un numero inventato dal sistema, non da SEMrush.** Controlla sempre il campo prima di trarre conclusioni su una variazione.",
        "**Authority score alto ≠ vendite.** L'AS misura la forza del profilo link, non la propensione all'acquisto di chi arriva. Un dominio BOFU può convertire meglio con AS più basso.",
        "**Più keyword in rank non è meglio.** Le keyword fuori perimetro portano traffico che abbassa l'IDS e sporca i cluster. La superficie va difesa, non allargata a caso.",
    ],
},

semrush_data: {

        return [
            R('Import in archivio', tot === null ? '—' : String(tot), tot ? 'ok' : 'watch',

            R('Dataset classificati', tagged === null ? '—' : `${tagged}${untagged ? ` (${untagged} non classificati)` : ''}`,

                "Un dataset non classificato è invisibile agli agenti: c'è, occupa spazio, ma nessuna analisi lo userà mai."),
            R('Categorie di contesto in uso', catAll === null ? '—' : `${catUse ?? 0}/${catAll}`,
                catAll ? bandUp((catUse || 0) / catAll * 100, 50, 20) : 'na',
                "Tone of voice, glossario, profili cluster, dati competitor: sono le categorie che rendono coerenti gli agenti. Quelle vuote vengono rimpiazzate da assunzioni implicite."),
        ];
    },
    // Le due voci chiedevano di classificare e di datare dataset che non ci sono:
    // l'archivio è a zero import. Su archivio vuoto la domanda non è "classifica",
    // è "gli agenti che leggono il Data Hub stanno lavorando senza contesto".
    actions: (d) => {
        const tot = num(d.ctx?.total_imports_in_hub) || 0;

        if (!tot) return [{
            stage: 2, key: 'datahub-vuoto', title: "Il Data Hub è vuoto: gli agenti girano senza contesto",
            why: "Zero import in archivio e 0 categorie su 13 in uso. Ogni skill che dovrebbe leggere tone of voice, glossario o dati competitor sta rispondendo solo con quello che ha nel prompt — e non lo dichiara.",
            prompt: "Apri semrush-specialist. Il Data Hub è a zero import. Dimmi quali export ho ancora recuperabili in locale (CSV SEMrush, glossario, tone of voice) e ricaricali nelle categorie giuste, partendo da quelle che le altre skill leggono davvero. Se non c'è niente da ricaricare, dimmi quali categorie vanno rigenerate a mano e in che ordine.",

        a.push({ stage: 2, key: 'dataset-eta', title: "Controlla l'età dei dati prima di decidere il budget", why: "Un export di tre mesi fa descrive un mercato che nel frattempo si è mosso: l'errore si propaga silenziosamente in ogni allocazione.", prompt: "Apri semrush-specialist. Elenca i dataset presenti con data di import e mercato. Segnala quelli più vecchi di 60 giorni che vengono ancora usati come base per keyword e budget." });
        return a;
    },
    traps: [
        "**Un dato caricato non è un dato usato.** Il valore si crea al momento della classificazione, non del download.",
        "**I dati pre-pivot sono i più pericolosi.** Sono coerenti, completi e descrivono un'azienda che non esiste più (US/UK, marchio precedente). Vanno archiviati, non lasciati «per riferimento».",

            R('Assegnazioni di routing', routed === null ? '—' : String(routed), routed ? 'ok' : 'watch',

// ══════════════ MONITORAGGIO ══════════════
gsc: {
    what: "Lo storico delle scansioni di indicizzazione: per ogni sito quante URL Google ha indicizzato, quante ha scansionato scartandole e quante non ha mai visitato. È la fotografia di quanto del tuo sito esiste davvero per Google.",
    decides: "Quali pagine hanno bisogno di supporto paid, quali di lavoro tecnico e quali di contenuto migliore.",
    cadence: "Mensile (scansione schedulata il giorno 28, review alle 12:30).",
    sources: [{ k: 'h', p: '/v1/gsc/history' }],
    read: (d) => {
        const scans = d.h?.scans || [];
        if (!scans.length) return [R('Scansioni disponibili', '0', 'na', "Nessuna scansione registrata: il monitor GSC non ha ancora inviato dati.")];
        const bySite = {};
        scans.forEach(s => { if (!bySite[s.site] || (s.date || '') > (bySite[s.site].date || '')) bySite[s.site] = s; });
        const rows = Object.values(bySite).map(s => {
            const rate = s.total_urls ? (s.indexed / s.total_urls * 100) : null;
            return R(s.site, `${pct(rate)} indicizzate · ${s.not_crawled} mai viste`, bandUp(rate, 70, 45),
                `Su ${s.total_urls} URL: ${s.indexed} indicizzate, ${s.crawled_not_indexed} scansionate e scartate, ${s.not_crawled} mai visitate. «Scansionata e scartata» è un giudizio di qualità: Google l'ha letta e non l'ha ritenuta utile. «Mai visitata» è un giudizio di priorità: non è arrivata in fondo alla coda.`);
        });
        const last = Object.values(bySite).map(s => daysAgo(s.date)).filter(x => x !== null).sort((a, b) => a - b)[0];
        rows.push(R('Età dell\'ultima scansione', last === null ? '—' : `${last} giorni`, last === null ? 'na' : band(last, 35, 60),
            "Oltre 35 giorni la foto non descrive più il sito di oggi: le decisioni di budget prese su questi numeri sono decisioni su un sito passato."));
        return rows;
    },
    actions: (d) => {
        const scans = d.h?.scans || [];
        const a = [];
        const bySite = {};
        scans.forEach(s => { if (!bySite[s.site] || (s.date || '') > (bySite[s.site].date || '')) bySite[s.site] = s; });
        const scarti = Object.values(bySite).filter(s => s.total_urls && s.crawled_not_indexed / s.total_urls > 0.2);
        if (scarti.length) a.push({
            urgent: true, stage: 4, key: 'contenuto-scartato', title: `Contenuto scartato da Google: ${scarti.map(s => s.site).join(', ')}`,
            why: "Oltre il 20% di pagine scansionate e non indicizzate è un giudizio esplicito di qualità o duplicazione: aggiungere pagine peggiora il rapporto.",
            prompt: `Apri albeni-wp-operator. Su ${scarti.map(s => s.site).join(', ')} oltre il 20% delle URL è 'crawled but not indexed'. Analizza i pattern comuni (thin content, duplicazione fra lingue, canonical, pagine di archivio) e dammi la lista degli interventi in ordine di impatto.`,
        });
        a.push({
            stage: 4, key: 'gsc-allocator', title: "Copri con il paid solo ciò che Google ancora non vede",
            why: "È l'anello che chiude il ciclo: la scansione GSC è l'input dell'allocatore di budget.",
            prompt: "Apri adv-budget-allocator. Usa l'ultima scansione GSC per rigenerare l'allocazione: budget sulle pagine non indicizzate, rilascio su quelle che nel frattempo sono state indicizzate. Mostrami il delta rispetto al ciclo precedente.",
        });
        // La voce esisteva sempre, anche il giorno stesso della scansione: il titolo
        // diceva "se la foto è vecchia" e il perché parlava di 40 giorni mentre la
        // riga qui sopra leggeva 0. La soglia è già dichiarata nella riga
        // "Età dell'ultima scansione" (35 giorni): si usa quella.
        const eta = Object.values(bySite).map(s => daysAgo(s.date)).filter(x => x !== null).sort((x, y) => x - y)[0];
        if (eta === undefined || eta === null || eta > 35) a.push({
            stage: 1, key: 'gsc-freschezza',
            title: eta == null ? "Nessuna scansione GSC registrata" : `La scansione ha ${eta} giorni: rifalla prima di decidere`,
            why: eta == null
                ? "La tower non ha nessuna scansione in archivio: l'allocatore di budget sta lavorando senza il suo input principale."
                : `Oltre i 35 giorni la foto non descrive più il sito di oggi: allocheresti budget su pagine che nel frattempo possono essere già indicizzate. L'ultima ha ${eta} giorni.`,
            prompt: "Esegui la routine gsc-index-monitor: nuova scansione per worldofmerino.com e merinouniversity.com, push della crawl map e aggiornamento della tower. Poi dimmi cosa è cambiato rispetto all'ultima scansione.",
        });
        return a;
    },
    traps: [
        "**«Non indicizzata» non è un errore da correggere: è un giudizio da capire.** Mai vista = priorità bassa (lavora su link interni e sitemap). Vista e scartata = qualità o duplicazione (lavora sul contenuto). Sono due problemi opposti con la stessa faccia.",
        "**La media nasconde la distribuzione.** Un 80% di indicizzazione può significare che tutte le pagine vecchie sono dentro e tutte le nuove sono fuori — cioè che il lavoro degli ultimi due mesi è invisibile.",
        "**Il numero si muove con settimane di ritardo.** Cercare l'effetto di una modifica il giorno dopo porta a concludere che «non ha funzionato» e a cambiare di nuovo, azzerando l'esperimento.",
    ],
},

funnel: {
    what: "Il percorso reale degli utenti in 6 stadi (visita → engaged → interesse → lead → pre-conversione → conversione), ricostruito dagli eventi comportamentali. Ogni stadio conta utenti distinti, non eventi.",
    decides: "Dove si perde più valore, e quindi quale singola correzione vale più di dieci ottimizzazioni sparse.",
    cadence: "Ogni 2 settimane su finestra 30 giorni. Su 7 giorni il campione è quasi sempre troppo piccolo.",
    sources: [{ k: 'f', p: '/v1/funnel/journey?period=30d' }],
    read: (d) => {
        const f = d.f || {};
        const stages = f.stages || [];
        if (!stages.length) return [R('Dati funnel', '—', 'na', "Nessun evento nella finestra: verifica tracker e ingestion prima di interpretare.")];
        const rows = [];
        // Distinzione decisiva: "nessuno converte" e "quello stadio non è misurato" hanno lo stesso
        // aspetto (zero) e richiedono azioni opposte. Se da uno stadio in poi è tutto zero, il funnel
        // è strumentato solo fino a lì: leggerlo come conversione mancata manda a ottimizzare il nulla.
        const attivi = stages.filter(s => (num(s.users) || 0) > 0).length;
        const oltre = stages.slice(2).some(s => (num(s.users) || 0) > 0);
        const cr = num(f.overall_conversion_pct);
        if (oltre) {
            rows.push(R('Conversion rate', cr === null ? '—' : `${cr}%`, bandUp(cr, 1, 0.3),
                "checkout_complete su page_view. Nel D2C abbigliamento l'1% è una soglia di normalità: sotto lo 0,3% il problema è a monte della pagina prodotto."));
            rows.push(R('Stadi attivi', `${attivi}/6`, bandUp(attivi, 5, 3),
                "Uno stadio vuoto è quasi sempre un evento non tracciato, non un comportamento assente: prima di riprogettare il sito, verifica che l'evento venga inviato."));
            const withDrop = stages.map((s, i) => ({ s, i })).filter(x => x.i > 0 && num(x.s.drop_off_pct) > 0);
            if (withDrop.length) {
                const worst = withDrop.reduce((w, x) => num(x.s.drop_off_pct) > num(w.s.drop_off_pct) ? x : w);
                const prev = stages[worst.i - 1];
                const persi = (num(prev.users) || 0) - (num(worst.s.users) || 0);
                rows.push(R('Drop-off maggiore', `${prev.label} → ${worst.s.label}: −${worst.s.drop_off_pct}%`,
                    band(num(worst.s.drop_off_pct), 30, 60),
                    `Percentuale più alta di abbandono. In valore assoluto sono ${persi} utenti persi: è questo il numero che decide se vale la pena intervenire, non la percentuale.`));
            }
        } else {
            const ultimo = stages[attivi - 1];
            rows.push(R('Copertura della misurazione', `strumentato fino a "${ultimo ? ultimo.label : '—'}"`, 'na',
                `Dallo stadio "${stages[2] ? stages[2].label : '3'}" in poi non c'è nessun utente: non zero conversioni, proprio nessun evento. Finché è così, un conversion rate qui non è un dato — sarebbe una divisione per uno stadio che non viene misurato. Il checkout non esiste ancora (store dietro coming-soon, pre-order dal 01/09), ma i lead magnet su WoM e MU dovrebbero poter generare lo stadio Lead: è quello il primo da verificare.`));
            rows.push(R('Stadi misurati', `${attivi}/6`, 'na',
                `${stages.slice(0, attivi).map(s => `${s.label} ${s.users}`).join(' → ')}. Questi due stadi sono leggibili e dicono una cosa vera: ${stages[1] ? Math.round((num(stages[1].users) || 0) / Math.max(1, num(stages[0].users) || 1) * 100) : 0}% dei visitatori supera la soglia di ingaggio.`));
        }
        const tot = num(f.total_events_in_window) || 0;
        rows.push(R('Eventi nella finestra', String(tot), tot >= 300 ? 'ok' : tot >= 100 ? 'watch' : 'bad',
            "Campione su 30 giorni. Sotto ~100 eventi le percentuali di questo funnel oscillano troppo per guidare una decisione."));
        return rows;
    },
    actions: (d) => {
        const f = d.f || {};
        const stages = f.stages || [];
        const a = [];
        const oltre = stages.slice(2).some(s => (num(s.users) || 0) > 0);
        if (!oltre && stages.length) {
            a.push({
                stage: 1, key: 'funnel-strumentazione', title: "Verifica se gli stadi oltre Engaged esistono davvero",
                why: "Quattro stadi su sei sono a zero utenti, non a pochi. Prima di qualunque intervento sul percorso va stabilito se quegli eventi non vengono emessi o se non vengono proprio generati: sono due problemi opposti e da qui hanno lo stesso aspetto.",
                prompt: "Apri albeni-master. Nel funnel gli stadi da 'Interesse Attivo' in poi sono a zero utenti su 30 giorni. Dimmi per ciascuno quali event_type lo alimentano, se il tracker li emette oggi su WoM/MU/micron-e e quali sono strutturalmente impossibili adesso (checkout assente fino al pre-order del 01/09). In particolare verifica lo stadio Lead: i lead magnet con form Klaviyo su WoM e MU dovrebbero poterlo generare.",
            });
        }
        const withDrop = oltre ? stages.map((s, i) => ({ s, i })).filter(x => x.i > 0 && num(x.s.drop_off_pct) > 0) : [];
        if (withDrop.length) {
            const worst = withDrop.reduce((w, x) => num(x.s.drop_off_pct) > num(w.s.drop_off_pct) ? x : w);
            const prev = stages[worst.i - 1];
            a.push({
                stage: 4, key: 'funnel-collo', title: `Lavora sul passaggio ${prev.label} → ${worst.s.label}`,
                why: "È il collo di bottiglia misurato: qualunque altro miglioramento a valle riceve comunque il flusso ridotto da questo punto.",
                prompt: `Apri albeni-master. Nel funnel il drop-off maggiore è fra "${prev.label}" e "${worst.s.label}" (−${worst.s.drop_off_pct}%, ${(num(prev.users) || 0) - (num(worst.s.users) || 0)} utenti persi in 30 giorni). Dimmi quali pagine e quali cluster contribuiscono di più a questa perdita e proponi 3 interventi in ordine di rapporto impatto/sforzo.`,
            });
        }
        if (oltre) a.push({
            stage: 4, key: 'funnel-segmenta', title: "Segmenta prima di concludere",
            why: "Il funnel aggregato mescola cluster e domini con comportamenti opposti: la media descrive un utente che non esiste.",
            prompt: "Apri albeni-master. Confronta il funnel per cluster e per dominio (endpoint /v1/funnel/journey/by-cluster e by-domain, 30 giorni). Dimmi dove i comportamenti divergono di più e quale segmento merita un percorso dedicato.",
        });
        return a;
    },
    traps: [
        "**La percentuale più alta non è il problema più grande.** Un −70% su 20 utenti pesa meno di un −25% su 900. Guarda sempre gli utenti persi in valore assoluto.",
        "**Uno stadio vuoto sembra un problema di prodotto ed è quasi sempre un evento non tracciato.** Verifica la strumentazione prima di riprogettare qualcosa.",
        "**Gli eventi di test sono esclusi per default.** Se un numero sembra troppo bello, controlla di non aver attivato `include_test`.",
    ],
},

logs: {
    what: "Salute dei servizi, catalogo degli endpoint e log di sistema. È il posto dove si verifica se un dato mancante altrove è un problema di infrastruttura.",
    decides: "Se ciò che vedi altrove è un fatto o un guasto.",
    cadence: "Quando un numero altrove è zero o assente.",
    sources: [{ k: 'metrics', p: '/v1/dashboard/metrics' }],
    read: () => [R('Uso previsto', 'verifica infrastruttura', 'na',
        "Regola pratica del sistema: prima di spiegare un calo con il marketing, escludi ingestion, Redis e tracker. Nella storia di questo progetto la causa è stata tecnica molto più spesso che commerciale.")],
    actions: () => ([
